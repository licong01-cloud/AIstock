services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: aistock-agentsearch-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - agent-search

  api:
    # Build this image from the approved free/self-hosted AgentSearch source,
    # or override AGENTSEARCH_IMAGE with an ops-managed local image tag.
    image: ${AGENTSEARCH_IMAGE:-agent-search-api:latest}
    container_name: aistock-agentsearch-api
    restart: unless-stopped
    depends_on:
      - searxng
    env_file:
      - agentsearch.env
    ports:
      - "127.0.0.1:${AGENTSEARCH_PORT:-3939}:3939"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CACHE_TTL=${CACHE_TTL:-3600}
      - RATE_LIMIT=${RATE_LIMIT:-60}
      - ADAPTERS_DIR=/app/adapters
      - AGENT_SEARCH_TOKEN=${AGENT_SEARCH_TOKEN:-}
    volumes:
      - agent-search-data:/app/data
      - ./adapters:/app/adapters:ro
    networks:
      - agent-search

networks:
  agent-search:
    driver: bridge

volumes:
  agent-search-data:
