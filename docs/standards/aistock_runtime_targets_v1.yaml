schema_version: aistock_runtime_target_catalog_v1
updated_at: "2026-10-06"
policy:
  backend_restart_owner: user
  process_control_default: forbidden_without_explicit_target_authorization
  post_restart_verify_mode: read_only
  tracked_artifact_writes: forbidden
non_runtime_source_paths:
  - backend/services/advisory_model_first/qe_alpha_generator_contracts.py
  - backend/services/advisory_model_first/qe_alpha_generator_pipeline.py
  - backend/services/advisory_model_first/historical_price_replay.py
  - backend/services/advisory_model_first/historical_price_replay_cli.py
  - backend/services/advisory_model_first/historical_price_replay_contracts.py
  - backend/services/advisory_model_first/score_hmm_admission_pipeline.py
  - backend/services/advisory_model_first/selection_liability_gate_pipeline.py
  - backend/services/advisory_model_first/turnover_constrained_utility_training.py
  - backend/services/advisory_phase0b/audit_service.py
  - backend/services/advisory_phase0b/snapshot_reader.py
  - backend/services/announcements/title_classifier.py
  - backend/services/dataset_release/direct_monthly.py
  - backend/services/dataset_release/daily_basic_history_repair.py
  # CLI-only canonical PIT evidence/preparation: no server/worker entrypoint.
  - backend/services/dataset_release/canonical_pit_candidate_bundle.py
  - backend/services/dataset_release/canonical_pit_w8_attestation.py
  - backend/services/dataset_release/canonical_pit_activation_envelope.py
  - backend/services/dataset_release/canonical_pit_migration.py
  - backend/services/event_signal/st_announcement_adapter.py
  - backend/services/hmm_risk/rotation_l1_gbdt.py
  - backend/services/hmm_risk/rotation_l1_input_bundle.py
  - backend/services/hmm_risk/stock_fact_repository.py
  - backend/services/position_timing/action_value_corporate_actions.py
  - backend/services/position_timing/pattern_research.py
  - backend/services/position_timing/pattern_universe_benchmark.py
  - backend/services/validation/catalog_integrity.py
  - backend/services/validation/plan_catalog.py
  - noxfile.py
  - scripts/aistock_runner_health.py
  - scripts/configure_aistock_github_runner.ps1
  - scripts/start_aistock_github_runner.ps1
  - scripts/supervise_aistock_github_runner.ps1
source_role_rules:
  - rule_id: offline-operator-scripts
    role: non_runtime
    source_globs:
      - scripts/**/*.py
      - scripts/**/*.ps1
      - scripts/nightly_adaptive_scheduler.py
  - rule_id: offline-backend-research-families
    role: non_runtime
    source_globs:
      - backend/services/advisory_model_first/p0g_anchored_liability_local_reranker_*.py
      - backend/services/hmm_risk/market_relative_*.py
targets:
  backend-main:
    runtime_kind: backend
    source_globs:
      - backend/**/*.py
      - scripts/qe_sector_risk_overlay_strategy.py
      - scripts/score_weighted_strategy.py
      - scripts/score_weighted_strategy_v2.py
      - scripts/qe_sector_risk_overlay_artifacts.py
      - scripts/qe_build_frozen_risk_policy.py
      - scripts/qe_build_frozen_suspend_filter.py
      - scripts/qrun_limit.py
      - scripts/qrun_limit_minute.py
      - aistock_models/**/*.py
      - start_all_ai_stock.bat
      - requirements*.txt
      - pyproject.toml
    production_port: 8001
    isolated_validation_ports: [8011, 8012]
    probe_origins: [http://127.0.0.1:8001, http://localhost:8001]
    operator_runbook_ref: bug_record.runtime_contract.operator_runbook_ref
    expected_identity_ref: merged_commit
    probes:
      health_ref: http://127.0.0.1:8001/api/v1/health
      identity_ref: bug_record.runtime_contract.identity_ref
      business_smoke_ref: bug_record.runtime_contract.business_smoke_ref
      database_readback_ref: bug_record.runtime_contract.database_readback_ref
    startup_budget_seconds: 120
  tdx-go-backend:
    runtime_kind: backend
    source_globs:
      - tdx-api-main/**/*.go
    production_port: 19080
    isolated_validation_ports: [19081, 19082]
    probe_origins: [http://127.0.0.1:19080, http://localhost:19080]
    operator_runbook_ref: bug_record.runtime_contract.operator_runbook_ref
    expected_identity_ref: merged_commit
    probes:
      health_ref: bug_record.runtime_contract.health_ref
      identity_ref: bug_record.runtime_contract.identity_ref
      business_smoke_ref: bug_record.runtime_contract.business_smoke_ref
      database_readback_ref: bug_record.runtime_contract.database_readback_ref
    startup_budget_seconds: 120
  worker-scheduler:
    runtime_kind: worker_scheduler
    probe_mode: http
    source_globs:
      # Unified monthly control plane + child share one user-owned restart:
      # backend/main.py lifespan -> MonthlyReleaseWorkerSupervisor.start().
      # The monthly process probe checks BOTH backend identity and supervised
      # child health; this never marks these sources non-runtime or removes
      # a restart/readback requirement. Unrelated backend routes stay backend-main.
      - backend/routers/monthly_dataset_releases.py
      - backend/services/dataset_release/api_models.py
      - backend/services/dataset_release/monthly_*.py
      - backend/services/dataset_release/candidate_consumer_smoke.py
      - backend/services/dataset_release/qlib_bounded_update.py
      - backend/services/dataset_release/a_share_limit_rule.py
      - backend/services/dataset_release/artifact_ready_build_source.py
      - backend/services/dataset_release/artifact_ready_source.py
      - backend/services/dataset_release/build_processor.py
      - backend/services/dataset_release/build_stage.py
      - backend/services/dataset_release/candidate_validator.py
      - backend/services/dataset_release/canonical_stock_transformer.py
      - backend/services/dataset_release/factor_materializer.py
      - backend/services/dataset_release/source_fact_history.py
      - backend/services/dataset_release/index_contract.py
      - backend/services/dataset_release/index_sources.py
      - backend/services/dataset_release/minute_overlay.py
      - backend/services/dataset_release/process_liveness.py
      - backend/services/dataset_release/profile.py
      - backend/services/dataset_release/resolution_processor.py
      - backend/services/dataset_release/resource_budget.py
      - backend/services/dataset_release/resource_gate.py
      - backend/services/dataset_release/resource_supervisor.py
      - backend/services/dataset_release/sector_data_candidate_source.py
      - backend/services/dataset_release/source_authority.py
      - backend/services/dataset_release/source_pool.py
      - backend/services/dataset_release/component_artifact_manifest.py
      - backend/services/dataset_release/component_manifest_producer.py
      - backend/services/dataset_release/mixed_planner.py
      - backend/services/dataset_release/monthly_construction_facts.py
      - backend/services/dataset_release/monthly_consumer_layout.py
      - backend/services/dataset_release/monthly_local_validation.py
      - backend/services/dataset_release/monthly_worker_nodes.py
      - backend/services/dataset_release/monthly_worker_runtime.py
      - backend/services/dataset_release/stk_limit_overlay.py
      - backend/services/dataset_release/worker.py
      - backend/services/dataset_release/windows_job.py
      - backend/services/dataset_release/wsl_cgroup.py
      - backend/services/dataset_release/wsl_resource_guardian.py
      - backend/services/rdagent_scheduler*.py
      - backend/services/**/*worker*.py
      - scripts/**/*scheduler*.py
      - scripts/dataset_release_worker.py
      - scripts/dataset_release_source_stage.py
      - configs/datasets/migrations/pit_v2_initial_20260731_v1.yaml
    probe_origins: [http://127.0.0.1:8001, http://localhost:8001]
    operator_runbook_ref: bug_record.runtime_contract.operator_runbook_ref
    expected_identity_ref: merged_commit
    probes:
      health_ref: bug_record.runtime_contract.health_ref
      identity_ref: bug_record.runtime_contract.identity_ref
      business_smoke_ref: bug_record.runtime_contract.business_smoke_ref
      database_readback_ref: bug_record.runtime_contract.database_readback_ref
    probe_routes:
      - route_id: monthly_release_worker_process
        source_globs:
          - backend/routers/monthly_dataset_releases.py
          - backend/services/dataset_release/api_models.py
          - backend/services/dataset_release/monthly_*.py
          - backend/services/dataset_release/monthly_construction_facts.py
          - backend/services/dataset_release/candidate_consumer_smoke.py
          - backend/services/dataset_release/qlib_bounded_update.py
          - backend/services/dataset_release/artifact_ready_source.py
          - backend/services/dataset_release/source_authority.py
          - backend/services/dataset_release/artifact_ready_build_source.py
          - backend/services/dataset_release/build_stage.py
          - backend/services/dataset_release/candidate_validator.py
          - backend/services/dataset_release/factor_materializer.py
          - backend/services/dataset_release/source_fact_history.py
          - backend/services/dataset_release/monthly_consumer_layout.py
          - backend/services/dataset_release/monthly_local_validation.py
          - backend/services/dataset_release/monthly_worker_nodes.py
          - backend/services/dataset_release/monthly_worker_runtime.py
        required_source_globs:
          - backend/services/dataset_release/source_authority.py
          - backend/services/dataset_release/monthly_construction_facts.py
          - backend/services/dataset_release/monthly_consumer_layout.py
          - backend/services/dataset_release/monthly_local_validation.py
          - backend/services/dataset_release/monthly_worker_nodes.py
          - backend/services/dataset_release/monthly_worker_runtime.py
        probe_mode: monthly_release_worker_process
        local_probe:
          worker_script: scripts/monthly_unified_dataset_release_worker.py
          worker_mode: --serve
          parent_module: backend.main:app
          parent_port: 8001
        probes:
          health_ref: monthly_worker_process.health
          identity_ref: http://127.0.0.1:8001/api/v1/runtime-identity
          business_smoke_ref: monthly_worker_process.supervision
          database_readback_ref: not_required
      - route_id: dataset_release_worker_heartbeat
        source_globs:
          - backend/services/dataset_release/a_share_limit_rule.py
          - backend/services/dataset_release/artifact_ready_build_source.py
          - backend/services/dataset_release/artifact_ready_source.py
          - backend/services/dataset_release/build_processor.py
          - backend/services/dataset_release/build_stage.py
          - backend/services/dataset_release/candidate_validator.py
          - backend/services/dataset_release/canonical_stock_transformer.py
          - backend/services/dataset_release/factor_materializer.py
          - backend/services/dataset_release/source_fact_history.py
          - backend/services/dataset_release/index_contract.py
          - backend/services/dataset_release/index_sources.py
          - backend/services/dataset_release/minute_overlay.py
          - backend/services/dataset_release/process_liveness.py
          - backend/services/dataset_release/profile.py
          - backend/services/dataset_release/resolution_processor.py
          - backend/services/dataset_release/resource_budget.py
          - backend/services/dataset_release/resource_gate.py
          - backend/services/dataset_release/resource_supervisor.py
          - backend/services/dataset_release/sector_data_candidate_source.py
          - backend/services/dataset_release/source_pool.py
          - backend/services/dataset_release/component_artifact_manifest.py
          - backend/services/dataset_release/component_manifest_producer.py
          - backend/services/dataset_release/mixed_planner.py
          - backend/services/dataset_release/stk_limit_overlay.py
          - backend/services/dataset_release/worker.py
          - backend/services/dataset_release/windows_job.py
          - backend/services/dataset_release/wsl_cgroup.py
          - backend/services/dataset_release/wsl_resource_guardian.py
          - scripts/dataset_release_worker.py
          - scripts/dataset_release_source_stage.py
          - configs/datasets/migrations/pit_v2_initial_20260731_v1.yaml
        probe_mode: dataset_release_worker_heartbeat
        local_probe:
          profile_path: configs/datasets/qe_backtest_monthly_v2.yaml
          max_files: 200
        probes:
          health_ref: worker_heartbeat.health
          identity_ref: worker_heartbeat.identity
          business_smoke_ref: worker_heartbeat.business
          database_readback_ref: not_required
    startup_budget_seconds: 180
