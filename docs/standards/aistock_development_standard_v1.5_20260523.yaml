schema_version: aistock_development_guardrails_v1
source_standard: docs/standards/aistock_development_standard_v1.5_20260523.md
source_sha256: a9aaba566710a187f90c663bb3194228169b089802d372418ed7385ba3afca45
source_digest_normalization: utf8_lf
source_version: "1.5"
updated_at: "2026-08-27"
rule_sync_policy:
  authority: human_markdown_standard
  catalog_role: machine_enforcement_metadata_only
  requirement: Every enabled machine rule references a stable section in the sole human-readable standard.
  source_digest_required: true
  archive_directory: docs/standards/archive
control_taxonomy:
  effects:
    block: Blocks only the declared enforcement phase when the control applies.
    warn: Emits a visible warning without blocking the current phase.
    advisory: Provides non-blocking execution or efficiency guidance.
  enforcement_phases:
    - changed_file_scan
    - task_planning
    - interactive_execution
    - pr_readiness
    - issue_lifecycle
    - design_delivery
    - standard_change
    - production_activation
    - release_deployment
scan:
  default_roots:
    - backend
    - frontend/src
    - debug_tools
    - scripts
    - noxfile.py
    - tests/aistock_validation
    - docs/architecture
    - docs/standards
  text_suffixes:
    - .py
    - .ts
    - .tsx
    - .js
    - .jsx
    - .yaml
    - .yml
    - .json
    - .sql
    - .ps1
    - .sh
    - .md
  skip_parts:
    - .git
    - .next
    - .codex_tmp
    - .pytest_cache
    - .mypy_cache
    - .hypothesis
    - __pycache__
    - node_modules
    - mlruns
    - catboost_info
    - qe_archive/artifacts
    - rdagent_assets
    - docs/standards/archive
rules:
  - rule_id: ARCH-WSL-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-arch-wsl-001
    title: Windows backend reads worker artifacts through owned APIs or artifact storage
    severity: P0
    category: architecture
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - frontend/src/**/*
        - scripts/**/*.py
        - scripts/**/*.ps1
        - scripts/**/*.sh
        - noxfile.py
      exclude_globs:
        - backend/tests/**
        - scripts/aistock_guardrail_scan.py
    checker:
      type: regex
      patterns:
        - '\\{2}wsl(?:\$|\.localhost)'
        - '/mnt/[a-z]/(?:Dev|home|data)/'
    baseline_policy: block_new_only
    remediation: Use worker API or AIstock-owned artifact store with manifest and hash evidence.

  - rule_id: PROD-PORT-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-prod-port-001
    title: Development validation uses isolated ports and production actions require explicit authorization
    severity: P0
    category: production_isolation
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - frontend/src/**/*
      exclude_globs: []
    checker:
      type: regex
      patterns:
        - '(?i)(kill|taskkill|stop-process|restart|uvicorn|Start-Process).{0,120}\b8001\b'
        - '(?i)\b8001\b.{0,120}(kill|taskkill|stop-process|restart|uvicorn|Start-Process)'
    baseline_policy: block_new_only
    remediation: Use dev ports 8011/8012 and 3011/3012; production restart requires explicit user action.


  - rule_id: PROD-DDL-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-prod-ddl-001
    title: Database DDL and DML require existing-DEV validation and action-scoped production authorization that may be bundled with merge
    severity: P0
    category: production_schema
    enabled: true
    effect: block
    enforcement_phase: production_activation
    failure_policy: block_production_ddl_dml_until_dev_validation_and_target_authorization
    checker:
      type: manual_review
      required_evidence:
        - dev_database_ddl_dml_validation
        - no_new_test_database_created
        - no_production_backup_export_or_snapshot_precondition
        - explicit_production_target_authorization
        - exact_authorized_migration_identity
        - authorization_may_be_bundled_with_merge_without_second_prompt
        - immutable_merge_commit_confirmed_before_production_apply
        - production_db_target_preflight_without_secrets
        - committed_migration_files
        - ddl_dml_apply_before_after_schema_checks
        - table_column_index_constraint_comment_verification
        - api_scheduler_log_smoke_after_apply
        - validation_history_record
    baseline_policy: block_release_until_verified
    remediation: Validate DDL/DML in the existing DEV database; an action-scoped target/migration authorization may be bundled with merge and then needs no second prompt. After confirming the immutable merge commit, preflight and apply only that target/migration, record DEV validation, authorization, merge, apply, and readback separately, treat backup/export/snapshot as a separate operations activity, and report production_ddl_gate=noop when no schema change exists.

  - rule_id: ERR-FALLBACK-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-err-fallback-001
    title: Exception paths return structured failure instead of silent or fake success
    severity: P0
    category: error_handling
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - scripts/**/*.py
      exclude_globs:
        - backend/tests/**
        - debug_tools/**
        - scripts/**/*debug*.py
        - scripts/**/*diagnos*.py
    checker:
      type: regex
      patterns:
        - 'except\s+Exception[^\n]*:\s*(?:\n\s*){0,4}return\s+(?:\[\]|\{\}|None|True|False|0)(?:\s|$)'
        - 'except\s+Exception[^\n]*:\s*(?:\n\s*){0,4}pass\b'
    baseline_policy: block_new_only
    remediation: Fail fast with structured status and error context that preserves the business failure.

  - rule_id: TRADING-FALLBACK-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-trading-fallback-001
    title: Trading, backtest, and HMM paths preserve approved business semantics and expose failures
    severity: P0
    category: trading_safety
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - scripts/**/*.py
      exclude_globs:
        - backend/tests/*.py
        - backend/tests/**/*.py
        - backend/**/tests/*.py
        - backend/**/tests/**/*.py
    checker:
      type: regex
      patterns:
        - '(?i)(f[a]llback|downgrade).{0,120}(d[a]ily|day|twap|def[a]ult|neutral)'
        - '(?i)(missing).{0,120}(d[a]ily f[a]llback|twap f[a]llback|neutral coefficient|def[a]ult)'
    baseline_policy: block_new_only
    remediation: Make downgrade explicit, audited, tested, and UI-visible; otherwise fail fast.

  - rule_id: CONFIG-HARDCODE-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-config-hardcode-001
    title: Runtime paths and secrets come from controlled configuration sources
    severity: P1
    category: config
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - frontend/src/**/*
        - scripts/**/*
        - noxfile.py
      exclude_globs:
        - backend/tests/**
    checker:
      type: regex
      patterns:
        - '[A-Za-z]:\\(?:Users|Dev\\AIstock)'
        - '(?i)(password|passwd|secret|api[_-]?key|token)\s*[:=]\s*["''][^"'']{8,}'
    baseline_policy: block_new_only
    remediation: Move paths and secrets to configuration, environment, DB catalog, manifest, or a controlled secret source.

  - rule_id: QE-ARTIFACT-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-qe-artifact-001
    title: QE artifacts require durable manifest metadata instead of raw worker paths only
    severity: P1
    category: qe_data_completeness
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/services/quantevolver/**/*.py
        - backend/services/qe_archive/**/*.py
        - scripts/**/*.py
      exclude_globs:
        - backend/tests/**
    checker:
      type: regex
      patterns:
        - '(?i)(artifact|result_file|workspace).{0,120}(path|uri).{0,120}(without|missing|no).{0,60}(manifest|sha256|hash)'
    baseline_policy: block_new_only
    remediation: Store URI, sha256, size, row_count, schema_version, source, and created_at in artifact manifest.

  - rule_id: UI-RAWJSON-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-ui-rawjson-001
    title: Operator UI presents business views with an optional advanced JSON drawer
    severity: P2
    category: frontend
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - frontend/src/**/*.tsx
        - frontend/src/**/*.ts
      exclude_globs:
        - frontend/src/**/*.test.tsx
        - frontend/src/**/*.spec.tsx
    checker:
      type: regex
      patterns:
        - 'JSON[.]stringify[(]'
        - '<pre\b'
        - 'Json[P]anel'
    baseline_policy: warn_new_only
    remediation: Show Chinese business labels, tables, cards, error states, and optional advanced JSON drawer only.

  - rule_id: UI-DESIGN-SYSTEM-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-ui-design-system-001
    title: New UI follows the approved shadcn-style operator baseline
    severity: P2
    category: frontend
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - frontend/src/**/*.tsx
        - frontend/src/**/*.ts
        - frontend/src/**/*.css
      exclude_globs:
        - frontend/src/app/paper-v2/**/*
        - frontend/src/components/paper-v2/**/*
        - frontend/src/**/*.test.tsx
        - frontend/src/**/*.spec.tsx
    checker:
      type: regex
      patterns:
        - '@/app/paper-v2/paper-v2\.css'
        - '@/components/paper-v2'
        - 'pv2-[A-Za-z0-9_-]+'
    baseline_policy: warn_new_only
    remediation: Use shadcn/ui Blocks-aligned visual tokens and components; Research Assistant may use assistant-ui for conversation runtime but not the Paper v2 visual shell.

  - rule_id: RESOURCE-TIMEOUT-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-resource-timeout-001
    title: External calls and subprocesses need explicit timeout/lifecycle handling
    severity: P2
    category: resource
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - scripts/**/*.py
      exclude_globs:
        - backend/tests/**
    checker:
      type: regex
      patterns:
        - 'requests\.(?:get|post|put|delete|patch)\([^\n)]*$'
        - 'subprocess\.Popen\('
    baseline_policy: warn_new_only
    remediation: Add timeout, cancellation, output capture, and process cleanup.

  - rule_id: DB-COMMENT-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-db-comment-001
    title: New PostgreSQL tables and columns require comments
    severity: P1
    category: database
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    checker:
      type: external
      command_key: db_schema_comment_smoke
    baseline_policy: block_new_and_changed_schema
    remediation: Add COMMENT ON TABLE/COLUMN with business semantics, unit, source, and quality notes.

  - rule_id: ROOT-POLLUTION-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-root-pollution-001
    title: One-off files use debug_tools or tmp while the repository root keeps stable entrypoints
    severity: P1
    category: repository_hygiene
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - "*.py"
        - "*.md"
        - "*.json"
        - "*.csv"
        - "*.log"
        - "*.txt"
        - "*.pkl"
        - "*.parquet"
        - "*.zip"
      exclude_globs:
        - README.md
        - AGENTS.md
        - AGENTS.override.md
        - CHANGELOG.md
        - LICENSE
        - VERSION
        - .mcp.json
        - pyproject.toml
        - package.json
        - package-lock.json
        - pnpm-lock.yaml
        - yarn.lock
        - tsconfig.json
        - noxfile.py
    checker:
      type: path_regex
      patterns:
        - '^[^/]+\.(?:py|md|json|csv|log|txt|pkl|parquet|zip)$'
    baseline_policy: block_new_only
    remediation: Move one-off scripts to debug_tools, analysis docs to docs/analysis, design docs to docs/architecture, or reusable tools to scripts.

  - rule_id: SCRIPT-LOCATION-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-script-location-001
    title: One-off test and diagnostic scripts belong under debug_tools
    severity: P1
    category: repository_hygiene
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - "*.py"
        - scripts/**/*debug*.py
        - scripts/**/*diagnos*.py
        - scripts/**/*tmp*.py
        - scripts/**/*one_off*.py
        - scripts/**/*test_*.py
      exclude_globs:
        - scripts/aistock_guardrail_scan.py
        - scripts/aistock_validate.py
        - scripts/aistock_data_quality_smoke.py
        - scripts/qe_archive_data_quality_smoke.py
    checker:
      type: path_regex
      patterns:
        - '^(?:[^/]+\.py|scripts/.*(?:debug|diagnos|tmp|one_off|test_).+\.py)$'
    baseline_policy: block_new_only
    remediation: Put one-off diagnostics under debug_tools/<module>/<date_or_issue>; reusable business scripts need parameters and tests under scripts.

  - rule_id: DOC-LOCATION-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-doc-location-001
    title: Documentation must live in the approved directory for its type
    severity: P1
    category: documentation
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - "*.md"
        - docs/*.md
      exclude_globs:
        - README.md
        - AGENTS.md
        - AGENTS.override.md
        - CHANGELOG.md
        - docs/codex_project_memory.md
        - docs/standards/**
        - docs/architecture/**
        - docs/analysis/**
        - docs/operations/**
        - docs/user_guides/**
        - docs/releases/**
    checker:
      type: path_regex
      patterns:
        - '^(?:[^/]+\.md|docs/[^/]+\.md)$'
    baseline_policy: block_new_only
    remediation: Move standards to docs/standards, designs to docs/architecture, analysis/research to docs/analysis, operations to docs/operations, user guides to docs/user_guides, and releases to docs/releases.

  - rule_id: MEMORY-DATAFRAME-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-memory-dataframe-001
    title: Large DataFrame and file processing need chunking or bounded scope
    severity: P1
    category: performance_memory
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - scripts/**/*.py
        - debug_tools/**/*.py
      exclude_globs:
        - backend/tests/**
        - scripts/aistock_guardrail_scan.py
    checker:
      type: regex_and_python_loop_contains
      patterns:
        - 'pd\.read_csv\([^)\n]*(?:\n[^)]*)?\)'
        - 'pickle\.load\('
      loop_patterns:
        - 'pd\.concat\('
      max_following_lines: 8
    baseline_policy: warn_new_only
    remediation: For large data paths, add chunking, date/symbol/column bounds, row-count evidence, or justify why the input is small.

  - rule_id: ALGO-COMPLEXITY-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-algo-complexity-001
    title: High-dimensional quant loops and large joins need complexity review
    severity: P2
    category: performance_memory
    enabled: true
    effect: warn
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - backend/**/*.py
        - scripts/**/*.py
        - debug_tools/**/*.py
      exclude_globs:
        - backend/tests/**
        - scripts/aistock_guardrail_scan.py
    checker:
      type: regex
      patterns:
        - '(?m)^[ \t]*for[ \t]+[^\n]+:[ \t]*\n[ \t]+for[ \t]+[^\n]+:[ \t]*\n[ \t]+for[ \t]+[^\n]+:'
        - '\.merge\('
        - '\.join\('
    baseline_policy: warn_new_only
    remediation: Document row-count bounds, join keys, row-explosion risk, and batching/vectorization strategy for large quant workloads.

  - rule_id: DEBUG-FAILFAST-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-debug-failfast-001
    title: Diagnostic scripts must fail fast and return non-zero on failure
    severity: P1
    category: error_handling
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    applies_to:
      include_globs:
        - debug_tools/**/*.py
        - scripts/**/*debug*.py
        - scripts/**/*diagnos*.py
      exclude_globs: []
    checker:
      type: regex
      patterns:
        - 'except\s+Exception[^\n]*:\s*(?:\n\s*){0,4}pass\b'
        - 'except\s+Exception[^\n]*:\s*(?:\n\s*){0,4}return\s+(?:\[\]|\{\}|None|True|False|0)(?:\s|$)'
    baseline_policy: block_new_only
    remediation: Print structured diagnostic context and exit non-zero when one-off scripts fail.
  - rule_id: FEATURE-WORKFLOW-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-feature-workflow-001
    title: New feature development uses tiered design and an acceptance matrix mapped to approved requirements
    severity: P1
    category: agent_efficiency
    enabled: true
    effect: block
    enforcement_phase: pr_readiness
    failure_policy: block_feature_pr_readiness_until_design_validation
    checker:
      type: manual_review
      required_evidence:
        - confirmed_feature_delivery_scope
        - feature_tier_declared
        - design_doc_or_feature_card_path
        - design_acceptance_index
        - design_acceptance_matrix
        - no_unapproved_simplified_or_drift_delivery
        - targeted_validation_and_production_gates
    baseline_policy: manual_review_only
    remediation: Use scripts/aistock_feature_workflow.py validate for F0/F1/F2 feature artifacts and resolve unapproved gaps before merge.

  - rule_id: CONTEXT-BUDGET-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-context-budget-001
    title: Context and prompt injection must be tiered, compact, and task-scoped
    severity: P1
    category: agent_efficiency
    enabled: true
    effect: advisory
    enforcement_phase: interactive_execution
    failure_policy: non_blocking_advisory
    checker:
      type: manual_review
      required_evidence:
        - task_tier_module_risk_phase_declared
        - context_pack_or_relevant_files_only
        - no_full_unrelated_prompt_or_history_injection
    baseline_policy: manual_review_only
    remediation: Use task-tier context budget, compact MCP output, design acceptance index, and RTK/log-summary output.

  - rule_id: ISSUE-BATCH-CONTEXT-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-issue-batch-context-001
    title: Compatible related issues should use batch context while preserving per-issue state
    severity: P1
    category: agent_efficiency
    enabled: true
    effect: advisory
    enforcement_phase: task_planning
    failure_policy: non_blocking_advisory
    checker:
      type: manual_review
      required_evidence:
        - batch_id_or_split_reason
        - per_issue_commit_map
        - shared_validation_matrix
        - close_sync_compatibility_signature
        - per_issue_evidence_and_issue_sync
    baseline_policy: manual_review_only
    remediation: Group same-module same-risk same-validation issues in one source batch when safe; close-sync-batch additionally requires identical runtime/activation policy, production/dependency gates, and one shared source PR. Keep backend_restart_required or post-restart receipt BUGs single-issue, and split incompatible modules or gates.

  - rule_id: PROD-DEPENDENCY-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-prod-dependency-001
    title: Production dependency changes require dependency gate verification after main merge
    severity: P1
    category: production_release
    enabled: true
    effect: block
    enforcement_phase: production_activation
    failure_policy: block_runtime_activation_until_dependency_gate_verified
    checker:
      type: manual_review
      required_evidence:
        - changed_dependency_files
        - production_dependency_sync_command
        - package_import_or_ls_verification
        - build_or_import_smoke
    baseline_policy: block_release_until_verified
    remediation: Run frontend/backend dependency gates in the production runtime checkout before declaring restart readiness.

  - rule_id: RDAGENT-RELEASE-IDENTITY-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-rdagent-release-identity-001
    title: RD-Agent deployment uses merged immutable releases and external runtime state
    severity: P1
    category: production_release
    enabled: true
    effect: block
    enforcement_phase: release_deployment
    failure_policy: block_release_deploy_restart_and_verified_claims
    checker:
      type: manual_review
      required_evidence:
        - merged_commit_in_target_branch
        - clean_source_checkout
        - repository_merge_tree_manifest_match
        - immutable_release_path
        - repo_external_rdagent_state_root
        - deployment_receipt
        - atomic_current_pointer
        - separate_source_deploy_restart_runtime_states
        - rollback_target
        - no_source_overlay
    baseline_policy: block_release_until_verified
    remediation: Build RD-Agent from a clean merged commit into an immutable release, keep state under RDAGENT_STATE_ROOT, atomically switch current, persist a receipt, and fail instead of using file overlays.

  - rule_id: TOOL-RTK-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-tool-rtk-001
    title: Interactive windows use supported RTK wrappers for eligible high-output commands without making RTK a gate
    severity: P1
    category: agent_efficiency
    enabled: true
    effect: warn
    enforcement_phase: interactive_execution
    failure_policy: non_blocking_visible_warning
    checker:
      type: manual_review
      required_evidence:
        - eligible_supported_high_output_commands_use_rtk
        - unsupported_unavailable_raw_output_or_wrapper_failure_records_fallback
        - no_rtk_trust_or_ci_dependency
        - untrusted_custom_filter_does_not_disable_builtin_wrappers
        - missing_telemetry_does_not_trigger_probe
    baseline_policy: manual_review_only
    remediation: Use RTK for supported high-output interactive commands; state the bounded fallback reason when unsupported, unavailable, raw output is required, or the wrapper fails, and never make RTK availability a task or CI gate.

  - rule_id: BACKEND-RESTART-OWNERSHIP-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-backend-restart-ownership-001
    title: User backend process control requires explicit per-target authorization
    severity: P0
    category: production_isolation
    enabled: true
    effect: block
    enforcement_phase: changed_file_scan
    failure_policy: block_process_control_and_runtime_verified_claims
    applies_to:
      include_globs:
        - scripts/**/*
        - .codex/**/*
        - .claude/**/*
        - .github/workflows/**/*
        - noxfile.py
      exclude_globs:
        - backend/tests/**
    checker:
      type: regex
      patterns:
        - '(?i)(taskkill|stop-process|restart-service|systemctl\s+(?:start|stop|restart)|docker\s+(?:start|stop|restart)|start-process).{0,160}(backend|uvicorn|8001|19080)'
        - '(?i)(backend|uvicorn|8001|19080).{0,160}(taskkill|stop-process|restart-service|systemctl\s+(?:start|stop|restart)|docker\s+(?:start|stop|restart)|start-process)'
        - '(?i)(python(?:\.exe)?\s+scripts[/\\]_restart_backend\.py|python(?:\.exe)?\s+backend[/\\]main\.py|uvicorn\s+backend\.main:app)'
        - '(?i)(sc(?:\.exe)?|net(?:\.exe)?)\s+(?:start|stop)\s+[^\r\n]*(backend|uvicorn|8001|19080)'
    baseline_policy: block_new_only
    remediation: Reject user-backend process control in the workflow subprocess executor, emit an operator runbook reference, and wait for the user; validation, merge, close-sync, aftercare, and cleanup never authorize backend process control.

  - rule_id: WORKTREE-CLEANUP-EVIDENCE-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-worktree-cleanup-evidence-001
    title: Authorized worktree cleanup finalizes compact durable receipts and removes only manifest-classified transient artifacts
    severity: P1
    category: issue_workflow
    enabled: true
    effect: block
    enforcement_phase: issue_lifecycle
    failure_policy: block_cleanup_done_when_durable_or_unknown_artifacts_or_four_state_drift_remain
    checker:
      type: manual_review
      required_evidence:
        - compact_commit_bound_receipt_persisted
        - source_merge_receipt_v1_persisted_before_source_cleanup
        - runtime_post_restart_receipt_summary_durable_before_local_copy_cleanup
        - ignored_artifact_manifest_classifies_transient_protected_unknown
        - active_process_and_path_boundary_preflight
        - exact_transient_roots_only_no_git_clean_or_wildcard
        - ignored_asset_tree_transients_require_exact_bounded_structural_classifier
        - single_manifest_reused_without_repeated_full_ignored_tree_scan
        - manifest_unchanged_before_purge
        - path_registration_local_remote_four_state_readback
        - bare_merge_does_not_imply_cleanup
    baseline_policy: block_incomplete_cleanup_claim_only
    remediation: Persist a commit-bound source_merge_receipt_v1 in the close-sync BUG JSON/PR before source cleanup; keep runtime-pending close-sync open until post-restart verification, purge only exact manifest-classified transient roots under an explicitly authorized cleanup, fail closed on protected or unknown artifacts, then verify path, registration, local branch, and remote branch absence.

  - rule_id: BUG-RESTART-EFFECTIVE-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-bug-restart-effective-001
    title: Runtime BUG fixes persist across restart and pass post-restart read-only verification
    severity: P0
    category: issue_workflow
    enabled: true
    effect: block
    enforcement_phase: issue_lifecycle
    failure_policy: block_issue_close_sync_and_verified_claims
    checker:
      type: manual_review
      required_evidence:
        - runtime_impact_classified_or_unknown_fail_closed
        - explicit_contract_cannot_downgrade_changed_file_inference
        - exact_single_runtime_target_or_split_bug
        - persistent_fix_basis
        - durable_fresh_process_load_evidence_in_bug_and_pr
        - runtime_target_catalog_ref
        - existing_repo_operator_runbook_ref
        - runtime_source_pr_uses_refs_not_closes
        - runtime_batch_path_blocked
        - runtime_identity_match
        - catalog_origin_limited_post_restart_probes
        - complete_digest_bound_post_restart_business_smoke
        - database_readback_when_required
        - no_probe_response_body_in_receipt
        - tracked_bug_close_sync_after_runtime_gate
        - github_issue_open_while_runtime_pending
        - close_sync_worktree_current_with_origin_main
    baseline_policy: block_issue_verified_until_post_restart_passed
    remediation: Keep the BUG fixed_source_pending_user_restart until the user restarts the catalog target and post-restart read-only identity and smoke evidence passes.

  - rule_id: CI-ENVIRONMENT-PARITY-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-ci-environment-parity-001
    title: CI uses a prebuilt Windows AIstock-CI environment and never installs project dependencies
    severity: P0
    category: ci_efficiency
    enabled: true
    effect: block
    enforcement_phase: pr_readiness
    failure_policy: block_ci_when_prebuilt_environment_is_missing_or_drifted
    checker:
      type: external
      command_key: ci_workflow_policy_scan
      required_evidence:
        - windows_self_hosted_runner
        - prebuilt_aistock_ci_environment
        - environment_fingerprint_match
        - no_setup_actions
        - no_dependency_install_commands
        - nox_ci_install_fail_closed_guard
        - policy_scanner_environment_and_nox_contract_checks
        - pr_quality_no_external_report_action_dependency
        - superseded_pr_runs_cancel_in_progress
        - bounded_pr_base_fetch_retry
        - non_security_quality_lanes_run_once_on_pull_request
        - codeql_default_branch_security_scan_preserved
        - codeql_uses_hash_verified_prebuilt_bundle
        - codeql_remote_action_download_is_eliminated
        - codeql_exact_local_workspace_fetch_is_bounded
        - codeql_pr_test_only_analysis_is_skipped_without_weakening_main_push
        - code_intelligence_refresh_is_scheduled_or_manual_only
        - code_intelligence_refresh_has_no_external_artifact_action_dependency
        - javascript_actions_use_approved_native_node24_majors
        - pr_ci_no_separate_failure_publisher_job
        - pr_ci_no_external_artifact_action_dependency
        - pr_workflows_no_external_report_action_dependency
        - no_linux_or_production_environment_fallback
        - windows_git_bash_shell
    baseline_policy: block_new_and_changed_workflow
    remediation: Require PR-based main updates, provision the versioned Windows AIstock-CI runner with Git Bash and a hash-verified local CodeQL bundle, invoke the verified CodeQL CLI directly without remote actions, fail closed on mismatch, run source quality lanes once on the PR merge tree, and never install or download mutable toolchains in the CI job.

  - rule_id: CI-DATABASE-SAFETY-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-ci-database-safety-001
    title: CI never creates a database or service and routes database validation to the existing DEV database
    severity: P0
    category: ci_database_safety
    enabled: true
    effect: block
    enforcement_phase: pr_readiness
    failure_policy: block_ci_database_service_or_unrouted_database_plan
    checker:
      type: external
      command_key: ci_workflow_policy_scan
      required_evidence:
        - no_workflow_services
        - no_postgres_or_timescaledb_container_creation
        - classifier_dev_db_required_output
        - existing_dev_database_lane_reference
        - no_ci_ddl_or_dml
        - no_sqlite_substitution_for_real_database_contract
        - nightly_dr_operational_lane_is_explicit_and_does_not_create_or_start_database
    baseline_policy: block_new_and_changed_workflow
    remediation: Mark database plans as dev_db_required and run them through the existing DEV database lane; keep CI source checks database-free.

manual_review_controls:
  - control_id: DESIGN-COMPLIANCE-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-design-compliance-001
    severity: P0
    title: "Completed implementation records four explicit checks against approved requirements: complete delivery, visible failures, preserved business semantics, and approved gates or approvals."
    effect: block
    enforcement_phase: pr_readiness
    control_kind: composite_manual_review
    machine_evidence_refs:
      - ERR-FALLBACK-001
      - TRADING-FALLBACK-001
    required_evidence:
      - no_simplified_delivery
      - no_silent_error
      - no_business_semantic_drift
      - no_unrequested_gate_or_approval
    failure_policy: block_complete_pr_merge_and_verified_claims
  - control_id: ISSUE-GITHUB-SYNC-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-issue-github-sync-001
    severity: P1
    title: New BUG or Issue records must be synchronized to GitHub and include github_issue_number and github_issue_url before merge.
    effect: block
    enforcement_phase: issue_lifecycle
    failure_policy: block_bug_record_merge_and_close_sync
  - control_id: DESIGN-MAIN-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-design-main-001
    severity: P1
    title: Completed detailed design deliverables must be validated, committed, and pushed to origin/main unless explicitly exempted.
    effect: block
    enforcement_phase: design_delivery
    failure_policy: block_design_complete_claim_and_merge
  - control_id: STD-SYNC-001
    standard_ref: docs/standards/aistock_development_standard_v1.5_20260523.md#rule-std-sync-001
    severity: P1
    title: Human-readable standard, machine-readable YAML, and task-relevant client entrypoints stay aligned without unrelated-lane blocking or repeated broad installs.
    effect: block
    enforcement_phase: standard_change
    required_evidence:
      - markdown_and_yaml_updated_together
      - full_client_hash_verification_after_entrypoint_merge
      - canonical_main_origin_aligned_client_authority
      - client_authority_paths_clean_without_unrelated_root_dirty_blocking
      - canonical_workflow_cli_for_inflight_verification
      - checkout_relation_separate_from_profile_status
      - selected_router_and_lane_only_block_active_task
      - unrelated_lane_staleness_warning_only
      - explicit_client_profile_target
      - single_owner_sync_with_verify_only_peer_windows
      - task_worktree_never_used_as_global_install_source
      - idempotent_lock_protected_staged_client_sync
      - restart_only_when_recommended_or_client_ui_stale
    failure_policy: block_standard_pr_merge_and_client_current_claims
