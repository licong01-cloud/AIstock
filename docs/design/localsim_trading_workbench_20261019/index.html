function monitorView(key){const a=accounts[key],ps=positions(a),ts=accountTrades(key);return `<div class="toolbar" style="padding-top:12px"><span class="sub">并列查看持仓、成交、委托和运行进度 · 当前账户 ${a.account} · 所有分区绑定同一账户</span><button class="btn link" onclick="navigate('${key}','holdings')">返回持仓分析视图</button></div><div class="monitor-layout"><section class="monitor-box"><h3>持仓 <span class="muted tiny">6 只 · ${a.valuation} 估值</span></h3><div class="tablewrap"><table><thead><tr><th>股票</th><th class="right">数量</th><th class="right">成本价</th><th class="right">估值价</th><th class="right">浮动盈亏</th></tr></thead><tbody>${ps.map((p,i)=>`<tr><td class="stock"><button onclick="openStock('${key}',${i})"><b>${p.name}</b><small>${p.code.endsWith(".SH")?"上海市场":"深圳市场"}</small></button></td><td class="right">${money(p.qty,0)}</td><td class="right">${money(p.cost,3)}</td><td class="right">${money(p.price)}</td><td class="right ${cls(p.pnl)}">${signed(p.pnl,0)}</td></tr>`).join('')}</tbody></table></div></section><section class="monitor-box"><h3>最近成交 <a style="float:right;font-weight:400" href="${route(key,'trades')}">完整记录 ›</a></h3><div class="tablewrap"><table><thead><tr><th>时间</th><th>股票</th><th>方向</th><th class="right">数量</th><th class="right">价格</th></tr></thead><tbody>${ts.slice(0,5).map(t=>`<tr><td class="tiny">${t.date.slice(5)}<div class="muted">${t.time}</div></td><td class="stock"><b>${t.name}</b><small>${t.code.endsWith(".SH")?"上海市场":"深圳市场"}</small></td><td class="${t.side==='买入'?'up':'down'}">${t.side}</td><td class="right">${money(t.qty,0)}</td><td class="right">${money(t.price)}</td></tr>`).join('')}</tbody></table></div><div class="tablefooter">仅列最近样本；历史查询使用独立分页和日期筛选</div></section><section class="monitor-box"><h3>委托监控 <a style="float:right;font-weight:400" href="${route(key,'orders')}">全部委托 ›</a></h3><table><thead><tr><th>股票</th><th>方向</th><th class="right">委托 / 成交</th><th>状态</th></tr></thead><tbody><tr><td>宁德时代</td><td class="up">买入</td><td class="right">300 / 300</td><td><span class="pill live">全部成交</span></td></tr><tr><td>示例涨停股</td><td class="up">买入</td><td class="right">1,000 / 0</td><td><span class="pill blocked">交易限制 · 无可用成交量</span></td></tr></tbody></table></section><section class="monitor-box"><h3>运行事件 <a style="float:right;font-weight:400" href="${route(key,'status')}">查看诊断 ›</a></h3><div class="monitor-event"><b>${a.valuation}　交易日处理已完成</b><p>持仓与资金估值截止 ${a.valuation}；刷新时间不会将其更新为今日资产。</p><b style="color:${a.state==='live'?'#168774':'#b87917'}">${a.next}　${a.issue}</b><p>${a.fullnote}</p></div></section></div>`}
function tradeView(key){const sample=accountTrades(key);return `<div class="toolbar"><div class="filters"><input type="date" class="dateinput" id="trade-start" aria-label="成交开始日期" value="${sample.at(-1).date}" onchange="filterTrades()"><span class="muted">—</span><input type="date" class="dateinput" id="trade-end" aria-label="成交结束日期" value="${sample[0].date}" onchange="filterTrades()"><select class="dateinput" id="trade-side" aria-label="成交方向" onchange="filterTrades()"><option value="">全部方向</option><option>买入</option><option>卖出</option></select><input class="search" id="trade-symbol" aria-label="成交股票筛选" placeholder="⌕  股票名称 / 市场" oninput="filterTrades()"></div><button class="btn" onclick="toast('正式导出按账户、日期、股票与完整游标范围生成；不会只导出当前页的记录')">导出成交</button></div><div class="tablewrap"><table><thead><tr><th>成交时间</th><th>股票</th><th>方向</th><th class="right">成交价</th><th class="right">成交数量</th><th class="right">成交金额</th><th class="right">交易费用</th><th></th></tr></thead><tbody id="trade-rows">${tradeRows(sample,key)}</tbody></table></div><div class="tablefooter"><span id="trade-count">示例显示 6 笔成交 · 真实页面支持跨日分页与完整历史查询</span><span>委托与成交分开统计</span></div><div class="pnlnote" style="padding-top:7px">当前为交互样本；单笔成交额及费用可核对，样本列表不代表账户全部历史交易。</div>`}
function tradeRows(rows,key){return rows.map((t,i)=>`<tr><td class="number">${t.date}<div class="tiny muted">${t.time}</div></td><td class="stock"><b>${t.name}</b><small>${t.code.endsWith(".SH")?"上海市场":"深圳市场"}</small></td><td><span class="buysell ${t.side==='买入'?'buy':'sell'}">${t.side}</span></td><td class="right number">${money(t.price)}</td><td class="right number">${money(t.qty,0)}</td><td class="right number">${money(t.price*t.qty)}</td><td class="right number">${money(t.fee)}</td><td><button class="btn link" onclick="openStock('${key}',${Math.max(0,basePositions.findIndex(p=>p.code===t.code))})">明细 ›</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">此筛选下没有示例成交记录</td></tr>'}
function filterTrades(){const start=document.getElementById('trade-start').value,end=document.getElementById('trade-end').value,side=document.getElementById('trade-side').value,q=document.getElementById('trade-symbol').value.toLowerCase();const rows=accountTrades(currentKey).filter(t=>(!start||t.date>=start)&&(!end||t.date<=end)&&(!side||t.side===side)&&(!q||(t.name+t.code+(t.code.endsWith('.SH')?'上海市场':'深圳市场')).toLowerCase().includes(q)));document.getElementById('trade-rows').innerHTML=tradeRows(rows,currentKey);document.getElementById('trade-count').textContent='符合筛选的示例成交 '+rows.length+' 笔 · 完整历史查询待接入';}
function ordersView(key){return `<div class="toolbar"><div class="chips"><span class="chip active">全部委托</span><span class="chip">未完成</span><span class="chip">已成交</span><span class="chip">已撤单</span></div><span class="sub">示例委托日 ${accounts[key].valuation}</span></div><div class="tablewrap"><table><thead><tr><th>委托时间</th><th>股票</th><th>方向</th><th class="right">委托 / 成交数量</th><th>委托状态</th><th>未完成原因</th></tr></thead><tbody><tr><td>10:05:00</td><td>宁德时代 · 深圳市场</td><td class="up">买入</td><td class="right">300 / 300</td><td><span class="pill live">全部成交</span></td><td class="muted">—</td></tr><tr><td>10:06:00</td><td>示例股票 · 演示标的</td><td class="up">买入</td><td class="right">1,000 / 0</td><td><span class="pill blocked">未成交</span></td><td>示例：涨停无可用成交量；属于交易限制，不能据此判定程序失败</td></tr></tbody></table></div><div class="tablefooter"><span>订单生命周期、成交与账务各自保留原语义；此页面不提供手工改状态入口</span></div>`}
function pnlView(key){const all=periodRows(key);return `<div class="toolbar"><div class="filters"><span class="sub">统计区间</span><input type="date" class="dateinput" id="pnl-start" aria-label="盈亏开始日期" value="${all[0].date}" min="${all[0].date}" max="${all.at(-1).date}" onchange="updatePnl()"><span class="muted">—</span><input type="date" class="dateinput" id="pnl-end" aria-label="盈亏结束日期" value="${all.at(-1).date}" min="${all[0].date}" max="${all.at(-1).date}" onchange="updatePnl()"><button class="chip active" onclick="pnlPreset('all')">示例区间</button><button class="chip" onclick="pnlPreset('last')">最近估值日</button></div><span class="sub">每日收盘 · 人民币 · 已计费用</span></div><div id="pnl-data">${pnlData(all,key)}</div>`}
function pnlData(rows,key=currentKey){const all=periodRows(key),base=stats(accounts[key]).nav-all.reduce((s,d)=>s+d.net,0);if(!rows.length)return '<div class="empty">该区间没有示例估值记录；真实页面须区分非交易日、无交易与数据缺失。</div>';const net=rows.reduce((s,d)=>s+d.net,0),unreal=rows.reduce((s,d)=>s+d.unreal,0),fees=rows.reduce((s,d)=>s+d.fees,0),real=net-unreal+fees;const first=all.findIndex(d=>d.date===rows[0].date);const beginning=base+all.slice(0,first).reduce((s,d)=>s+d.net,0),ending=beginning+net;return `<div class="pnlmetrics"><div class="pnlbox"><small>区间净盈亏</small><b class="${cls(net)}">${signed(net,0)}</b><div class="sub">${pct(net/beginning*100)} · 净外部流入为 0</div></div><div class="pnlbox"><small>区间已实现（费用前）</small><b class="${cls(real)}">${signed(real,0)}</b><div class="sub">按账本成本核算</div></div><div class="pnlbox"><small>未实现盈亏变动</small><b class="${cls(unreal)}">${signed(unreal,0)}</b><div class="sub">期末浮盈 − 期初浮盈</div></div><div class="pnlbox"><small>区间交易费用</small><b>${money(fees,0)}</b><div class="sub">佣金、印花税、过户费等</div></div></div><div class="pnlnote">期初资产 ${money(beginning,0)} ＋ 净外部流入 0 ＋ 区间净盈亏 ${signed(net,0)} ＝ 期末资产 ${money(ending,0)}。交易费用已包含在净盈亏内，不再重复扣减。</div><div class="sectionlabel">每日盈亏明细 <span class="muted tiny" style="font-weight:400">可下钻至当日持仓、成交及费用</span></div><div class="tablewrap"><table><thead><tr><th>交易日</th><th class="right">期末总资产</th><th class="right">当日净盈亏</th><th class="right">已实现（费用前）</th><th class="right">未实现变动</th><th class="right">交易费用</th><th></th></tr></thead><tbody>${[...rows].reverse().map(d=>{const n=all.indexOf(d),nav=base+all.slice(0,n+1).reduce((s,x)=>s+x.net,0);return `<tr><td>${d.date}</td><td class="right number">${money(nav,0)}</td><td class="right number ${cls(d.net)}">${signed(d.net,0)}</td><td class="right number ${cls(d.net-d.unreal+d.fees)}">${signed(d.net-d.unreal+d.fees,0)}</td><td class="right number ${cls(d.unreal)}">${signed(d.unreal,0)}</td><td class="right number">${money(d.fees,0)}</td><td><a href="${route(key,'trades')}">当日明细 ›</a></td></tr>`}).join('')}</tbody></table></div><div class="tablefooter"><span>另设“按股票”维度：保留已清仓股票，避免遗漏已实现盈亏</span><button class="btn link tiny" onclick="toast('正式页面按股票列出期初/期末持仓、买卖金额、已实现、浮盈变动、费用和净贡献；清仓股票仍保留')">按股票统计 →</button></div>`}
function updatePnl(){const start=document.getElementById('pnl-start').value,end=document.getElementById('pnl-end').value;if(start>end){document.getElementById('pnl-data').innerHTML='<div class="empty">开始日期不能晚于结束日期</div>';return}document.getElementById('pnl-data').innerHTML=pnlData(periodRows(currentKey).filter(d=>d.date>=start&&d.date<=end));}
function pnlPreset(which){const all=periodRows(currentKey);document.getElementById('pnl-start').value=which==='last'?all.at(-1).date:all[0].date;document.getElementById('pnl-end').value=all.at(-1).date;updatePnl();}
function cashView(key){const a=accounts[key],t=accountTrades(key)[0];return `<div class="toolbar"><span class="sub">资金变动与费用流水 · 示例日期 ${a.valuation}</span><span class="sub">可查看对应成交及分项费用</span></div><div class="tablewrap"><table><thead><tr><th>发生时间</th><th>资金类型</th><th>说明</th><th class="right">变动金额</th><th>业务关联</th></tr></thead><tbody><tr><td>${t.time}</td><td>证券买入</td><td>${t.name} · ${money(t.qty,0)} 股 × ${money(t.price)}</td><td class="right number down">−${money(t.qty*t.price)}</td><td>本次证券买入</td></tr><tr><td>${t.time}</td><td>交易佣金</td><td>按账户执行政策计算</td><td class="right number down">−${money(t.fee)}</td><td>本次买入的费用</td></tr></tbody></table></div><div class="tablefooter"><span>完整界面提供资金类型与日期筛选；佣金、税费分项展示</span><span>样本仅示意展示结构，不代表完整流水</span></div>`}
function statusView(key){const a=accounts[key];return `<div class="panelhead"><div><h2>${a.state==='live'?'账户已接续实时模拟':'回放尚未完成接续'}</h2><div class="sub">业务进度与全局安全检查分别展示</div></div>${pill(a)}</div><div class="eventlist"><div class="event"><span class="muted">已完成交易日</span><div><b>${a.valuation}</b><p>账户持仓、资金及已完成估值以该日期为准。</p></div></div><div class="event"><span class="muted">下一处理交易日</span><div><b>${a.next}</b><p>${a.fullnote}</p></div></div><div class="event"><span class="muted">当前处理事项</span><div><b>${a.issue} <span class="muted tiny" style="font-weight:400;margin-left:8px">${a.problem}</span></b><p>${a.state==='live'?'等待下一交易时段；页面只读刷新。':'处理责任：模拟盘团队核查原任务的接续条件，必要时由数据准备团队复核行情。下方展示最后完成的资产，不代表回放已恢复。'}</p></div></div><div class="event"><span class="muted">实时接续</span><div><b>${a.state==='live'?'已接续':'尚未接续'}</b><p>${a.state==='live'?'已完成交易日和实时绑定需分别核验。':'完成追平后，仍需由后端核验安全切换时点和正式绑定。全局检查通过不代表该账户可以开始交易。'}</p></div></div></div>`}
function openStock(key,index){const a=accounts[key],p=positions(a)[index];document.getElementById('drawer-root').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeStock()"><section class="drawer" role="dialog" aria-modal="true" aria-label="${p.name}持仓明细"><div class="drawerhead"><div><h2>${p.name} <span class="muted" style="font-size:13px;font-weight:400">${p.code.endsWith(".SH")?"上海市场":"深圳市场"}</span></h2><div class="sub">${a.name} · ${a.account} · ${a.valuation}</div></div><button class="btn" aria-label="关闭个股明细" onclick="closeStock()">×</button></div><div class="drawercontent"><span class="sub">账户持仓估值价</span><div class="drawerquote number">${money(p.price)}</div><span class="sub">${a.valuation} 收盘 · 历史持仓使用该日估值，行情缺失须显示原因</span><div class="drawergrid"><div><small>持仓数量</small><b>${money(p.qty,0)}</b></div><div><small>持仓成本价</small><b>${money(p.cost,3)}</b></div><div><small>持仓市值</small><b>${money(p.value,0)}</b></div><div><small>持仓浮动盈亏</small><b class="${cls(p.pnl)}">${signed(p.pnl)}</b></div><div><small>浮盈比例</small><b class="${cls(p.pnl)}">${pct((p.price/p.cost-1)*100)}</b></div><div><small>可卖数量</small><b>${money(p.qty,0)}</b></div></div><h3>这只股票在本账户的交易</h3><div class="sub">设计示例 · 日期和股票筛选继承当前账户</div><table><thead><tr><th>日期</th><th>方向</th><th class="right">数量</th><th class="right">价格</th></tr></thead><tbody>${accountTrades(key).filter(t=>t.code===p.code).map(t=>`<tr><td>${t.date.slice(5)}</td><td class="${t.side==='买入'?'up':'down'}">${t.side}</td><td class="right">${money(t.qty,0)}</td><td class="right">${money(t.price)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">原型未提供该股票的成交样本</td></tr>'}</tbody></table><div class="actions"><button class="btn primary" onclick="stockTrades('${key}',${index})">查看完整交易记录</button><button class="btn" onclick="closeStock();navigate('${key}','pnl')">查看区间盈亏</button></div><h3>历史持仓与盈亏口径</h3><p class="sub">正式页面按所选账户、股票和估值日期查询，可查看每次增减仓、已实现盈亏、费用及区间净贡献；不跨账户拼接，也不把浮动盈亏当成区间净收益。</p></div></section></div>`;document.body.style.overflow='hidden';document.querySelector('[aria-label="关闭个股明细"]').focus();}
function closeStock(){document.getElementById('drawer-root').innerHTML='';document.body.style.overflow='';}
function filterPositions(q){document.querySelectorAll('[data-position]').forEach(row=>row.hidden=!row.dataset.search.toLowerCase().includes(q.toLowerCase()));}
function filterAccounts(button){if(button){document.querySelectorAll('#overview-filters .chip').forEach(b=>b.classList.remove('active'));button.classList.add('active')}const filter=document.querySelector('#overview-filters .active')?.dataset.filter||'all',q=document.querySelector('[aria-label="搜索策略账户"]')?.value?.toLowerCase()||'';document.querySelectorAll('[data-account]').forEach(row=>row.hidden=(filter!=='all'&&row.dataset.state!==filter)||!row.textContent.toLowerCase().includes(q));}
function setChart(button,key,period){button.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');document.getElementById(key==='overview'?'overview-chart':'account-chart').innerHTML=chart(key,period);}
let toastTimer;function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4300);}
function render(){closeStock();const parts=decodeURIComponent(location.hash).replace(/^#/,'').split('/');const selected=Object.keys(accounts).find(key=>accounts[key].name===parts[1]);const isDetail=parts[0]==='策略'&&!!selected;const key=isDetail?selected:'lstm',tab=Object.keys(tabNames).find(id=>tabNames[id]===parts[2])||'holdings';document.getElementById('content').classList.toggle('terminal-mode',isDetail&&tab==='monitor');document.getElementById('content').innerHTML=isDetail?detail(key,tab):overview();document.getElementById('nav-overview').classList.toggle('selected',!isDetail);document.getElementById('nav-strategy').classList.toggle('selected',!!isDetail);document.title=(isDetail?accounts[key].name:'模拟盘总览')+' · AIstock 设计预览';if(isDetail&&tab==='trades'&&stockSelection?.key===key){document.getElementById('trade-symbol').value=basePositions.find(p=>p.code===stockSelection.code).name;filterTrades();}else if(isDetail&&stockSelection?.key!==key){stockSelection=null;}window.scrollTo(0,0);}
window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeStock()});render();
</script>
</body>
</html>
