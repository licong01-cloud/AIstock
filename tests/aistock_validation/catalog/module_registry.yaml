schema_version: aistock_module_registry_v1
modules:
  - module_id: qe
    display_name: QE
    module_type: product_feature
    risk_level: high
    description: QuantEvolver experiment, evolution, factor, model, runtime, and archive workflows.
    description_zh: 覆盖 QuantEvolver 的实验创建、自动/自定义演进、因子模型组合、运行状态、增强指标与归档分析，是 AIstock 量化研究的核心入口。
    ui_routes: [/quantevolver, /quantevolver/templates, /qe-archive]
    api_routes: [/api/v1/quantevolver/*, /api/v1/qe-archive/*]
    test_plans:
      required_on_change: [l0]
      recommended: [qe_read_l3, qe_data_contract_backend, qe_archive_l3, qe_mcp_backend]
  - module_id: qe.core
    display_name: QE core services
    parent_module: qe
    module_type: technical_layer
    risk_level: high
    description: Shared QE service layer and runtime contracts.
    description_zh: 覆盖 QE 共享服务层、运行时配置、任务编排、完成回调与跨实验契约，为各类 QE 实验提供统一基础能力。
    test_plans:
      required_on_change: [l0, qe_read_l3]
  - module_id: qe.single_experiment
    display_name: QE single experiment
    parent_module: qe
    module_type: product_feature
    risk_level: high
    description: QE one-off experiment creation, execution status, and detail display.
    description_zh: 覆盖 QE 单次实验的创建、配置快照、执行状态同步、详情展示和结果读取。
    ui_routes: [/quantevolver, /quantevolver/compose, /quantevolver/experiments, /quantevolver/templates]
    api_routes: [/api/v1/quantevolver/*]
    test_plans:
      required_on_change: [l0, qe_read_l3]
      recommended: [qe_data_contract_backend]
  - module_id: qe.custom_evolution
    display_name: QE custom evolution
    parent_module: qe
    module_type: product_feature
    risk_level: high
    description: QE user-defined loop evolution and rerun workflows.
    description_zh: 覆盖用户自定义 loop 演进、选中 loop 复跑、参数调整和组合探索流程。
    ui_routes: [/quantevolver/evolution]
    test_plans:
      required_on_change: [l0, qe_read_l3]
  - module_id: qe.auto_evolution
    display_name: QE auto evolution
    parent_module: qe
    module_type: product_feature
    risk_level: high
    description: QE automated loop evolution and agent orchestration.
    description_zh: 覆盖自动演进、智能体编排、候选生成、SOTA/优先级判断和自动化 loop 调度。
    ui_routes: [/quantevolver/evolution, /quantevolver/evolution/sota, /quantevolver/multi-alpha/diagnostics, /quantevolver/multi-alpha/evolve-wizard]
    test_plans:
      required_on_change: [l0, qe_read_l3]
  - module_id: qe.enhanced_metrics
    display_name: QE enhanced metrics
    parent_module: qe
    module_type: data_pipeline
    risk_level: high
    description: QE loop result metrics, position audits, trades, and training summaries.
    description_zh: 覆盖 QE loop 的增强指标、持仓审计、交易明细、训练摘要、收益曲线和结果完整性展示。
    ui_routes: [/quantevolver/experiments, /qe-archive]
    test_plans:
      required_on_change: [l0, qe_data_contract_backend, qe_read_l3]
  - module_id: qe.data_completeness
    display_name: QE data completeness
    parent_module: qe
    module_type: data_pipeline
    risk_level: high
    description: QE completion payload, artifact manifest, config snapshot, and archive source completeness.
    description_zh: 覆盖 QE 完成 payload、artifact manifest、配置快照、训练来源、策略参数和归档来源数据完整性。
    test_plans:
      required_on_change: [l0, qe_data_contract_backend]
  - module_id: qe.archive
    display_name: QE archive
    parent_module: qe
    module_type: data_pipeline
    risk_level: high
    description: QE realtime archive, backfill, quality audit, and warehouse source extraction.
    description_zh: 覆盖 QE 实验数仓归档、历史补录、质量核对、实时抽取、数据独立保存和后续分析入口。
    ui_routes: [/qe-archive]
    api_routes: [/api/v1/qe-archive/*]
    test_plans:
      required_on_change: [l0, qe_archive_l3]
      recommended: [qe_archive_data_quality]
  - module_id: paper_v2
    display_name: Paper Trading v2
    module_type: product_feature
    risk_level: critical
    description: Paper Trading v2 portfolios, sessions, day runner, ledger, and replay.
    description_zh: 覆盖 Paper Trading v2 的组合、交易会话、日内执行、账本、回放和未来准实盘模拟链路。
    ui_routes: [/paper-v2, /paper-v2/packages, /paper-v2/selection, /paper-v2/portfolios, /paper-v2/model-hmm]
    api_routes: [/api/v1/paper-v2/*]
    test_plans:
      required_on_change: [l0, paper_v2_l3]
      recommended: [paper_v2_backend]
  - module_id: selection_center
    display_name: Selection Center
    module_type: product_feature
    risk_level: high
    description: Package-based selection, fusion, tradability filtering, and HMM-adjusted selection.
    description_zh: 覆盖策略包选股、融合排序、可交易过滤、行业/HMM 调整和结果追踪。
    ui_routes: [/paper-v2/selection]
    api_routes: [/api/v1/selection-center/*]
    test_plans:
      required_on_change: [l0, paper_v2_backend]
  - module_id: strategy_package
    display_name: Strategy Package
    module_type: product_feature
    risk_level: high
    description: Frozen strategy manifests, model assets, selection artifacts, and package lifecycle.
    description_zh: 覆盖冻结策略包 manifest、模型资产、选股产物、执行策略和包生命周期。
    ui_routes: [/paper-v2/packages, /strategy-package-governance]
    api_routes: [/api/v1/strategy-packages/*]
    test_plans:
      required_on_change: [l0, paper_v2_backend]
      recommended: [strategy_package_governance_ui]
  - module_id: hmm
    display_name: HMM
    module_type: product_feature
    risk_level: high
    description: HMM training, snapshots, coefficients, runtime adjustment, and QE/Paper integration.
    description_zh: 覆盖 HMM 训练、快照、系数预计算、滚动更新以及 QE/Paper 运行时调整。
    ui_routes: [/paper-v2/model-hmm]
    test_plans:
      required_on_change: [l0]
  - module_id: factor_library
    display_name: Factor library
    module_type: product_feature
    risk_level: high
    description: Factor catalog, evaluation metrics, correlation analysis, and factor generation.
    description_zh: 覆盖因子目录、因子评价、相关性分析、因子生成和因子质量治理。
    ui_routes: [/quantevolver/factors, /quantevolver/factor-correlation]
    test_plans:
      required_on_change: [l0]
  - module_id: model_library
    display_name: Model library
    module_type: product_feature
    risk_level: high
    description: Model registry, training artifacts, hyperparameters, and attribution.
    description_zh: 覆盖模型注册、训练记录、超参数、模型归因和模型资产管理。
    ui_routes: [/quantevolver/models, /quantevolver/model-training]
    test_plans:
      required_on_change: [l0]
  - module_id: qlib_data
    display_name: Qlib data
    module_type: data_pipeline
    risk_level: critical
    description: Qlib exporter, bin datasets, PIT universe, and minute data chains.
    description_zh: 覆盖 Qlib 导出、Bin/H5 数据集、PIT 股票池、分钟数据链和数据候选验证。
    ui_routes: [/qlib]
    test_plans:
      required_on_change: [l0]
  - module_id: market_regime
    display_name: Market Regime
    module_type: data_pipeline
    risk_level: medium
    description: Market regime classification (market.regime_label) timeline and distribution surfaces.
    description_zh: 覆盖市场状态分类(market.regime_label) 的时间线、分布与方法切换 UI。
    ui_routes: [/market-regime]
    api_routes: [/api/v1/market/regime-label/*]
    test_plans:
      required_on_change: [l0]
      recommended: [market_regime_ui]
  - module_id: rl_execution
    display_name: RL Execution (Models + Module)
    module_type: product_feature
    risk_level: high
    description: RL execution model registry, dev_version lineage, rolling training/evaluation metrics, plus backend.services.rl_execution module visibility, router registration, and .gitignore guard.
    description_zh: 覆盖 RL 执行模型注册表、dev_version 谱系、滚动训练与评估指标的展示与激活流程；以及 backend.services.rl_execution 模块可见性、路由注册和 .gitignore 反向遮蔽防护。
    ui_routes: [/rl-execution]
    api_routes: [/api/v1/rl-execution/*]
    test_plans:
      required_on_change: [l0, rl_execution_smoke]
      recommended: [rl_execution_ui]
  - module_id: local_data
    display_name: Local data
    module_type: data_pipeline
    risk_level: high
    description: Tushare, TDX, local dataset audit, refresh, and ingestion services.
    description_zh: 覆盖本地 Tushare/TDX 数据接入、刷新审计、数据集质量和本地数据管理页面。
    ui_routes: [/local-data, /qlib]
    test_plans:
      required_on_change: [l0]
  - module_id: analysis
    display_name: Stock analysis
    module_type: product_feature
    risk_level: medium
    description: Stock analysis, trend analysis, and sector strategy research pages.
    description_zh: Covers stock analysis, trend research, and sector strategy pages for research workflows.
    ui_routes: [/analysis, /analysis-trend, /sector-strategy]
    test_plans:
      required_on_change: [l0]
  - module_id: watchlist
    display_name: Watchlist and screening
    module_type: product_feature
    risk_level: medium
    description: Watchlist, cloud screening, and candidate-stock management pages.
    description_zh: Covers watchlist, cloud screening, and candidate-stock management workflows.
    ui_routes: [/watchlist, /cloud-screening]
    test_plans:
      required_on_change: [l0]
  - module_id: market_news
    display_name: Market news
    module_type: data_pipeline
    risk_level: low
    description: Market news, market flashes, and external information display.
    description_zh: Covers read-only market news, flashes, and external information display.
    ui_routes: [/market-news]
    test_plans:
      required_on_change: [l0]
  - module_id: portfolio_management
    display_name: Portfolio management
    module_type: product_feature
    risk_level: high
    description: Portfolio analysis, smart monitor, and realtime monitor UI workflows.
    description_zh: Covers portfolio analysis, smart monitor, and realtime portfolio monitoring.
    ui_routes: [/portfolio, /smart-monitor, /monitor]
    test_plans:
      required_on_change: [l0]
  - module_id: qmt
    display_name: QMT
    module_type: trading_infra
    risk_level: critical
    description: QMT client, account, order, and future execution integration.
    description_zh: 覆盖 QMT 客户端、账户、订单、持仓和未来真实执行接入，属于高风险交易基础设施。
    ui_routes: [/qmt]
    test_plans:
      required_on_change: [l0]
  - module_id: rdagent
    display_name: RD-Agent
    module_type: product_feature
    risk_level: high
    description: RD-Agent task, asset, sync, and generated research integration.
    description_zh: 覆盖 RD-Agent 任务、资产同步、调度、生成研究结果和远端/本地协作链路。
    ui_routes: [/rdagent, /rd-agent, /rdagent/dispatch, /scheduler, /rdagent/tasks-sync, /rdagent/tasks, /rdagent/task-selection, /config/rdagent-llm]
    test_plans:
      required_on_change: [l0]
  - module_id: research_pipeline
    display_name: Research Pipeline
    module_type: product_feature
    risk_level: high
    description: Research Pipeline workflow, HMM backtest records, QE shadow stages, artifacts, and promotion gates.
    description_zh: 覆盖 Research Pipeline 页面、HMM 回测记录、QE shadow 阶段、产物引用、回填和候选晋级门禁。
    ui_routes: [/research-pipeline]
    api_routes: [/api/v1/research-pipeline/*]
    test_plans:
      required_on_change: [l0, research_pipeline_backend]
      recommended: [research_mcp_contract]
  - module_id: research_assistant
    display_name: Research Assistant Console
    module_type: product_feature
    risk_level: high
    description: MCP/API-first research assistant console, task ledger, memory ledger, local skill catalog, approvals, issue candidates, and model routing.
    description_zh: 覆盖研究与实验综合助理控制台、任务账本、长期记忆账本、本地 Skill 目录、MCP 预检查、审批中心、候选 Issue、模型路由和发现流。
    ui_routes: [/research-assistant, /research-assistant/chat, /research-assistant/workbench, /research-assistant/tasks, /research-assistant/streams, /research-assistant/memory, /research-assistant/graph, /research-assistant/mcp-tools, /research-assistant/skills, /research-assistant/approvals, /research-assistant/reports, /research-assistant/models, /research-assistant/settings, /research-assistant/external-agents, /research-assistant/trace, /research-assistant/notifications, /research-assistant/issue-candidates]
    api_routes: [/api/v1/research-assistant/*]
    test_plans:
      required_on_change: [l0, research_assistant_backend, research_assistant_mcp_contract]
      recommended: [research_assistant_ui]
  - module_id: validation
    display_name: Validation Center
    module_type: cross_cutting
    risk_level: medium
    description: Validation Center, runner, evidence, coverage, guardrails, and module quality cockpit.
    description_zh: 覆盖 Validation Center、受控 runner、证据归档、覆盖率、guardrail 和模块质量驾驶舱。
    ui_routes: [/validation-center]
    api_routes: [/api/v1/validation/*]
    test_plans:
      required_on_change: [l0, validation_center_backend]
      recommended: [validation_center_ui, validation_center_real_port_ui]
  - module_id: validation.center
    display_name: Validation Center UI/API
    parent_module: validation
    module_type: product_feature
    risk_level: medium
    description: Validation Center API, UI, history, findings, and summaries.
    description_zh: 覆盖 Validation Center 的页面、API、历史记录、质量发现、Bug 展示和汇总面板。
    ui_routes: [/validation-center]
    test_plans:
      required_on_change: [l0, validation_center_backend]
      recommended: [validation_center_ui, validation_center_real_port_ui]
  - module_id: validation.runner
    display_name: Validation runner
    parent_module: validation
    module_type: technical_layer
    risk_level: high
    description: Controlled nox runner, plan catalog, execution records, and evidence archive.
    description_zh: 覆盖受控 nox runner、测试计划白名单、执行记录、日志和自动归档。
    test_plans:
      required_on_change: [l0, validation_catalog_integrity, validation_center_backend]
  - module_id: validation.coverage
    display_name: Validation coverage
    parent_module: validation
    module_type: technical_layer
    risk_level: medium
    description: Coverage snapshots, gates, evidence manifests, and pass-scope metadata.
    description_zh: 覆盖覆盖率快照、阈值门禁、diff coverage、证据 manifest 和 pass scope 元数据。
    test_plans:
      required_on_change: [l0, validation_coverage_backend]
  - module_id: validation.guardrails
    display_name: Validation guardrails
    parent_module: validation
    module_type: cross_cutting
    risk_level: high
    description: Development standards guardrails, design-compliance review controls, changed-file gates, and baseline scans.
    description_zh: 覆盖开发规范 guardrail、设计方案完整实现复核、变更文件扫描、基线问题识别和高风险规则阻断。
    test_plans:
      required_on_change: [l0, guardrail_changed_files]
  - module_id: validation.module_quality
    display_name: Module quality cockpit
    parent_module: validation
    module_type: cross_cutting
    risk_level: high
    description: Module registry, file ownership, commit impact, workspace dirty status, and quality matrix.
    description_zh: 覆盖模块注册表、文件归属、commit 影响分析、工作区 dirty 状态和模块质量优先级矩阵。
    test_plans:
      required_on_change: [l0, validation_module_registry_l0]
      recommended: [validation_center_real_port_ui]
  - module_id: platform
    display_name: Platform
    module_type: technical_layer
    risk_level: high
    description: Shared backend, API, database, scheduler, config, monitoring, and cross-cutting infrastructure.
    description_zh: 覆盖共享后端、API、数据库、调度、配置、监控和跨模块基础设施。
    test_plans:
      required_on_change: [l0]
  - module_id: platform.api
    display_name: Platform API
    parent_module: platform
    module_type: technical_layer
    risk_level: high
    description: FastAPI app assembly, shared routers, middleware, and API contracts.
    description_zh: 覆盖 FastAPI 应用装配、共享路由、中间件、OpenAPI 合约和 API 运行边界。
  - module_id: platform.db
    display_name: Platform database
    parent_module: platform
    module_type: technical_layer
    risk_level: high
    description: PostgreSQL pools, migrations, schema bootstraps, and DB comments.
    description_zh: 覆盖 PostgreSQL/TimescaleDB 连接池、迁移、schema 初始化和字段注释规范。
    ui_routes: [/rdagent/dispatch/db-monitor]
  - module_id: platform.config
    display_name: Platform config
    parent_module: platform
    module_type: technical_layer
    risk_level: high
    description: Shared runtime configuration and environment handling.
    description_zh: 覆盖环境变量、运行时配置、路径配置和跨服务配置解析。
    ui_routes: [/config, /config/rdagent-llm]
  - module_id: platform.scheduler
    display_name: Platform scheduler
    parent_module: platform
    module_type: technical_layer
    risk_level: high
    description: Background jobs and scheduled workflows.
    description_zh: 覆盖后台任务、定时调度、数据刷新任务和长流程调度基础能力。
  - module_id: platform.monitoring
    display_name: Platform monitoring
    parent_module: platform
    module_type: technical_layer
    risk_level: medium
    description: Prometheus, Grafana, process exporters, and operational observability.
    description_zh: 覆盖 Prometheus、Grafana、process exporter、运行状态监控和运维可观测性。
    ui_routes: [/rdagent/dispatch/system-monitor]
  - module_id: frontend_common
    display_name: Frontend common
    module_type: technical_layer
    risk_level: medium
    description: Shared frontend navigation, API clients, UI components, and build configuration.
    description_zh: 覆盖共享前端导航、API client、通用组件、布局和前端构建配置。
  - module_id: docs
    display_name: Documentation
    module_type: docs
    risk_level: low
    description: Project documentation root.
    description_zh: 覆盖项目文档根目录及文档体系治理。
  - module_id: docs.architecture
    display_name: Architecture docs
    parent_module: docs
    module_type: docs
    risk_level: low
    description: Architecture and implementation design documents.
    description_zh: 覆盖架构设计、实施方案、技术路线和跨模块设计决策文档。
  - module_id: docs.standards
    display_name: Standards docs
    parent_module: docs
    module_type: docs
    risk_level: medium
    description: Human-readable and machine-readable development standards, including design-compliance delivery rules.
    description_zh: 覆盖人类可读和机器可读开发规范、设计方案完整实现复核、目录规范、guardrail 规则和历史版本。
  - module_id: docs.analysis
    display_name: Analysis docs
    parent_module: docs
    module_type: docs
    risk_level: low
    description: Quant analysis, experiment analysis, and research reports.
    description_zh: 覆盖量化分析、实验分析、研究报告和问题复盘文档。
  - module_id: docs.operations
    display_name: Operations docs
    parent_module: docs
    module_type: docs
    risk_level: medium
    description: Operations, deployment, and runtime procedure documentation.
    description_zh: 覆盖运维、部署、磁盘清理、生产同步、运行流程和操作记录文档。
  - module_id: debug_tools
    display_name: Debug tools
    module_type: diagnostics
    risk_level: medium
    description: One-off diagnostics and temporary investigation tools.
    description_zh: 覆盖一次性诊断工具、临时排查脚本和调试辅助程序。
  - module_id: tests
    display_name: Tests
    module_type: tests
    risk_level: medium
    description: Automated tests, validation evidence, fixtures, and test catalogs.
    description_zh: 覆盖自动化测试、验证证据、fixtures、测试目录结构和测试基础设施。
  - module_id: tests.backend
    display_name: Backend tests
    parent_module: tests
    module_type: tests
    risk_level: medium
    description: Backend pytest suites.
    description_zh: 覆盖后端 pytest 测试、API/服务/数据层回归和业务 oracle。
  - module_id: tests.frontend
    display_name: Frontend tests
    parent_module: tests
    module_type: tests
    risk_level: medium
    description: Frontend Playwright and component tests.
    description_zh: 覆盖前端 Playwright、UI E2E、组件测试和前端运行质量检查。
  - module_id: tests.validation_history
    display_name: Validation history
    parent_module: tests
    module_type: tests
    risk_level: medium
    description: Validation run records, coverage snapshots, and evidence artifacts.
    description_zh: 覆盖测试运行记录、coverage 快照、evidence manifest 和验证历史归档。
  - module_id: tests.fixtures
    display_name: Test fixtures
    parent_module: tests
    module_type: tests
    risk_level: medium
    description: Test fixtures and generated validation test data.
    description_zh: 覆盖测试 fixtures、样例数据、mock 输入和可复用验证样本。
  - module_id: scripts
    display_name: Scripts
    module_type: technical_layer
    risk_level: medium
    description: Reusable operational, diagnostic, validation, and data scripts.
    description_zh: 覆盖可复用运维脚本、诊断脚本、验证脚本、数据脚本和命令行入口。
  - module_id: model_registry
    display_name: Model Registry
    module_type: technical_layer
    risk_level: high
    description: Cross-team model registry, governance migration phase 5 schema, and registry router.
    description_zh: 覆盖模型注册中心、治理迁移 Phase 5 schema、注册路由和模型资产桥接。
    api_routes: [/api/v1/model-registry/*]
    test_plans:
      required_on_change: [l0, model_registry_backend]
  - module_id: market.regime_label
    display_name: Market Regime Label
    parent_module: platform
