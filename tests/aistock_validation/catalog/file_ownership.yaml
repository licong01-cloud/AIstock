schema_version: aistock_file_ownership_v1
rules:
  - rule_id: validation_catalog_module_quality
    priority: 120
    include:
      - tests/aistock_validation/catalog/module_registry.yaml
      - tests/aistock_validation/catalog/file_ownership.yaml
      - tests/aistock_validation/catalog/ui_targets.yaml
    primary_module: validation.module_quality
    impact_modules: [validation.guardrails, tests.validation_history]
    layer: validation_catalog
    risk_level: high
    ownership_reason: Module registry and file ownership rules drive commit impact and changed-file guardrails.
  - rule_id: validation_catalog_test_plans
    priority: 110
    include:
      - tests/aistock_validation/catalog/test_plans.yaml
      - tests/aistock_validation/catalog/test_levels.md
    primary_module: validation.runner
    impact_modules: [validation.center, tests.validation_history]
    layer: validation_catalog
    risk_level: high
    ownership_reason: Test plan allowlists control what Validation Center can execute.
  - rule_id: validation_history_records
    priority: 70
    include:
      - tests/aistock_validation/history/**
      - tests/aistock_validation/modules/**
      - tests/aistock_validation/templates/**
    primary_module: tests.validation_history
    impact_modules: [validation.center]
    layer: validation_history
    risk_level: medium
    ownership_reason: Validation evidence and module matrices are read by Validation Center.
  - rule_id: validation_bug_registry
    priority: 70
    include:
      - tests/aistock_validation/bugs/**
    primary_module: validation.module_quality
    impact_modules: [tests.validation_history]
    layer: validation_bug_registry
    risk_level: high
    ownership_reason: Local bug JSON records are workflow metadata; normal BUG registration and close-sync should validate schema/module quality without forcing full Validation Center backend tests.
  - rule_id: validation_services
    priority: 100
    include:
      - backend/services/validation/**
    primary_module: validation.center
    impact_modules: [validation.runner, validation.coverage, validation.guardrails, validation.module_quality]
    layer: backend_service
    risk_level: medium
    ownership_reason: Validation service layer backs the internal testing and quality UI.
  - rule_id: validation_router
    priority: 100
    include:
      - backend/routers/validation.py
    primary_module: validation.center
    impact_modules: [validation.runner, validation.coverage, validation.module_quality]
    layer: backend_router
    risk_level: medium
    ownership_reason: Validation API routes expose read-only quality and controlled runner endpoints.
  - rule_id: validation_frontend
    priority: 100
    include:
      - frontend/src/app/validation-center/**
      - frontend/src/lib/validation/**
      - frontend/tests/validation-center/**
    primary_module: validation.center
    impact_modules: [validation.module_quality]
    layer: frontend_ui
    risk_level: medium
    ownership_reason: Validation Center UI and client code show quality state and pipeline results.
  - rule_id: validation_scripts
    priority: 100
    include:
      - scripts/aistock_validate.py
      - scripts/aistock_guardrail_scan.py
      - scripts/aistock_module_ownership_scan.py
      - scripts/aistock_issue_workflow.py
      - scripts/aistock_feature_workflow.py
      - scripts/issue_flow.py
      - scripts/code_intelligence_adapter.py
      - scripts/ci_failure_issue_summary.py
      - scripts/nightly_adaptive_scheduler.py
      - scripts/nightly_discovery_plans.py
      - scripts/nightly_bug_candidate_queue.py
      - scripts/repo_hygiene_orphan_audit.py
      - scripts/validation_center_*.py
    primary_module: validation.guardrails
    impact_modules: [validation.center, validation.runner, validation.module_quality]
    layer: script
    risk_level: high
    ownership_reason: Validation and guardrail scripts are execution entry points for the local pipeline.
  - rule_id: noxfile_validation_runner
    priority: 100
    include:
      - noxfile.py
    primary_module: validation.runner
    impact_modules: [validation.center, validation.guardrails, validation.module_quality, tests.backend, tests.frontend]
    layer: test_runner
    risk_level: high
    ownership_reason: noxfile.py defines allowlisted local validation sessions.
  - rule_id: dev_quality_tooling
    priority: 100
    include:
      - .mcp.json
      - .github/ISSUE_TEMPLATE/*.yml
      - .github/workflows/*.yml
      - .pre-commit-config.yaml
      - .semgrep.yml
      - .semgrep/**
      - pyproject.toml
      - ruff.toml
      - .github/renovate.json
    primary_module: validation.guardrails
    impact_modules: [validation.runner, validation.center, platform.config]
    layer: dev_quality_tooling
    risk_level: high
    ownership_reason: Open-source CI/CD and local quality tool configs define issue workflow automation gates.
  - rule_id: mcp_gateway_platform
    priority: 90
    include:
      - backend/mcp/**
      - tests/mcp/**
      - scripts/aistock_mcp_gateway.py
      - scripts/aistock_mcp_gateway_doctor.py
    primary_module: platform.mcp_gateway
    impact_modules: [validation.guardrails, research_pipeline, research_assistant, qe, platform.config]
    layer: mcp_gateway
    risk_level: high
    ownership_reason: Unified MCP gateway code, profiles, manifests, and contract tests control agent-facing access to AIstock tools.
  - rule_id: validation_backend_tests
    priority: 95
    include:
      - backend/tests/test_validation*.py
      - backend/tests/test_aistock_validate_*.py
      - backend/tests/test_aistock_guardrail_scan.py
      - backend/tests/scripts/test_repo_hygiene_orphan_audit.py
      - backend/tests/scripts/test_code_intelligence_adapter.py
      - backend/tests/scripts/test_aistock_issue_workflow.py
      - backend/tests/scripts/test_aistock_feature_workflow.py
      - backend/tests/scripts/test_issue_flow.py
      - backend/tests/scripts/test_ci_failure_issue_summary.py
      - backend/tests/scripts/test_nightly_discovery_*.py
      - backend/tests/scripts/test_nightly_bug_candidate_*.py
    primary_module: tests.backend
    impact_modules: [validation.center, validation.runner, validation.coverage, validation.guardrails, validation.module_quality]
    layer: backend_test
    risk_level: medium
    ownership_reason: Backend validation tests protect Validation Center contracts.
  - rule_id: qe_archive_services
    priority: 90
    include:
      - backend/services/qe_archive/**
      - backend/routers/qe_archive.py
    primary_module: qe.archive
    impact_modules: [qe.data_completeness, qe.enhanced_metrics]
    layer: backend_service
    risk_level: high
    ownership_reason: QE archive code persists and audits experiment data.
  - rule_id: qe_services
    priority: 80
    include:
      - backend/services/quantevolver/**
      - backend/routers/quantevolver*.py
    primary_module: qe.core
    impact_modules: [qe.single_experiment, qe.custom_evolution, qe.auto_evolution, qe.enhanced_metrics, qe.data_completeness]
    layer: backend_service
    risk_level: high
    ownership_reason: QE service code is shared by single experiments and evolution flows.
  - rule_id: qe_frontend
    priority: 80
    include:
      - frontend/src/app/quantevolver/**
      - frontend/src/app/qe-archive/**
      - frontend/tests/qe/**
      - frontend/tests/qe-archive/**
    primary_module: qe.single_experiment
    impact_modules: [qe.archive, qe.enhanced_metrics, validation.center]
    layer: frontend_ui
    risk_level: high
    ownership_reason: QE UI exposes experiment detail, archive, and enhanced metric workflows.
  - rule_id: strategy_package_governance_frontend
    priority: 80
    include:
      - frontend/src/app/strategy-package-governance/**
      - frontend/src/lib/strategy-package-governance/**
      - frontend/tests/strategy-package-governance/**
    primary_module: strategy_package
    impact_modules: [paper_v2, validation.center]
    layer: frontend_ui
    risk_level: high
    ownership_reason: Governance UI gates strategy_package paper enablement; UI must reflect 5-evidence eligibility.
  - rule_id: market_regime_frontend
    priority: 70
    include:
      - frontend/src/app/market-regime/**
      - frontend/src/lib/market-regime/**
      - frontend/tests/market-regime/**
      - backend/routers/market_regime.py
    primary_module: market_regime
    impact_modules: [qe.archive, paper_v2]
    layer: frontend_ui
    risk_level: medium
    ownership_reason: Market regime UI surfaces the daily classification consumed by qe_archive ETL.
  - rule_id: rl_execution_frontend
    priority: 70
    include:
      - frontend/src/app/rl-execution/**
      - frontend/src/lib/rl-execution/**
      - frontend/tests/rl-execution/**
    primary_module: rl_execution
    impact_modules: [paper_v2]
    layer: frontend_ui
    risk_level: medium
    ownership_reason: RL Execution UI exposes the model registry consumed by minute-level paper execution.
  - rule_id: paper_v2_services
    priority: 80
    include:
      - backend/services/paper_trading_v2/**
      - backend/routers/paper_v2.py
      - frontend/src/app/paper-v2/**
      - frontend/tests/paper-v2/**
    primary_module: paper_v2
    impact_modules: [selection_center, strategy_package]
    layer: product_feature
    risk_level: critical
    ownership_reason: Paper v2 controls simulated execution, positions, cash, and session state.
  - rule_id: selection_center_services
    priority: 80
    include:
      - backend/services/selection_center/**
      - backend/routers/selection_center.py
    primary_module: selection_center
    impact_modules: [paper_v2, strategy_package, hmm]
    layer: backend_service
    risk_level: high
    ownership_reason: Selection Center produces package-based portfolio candidates.
  - rule_id: watchlist_services
    priority: 82
    include:
      - backend/core/data_source_manager.py
      - backend/core/data_source_manager_impl.py
      - backend/services/watchlist_service.py
      - backend/routers/watchlist.py
      - backend/tests/watchlist/**
      - frontend/src/app/watchlist/**
      - frontend/tests/watchlist/**
    primary_module: watchlist
    impact_modules: [local_data]
    layer: product_feature
    risk_level: high
    ownership_reason: Watchlist realtime quote normalization, import/display APIs, and focused tests must be attributed to watchlist so small data-display fixes use scoped validation instead of generic platform or Validation Center gates.
  - rule_id: strategy_package_services
    priority: 80
    include:
      - backend/services/strategy_package/**
      - backend/routers/strategy_package*.py
      - docs/contracts/strategy_package*.md
    primary_module: strategy_package
    impact_modules: [paper_v2, selection_center, qe.single_experiment]
    layer: backend_service
    risk_level: high
    ownership_reason: Strategy package manifests, contracts, and assets bridge research and paper workflows.
  - rule_id: execution_algos_runtime
    priority: 80
    include:
      - backend/execution_algos/**
      - configs/execution_algos/**
    primary_module: paper_v2
    impact_modules: [qe.core, strategy_package]
    layer: execution_algo
    risk_level: critical
    ownership_reason: Execution algorithms define order sizing and market-state semantics shared by QE and Paper v2.
  - rule_id: hmm_services
    priority: 75
    include:
      - backend/services/hmm_*.py
      - backend/routers/hmm*.py
      - scripts/hmm_*.py
      - scripts/diagnostics/hmm_*.py
    primary_module: hmm
    impact_modules: [qe.core, selection_center, paper_v2]
    layer: model_runtime
    risk_level: high
    ownership_reason: HMM snapshots and coefficients affect model scoring and runtime decisions.
  - rule_id: qlib_data_pipeline
    priority: 75
    include:
      - backend/qlib_exporter/**
      - scripts/qlib_*.py
      - qlib_minute_validation/**
    primary_module: qlib_data
    impact_modules: [qe.core, factor_library, paper_v2]
    layer: data_pipeline
    risk_level: critical
    ownership_reason: Qlib datasets are authoritative inputs for research and backtests.
  - rule_id: local_data_pipeline
    priority: 70
    include:
      - backend/data_service/**
      - backend/services/*data*.py
      - backend/routers/local_data*.py
      - frontend/src/app/local-data/**
      - frontend/src/app/qlib/**
    primary_module: local_data
    impact_modules: [qlib_data, qe.core, paper_v2]
    layer: data_pipeline
    risk_level: high
    ownership_reason: Local data services define data freshness, quality, and PIT availability.
  - rule_id: platform_database
    priority: 70
    include:
      - backend/db/**
      - backend/migrations/**
    primary_module: platform.db
    impact_modules: [qe.archive, paper_v2, selection_center, strategy_package, validation.center]
    layer: database
    risk_level: high
    ownership_reason: Database schema and migrations affect persisted business state.
  - rule_id: research_assistant_runtime_config
    priority: 100
    include:
      - configs/research_assistant/runtime_context.yaml
    primary_module: research_assistant
    impact_modules: [research_assistant.react_grounding, research_assistant.evidence_guard, research_assistant.qe_autonomy]
    layer: config
    risk_level: high
    ownership_reason: Runtime context config controls assistant dialogue, compaction, and ReAct grounding limits.
  - rule_id: research_assistant_phase0_docs
    priority: 95
    include:
      - docs/architecture/research_assistant_architecture_upgrade_blueprint_20260530.md
      - docs/process/research_assistant_baseline_verification_20260531.md
      - docs/process/research_assistant_blueprint_execution_runbook_20260531.md
      - docs/process/research_assistant_phase0_1_execution_pack_20260531.md
      - docs/process/research_assistant_codex_kickoff_command_20260601.md
    primary_module: research_assistant
    impact_modules: [docs.architecture, docs.standards, validation.module_quality]
    layer: docs
    risk_level: high
    ownership_reason: Research Assistant Phase 0 baseline and blueprint process docs define the implementation boundary and closure gates.
  - rule_id: research_assistant_tests
    priority: 95
    include:
      - backend/tests/research_assistant/**
    primary_module: research_assistant
    impact_modules: [tests.backend, validation.runner]
    layer: backend_test
    risk_level: high
    ownership_reason: Research Assistant tests prove backend, schema, routing, and phase-gate contracts.
  - rule_id: research_assistant_migration_namespace
    priority: 95
    include:
      - backend/db/migrations/ra_upgrade/**
    primary_module: research_assistant.memory_tree
    impact_modules: [research_assistant, platform.db]
    layer: database
    risk_level: high
    ownership_reason: Research Assistant upgrade migrations add schema objects under phase-specific DDL gates.
  - rule_id: research_assistant_runtime
    priority: 90
    include:
      - backend/services/research_assistant/**
      - backend/routers/research_assistant.py
      - backend/mcp/modules/research_assistant.py
      - frontend/src/app/research-assistant/**
      - frontend/tests/research-assistant/**
    primary_module: research_assistant
    impact_modules: [research_assistant.react_grounding, research_assistant.evidence_guard, research_assistant.generic_mcp_client]
    layer: product_feature
    risk_level: high
    ownership_reason: Research Assistant runtime, API, MCP, and UI surfaces must stay aligned with the assistant architecture blueprint.
  - rule_id: research_assistant_phase7_full_accept
    priority: 115
    include:
      - scripts/research_assistant_phase7_crosscheck.py
      - tests/aistock_validation/catalog/research_assistant_phase7_expected.yaml
      - backend/tests/research_assistant/test_phase7_blueprint_crosscheck.py
      - frontend/src/components/research-assistant/**
      - frontend/src/lib/research-assistant/**
      - frontend/src/app/research-assistant/**
      - frontend/tests/research-assistant/phase7-*.spec.ts
      - tests/aistock_validation/history/research_assistant/*ra_phase7_full_accept*.md
      - tests/aistock_validation/history/research_assistant/*ra_phase7_live_smoke*.md
    primary_module: research_assistant
    impact_modules: [research_assistant.memory_tree, research_assistant.agent_teams, research_assistant.evidence_guard, research_assistant.qe_autonomy, validation.runner]
    layer: product_feature
    risk_level: critical
    ownership_reason: Phase 7 closes the Research Assistant frontend, evidence/blocker UI, full DAI cross-check, and validation runner gate without touching production ports.
  - rule_id: research_assistant_memory_tree
    priority: 100
    include:
      - backend/services/research_assistant/memory_tree.py
      - backend/tests/research_assistant/test_memory_tree_retrieval.py
      - backend/tests/research_assistant/test_memory_tree_ddl_contract.py
      - backend/tests/research_assistant/test_memory_scoring.py
    primary_module: research_assistant.memory_tree
    impact_modules: [research_assistant.memory_curator, research_assistant.graph_context]
    layer: backend_service
    risk_level: high
    ownership_reason: Tree memory retrieval feeds context-pack injection and resident preference handling.
  - rule_id: research_assistant_memory_curator
    priority: 100
    include:
      - backend/services/research_assistant/memory_curator.py
      - backend/tests/research_assistant/test_memory_autogrow.py
      - backend/tests/research_assistant/test_memory_dedup_scope.py
      - backend/tests/research_assistant/test_memory_reflection.py
    primary_module: research_assistant.memory_curator
    impact_modules: [research_assistant.memory_tree, research_assistant.reflection_card]
    layer: backend_service
    risk_level: high
    ownership_reason: Memory curation controls automatic growth, de-duplication, reflection, and approval-aware memory writes.
  - rule_id: research_assistant_graph_context
    priority: 100
    include:
      - backend/services/research_assistant/graph_context.py
      - backend/tests/research_assistant/test_graph_context_expansion.py
      - backend/tests/research_assistant/test_graph_injected_into_context.py
    primary_module: research_assistant.graph_context
    impact_modules: [research_assistant.memory_tree]
    layer: backend_service
    risk_level: high
    ownership_reason: Graph context makes knowledge graph relations consumable by assistant reasoning.
  - rule_id: research_assistant_react_grounding
    priority: 110
    include:
      - backend/services/research_assistant/react_grounding.py
      - backend/tests/research_assistant/test_react_tool_loop.py
      - backend/tests/research_assistant/test_tool_catalog_gate.py
      - backend/tests/research_assistant/test_reflexion_retry.py
      - backend/tests/research_assistant/test_react_phase1_phase2_context_regression.py
    primary_module: research_assistant.react_grounding
    impact_modules: [research_assistant.evidence_guard, research_assistant.generic_mcp_client]
    layer: backend_service
    risk_level: critical
    ownership_reason: ReAct grounding closes the tool-result backfill loop and blocks single-shot hallucinated answers.
  - rule_id: research_assistant_evidence_guard
    priority: 100
    include:
      - backend/services/research_assistant/evidence_guard.py
      - backend/tests/research_assistant/test_evidence_guard.py
    primary_module: research_assistant.evidence_guard
    impact_modules: [research_assistant.react_grounding, research_assistant.external_research]
    layer: backend_service
    risk_level: critical
    ownership_reason: Evidence guard enforces source references, date freshness, placeholder blocking, and factual downgrade behavior.
  - rule_id: research_assistant_external_research
    priority: 100
    include:
      - backend/mcp/modules/external_research.py
      - backend/services/research_assistant/external_research.py
      - backend/routers/external_research.py
      - debug_tools/mcp/list_tools_smoke.py
      - backend/tests/research_assistant/test_external_research_evidence_first.py
      - backend/tests/research_assistant/test_external_research_provider_contract.py
      - backend/tests/research_assistant/test_external_research_token_budget.py
      - backend/tests/research_assistant/test_external_research_react_consumption.py
      - backend/tests/research_assistant/test_external_research_l4_redline.py
      - backend/tests/mcp/test_external_research_module.py
    primary_module: research_assistant.external_research
    impact_modules: [research_assistant.evidence_guard, research_assistant.generic_mcp_client]
    layer: mcp_gateway
    risk_level: high
    ownership_reason: External research MCP must return compact provenance-first search and paper evidence without flooding tokens.
  - rule_id: research_assistant_agent_teams
    priority: 100
    include:
      - backend/services/research_assistant/agent_teams/**
      - backend/db/migrations/ra_upgrade/002_agent_teams.sql
      - configs/research_assistant/agent_teams.yaml
      - backend/tests/research_assistant/test_agent_teams_*.py
      - backend/tests/research_assistant/test_orchestrator_reduce.py
      - backend/tests/research_assistant/test_worker_tool_isolation.py
      - tests/aistock_validation/history/research_assistant/*ra_phase5_agent_teams*.md
    primary_module: research_assistant.agent_teams
    impact_modules: [research_assistant.product_core, research_assistant.aistock_domain_adapter]
    layer: backend_service
    risk_level: high
    ownership_reason: Agent Teams own orchestrator-worker delegation, run ledgers, and worker audit trails.
  - rule_id: research_assistant_qe_autonomy
    priority: 100
    include:
      - backend/services/research_assistant/qe_autonomy.py
      - backend/services/research_assistant/qe_autonomy/**
      - backend/db/migrations/ra_upgrade/003_qe_autonomy.sql
      - backend/tests/research_assistant/test_qe_autonomy_*.py
      - backend/tests/research_assistant/test_qe_autonomous_loop.py
      - tests/aistock_validation/history/research_assistant/*ra_phase6_qe_autonomy*.md
    primary_module: research_assistant.qe_autonomy
    impact_modules: [qe.auto_evolution, research_assistant.agent_teams, research_assistant.evidence_guard]
    layer: backend_service
    risk_level: critical
    ownership_reason: QE autonomy must enforce evaluator callbacks, budget guardrails, stop conditions, DDL ledger consumption, worker reduce, and approval boundaries.
  - rule_id: research_assistant_code_intelligence
    priority: 100
    include:
      - backend/services/research_assistant/code_intelligence.py
      - backend/tests/research_assistant/test_code_intel_context_injection.py
    primary_module: research_assistant.code_intelligence
    impact_modules: [validation.guardrails, research_assistant.graph_context]
    layer: backend_service
    risk_level: high
    ownership_reason: Code intelligence consumes CodeGraph context refs and impacted-test evidence inside assistant reasoning.
  - rule_id: research_assistant_proactive_reports
    priority: 100
    include:
      - backend/services/research_assistant/proactive_reports.py
      - backend/tests/research_assistant/test_proactive_report_generation.py
    primary_module: research_assistant.proactive_reports
    impact_modules: [research_assistant.evidence_guard, research_assistant.qe_autonomy]
    layer: backend_service
    risk_level: medium
    ownership_reason: Proactive reports generate evidence-backed morning and experiment reports without touching production runtimes.
  - rule_id: research_assistant_reflection_card
    priority: 100
    include:
      - backend/services/research_assistant/reflection_card.py
      - backend/tests/research_assistant/test_reflection_card_loop.py
    primary_module: research_assistant.reflection_card
    impact_modules: [research_assistant.memory_curator, research_assistant.prompt_lab]
    layer: backend_service
    risk_level: medium
    ownership_reason: Reflection cards store failure learning signals consumed by curation and prompt evaluation loops.
  - rule_id: research_assistant_prompt_lab
    priority: 100
    include:
      - backend/services/research_assistant/prompt_lab.py
      - backend/tests/research_assistant/test_prompt_lab_gepa_offline.py
      - backend/tests/research_assistant/test_prompt_lab_judge_gated.py
    primary_module: research_assistant.prompt_lab
    impact_modules: [research_assistant.reflection_card, research_assistant.skill_library]
    layer: backend_service
    risk_level: high
    ownership_reason: Prompt Lab may only propose and evaluate prompt candidates; activation changes require approval.
  - rule_id: research_assistant_skill_library
    priority: 100
    include:
      - backend/services/research_assistant/skill_library.py
      - backend/tests/research_assistant/test_skill_library.py
    primary_module: research_assistant.skill_library
    impact_modules: [research_assistant.qe_autonomy, research_assistant.prompt_lab]
    layer: backend_service
    risk_level: medium
    ownership_reason: Skill library and curriculum records feed self-improvement while staying behind promotion gates.
  - rule_id: research_assistant_product_core
    priority: 100
    include:
      - backend/services/research_assistant/product_core/**
      - backend/tests/research_assistant/test_core_empty_boot.py
    primary_module: research_assistant.product_core
    impact_modules: [research_assistant.core_adapter]
    layer: backend_service
    risk_level: high
    ownership_reason: Portable product core must boot without AIstock-specific adapters or private data packages.
  - rule_id: research_assistant_core_adapter
    priority: 100
    include:
      - backend/services/research_assistant/core_adapter/**
      - backend/tests/research_assistant/test_core_no_adapter_import.py
    primary_module: research_assistant.core_adapter
    impact_modules: [research_assistant.product_core, research_assistant.generic_mcp_client]
    layer: backend_service
    risk_level: high
    ownership_reason: Core adapter boundaries define provider interfaces and dependency-direction checks.
  - rule_id: research_assistant_generic_mcp_client
    priority: 100
    include:
      - backend/services/research_assistant/generic_mcp_client.py
