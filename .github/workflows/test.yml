name: AIstock CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AIstock is a Windows-first project; runners must be Windows.
# CI uses a venv installed from requirements.txt (no conda) so the workflow
# stays portable to GitHub-hosted Windows runners. Local dev still uses the
# AIstock conda env per docs/process/.
defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  AISTOCK_GUARDRAIL_BASELINE_JSON: tests/aistock_validation/guardrails_baseline_20260511.json

permissions:
  contents: read
  pull-requests: write

jobs:
  classify-changes:
    name: Classify CI changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_required: ${{ steps.classify.outputs.backend_required }}
      close_sync_metadata_only: ${{ steps.classify.outputs.close_sync_metadata_only }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changed-file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/ci_change_classifier
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify "${BASE_SHA}" >/dev/null 2>&1; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > tmp/validation/ci_change_classifier/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" > tmp/validation/ci_change_classifier/changed_files.txt
          fi
          cat tmp/validation/ci_change_classifier/changed_files.txt

      - name: Classify CI lane
        id: classify
        run: |
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/ci_change_classifier/changed_files.txt \
            --output-json tmp/validation/ci_change_classifier/summary.json

      - name: Upload CI change-classifier artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-change-classifier
          path: tmp/validation/ci_change_classifier/
          if-no-files-found: ignore

  static-gate:
    name: Static gate (l0 + module registry)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install nox + light deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox httpx pyyaml pytest

      - name: nox -s l0
        run: python -m nox -s l0

      - name: nox -s validation_module_registry_l0
        run: python -m nox -s validation_module_registry_l0

      - name: nox -s validation_catalog_integrity
        run: python -m nox -s validation_catalog_integrity

      - name: Upload guardrail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-evidence
          path: tmp/validation/guardrails/
          if-no-files-found: ignore

  backend-tests:
    name: Backend tests (${{ matrix.session }})
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.backend_required != 'false'
    # ubuntu-latest is required because GitHub-hosted Windows runners do NOT
    # support `services:` containers (pg_isready / docker daemon are absent).
    # All current backend nox sessions are pure Python + a postgres URL, so
    # they run cleanly on Linux. Local developers still use Windows + conda
    # AIstock; this CI surface is Linux-only by design.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        session:
          - paper_v2_backend
          - qe_archive_backend
          - model_registry_backend
          - market_regime_label
          - rl_execution_smoke
          - validation_center_backend
          - qe_data_contract_backend
    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        ports: ['5433:5432']
        env:
          POSTGRES_USER: aistock
          POSTGRES_PASSWORD: aistock_dev_password
          POSTGRES_DB: aistock_dev
        options: >-
          --health-cmd "pg_isready -U aistock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend deps via venv (no conda on hosted runners)
        # IMPORTANT: do NOT pip install -r requirements.txt on Linux.
        # requirements.txt is a Windows conda export (UTF-16, contains
        # `file:///C:/...` pins like `anaconda-anon-usage @ file:///C:/...`)
        # that cannot resolve on ubuntu-latest. Stage 4+5 r1 round 2 fix:
        # enumerate the actual Linux-safe dependency set required to run
        # the backend nox sessions in this matrix, then `pip check` to
        # fail fast if anything is missing or conflicting.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            nox \
            fastapi 'uvicorn[standard]' pydantic 'pydantic-settings' python-dotenv \
            httpx 'httpx-sse' requests aiofiles openai reportlab schedule \
            yfinance akshare ta pywencai h5py \
            sqlalchemy alembic psycopg2-binary 'asyncpg' \
            pyyaml 'orjson' \
            pytest 'pytest-cov' 'pytest-asyncio' 'pytest-mock' \
            mcp 'mcp[cli]' \
            pandas numpy scipy 'scikit-learn' pyarrow \
            'python-dateutil' pytz \
            'tenacity' 'cachetools' \
            'aiosqlite'
          python -m pip check

      - name: nox -s ${{ matrix.session }}
        env:
          TDX_DB_HOST: 127.0.0.1
          TDX_DB_PORT: 5433
          TDX_DB_NAME: aistock_dev
          TDX_DB_USER: aistock
          TDX_DB_PASSWORD: aistock_dev_password
        run: python -m nox -s ${{ matrix.session }}

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.session }}
          path: |
            tmp/validation/
            tmp/coverage/
          if-no-files-found: ignore

  failure-bug-register:
    name: Auto-register CI failures as BUGs
    needs: backend-tests
    if: failure() && github.event_name == 'pull_request' && needs.backend-tests.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Note pending bug-register tooling
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::notice::Backend tests failed on PR ${PR_NUMBER}. Run: ${RUN_URL}"
          echo "Stage 5 will add scripts/ci_register_failure_as_bug.py to convert this notice into a tests/aistock_validation/bugs/ JSON automatically."
          echo "Until then, treat the failure as the canonical signal and decide whether to file a BUG manually via MCP report_bug or via the bug_report issue template."

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### CI failure detected',
              '',
              `Backend tests failed on this PR. Failed run: [${context.runId}](${runUrl})`,
              '',
              'Auto bug registration is scheduled for Stage 5. For now, please:',
              '',
              '1. Review the failed matrix job(s) and decide if this is a real regression.',
              '2. If yes, file a bug via `aistock-validation/report_bug` MCP tool, or use',
              '   `.github/ISSUE_TEMPLATE/bug_report.md` and mirror it into',
              '   `tests/aistock_validation/bugs/` per the bug registry workflow doc.',
              '3. Link the new BUG-NNN here so reviewers can route the fix.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
