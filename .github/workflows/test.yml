name: AIstock CI

on:
  pull_request:
    branches: [main]

# AIstock CI runs on pre-provisioned Windows runners. Project dependencies are
# never installed by CI; runner images are versioned and verified instead.
defaults:
  run:
    shell: bash

env:
  GIT_HTTP_LOW_SPEED_LIMIT: '524288'
  GIT_HTTP_LOW_SPEED_TIME: '30'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  AISTOCK_GUARDRAIL_BASELINE_JSON: tests/aistock_validation/guardrails_baseline_20260511.json
  AISTOCK_SELF_HOSTED_SOURCE: F:/Dev/AIstock

permissions:
  contents: read

concurrency:
  group: aistock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-verdict:
    name: CI verdict
    runs-on: ${{ startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-') && 'ubuntu-latest' || fromJSON('["self-hosted","Windows","aistock-ci"]') }}
    timeout-minutes: 120
    steps:
      - name: Prepare verified local Git object mirror
        id: git_mirror
        if: ${{ !(startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-')) }}
        shell: powershell
        run: |
          $env:GIT_ALTERNATE_OBJECT_DIRECTORIES = ''
          $mirrorRoot = 'F:\Dev\github-actions-runner\prebuilt\git\AIstock.git'
          $manifestPath = $mirrorRoot + '.aistock-mirror.json'
          $objects = ''
          try {
            $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            if ($manifest.schema_version -ne 'aistock_git_object_mirror_v1') { throw 'unsupported mirror manifest' }
            if ($manifest.repository -ne $env:GITHUB_REPOSITORY) { throw 'mirror repository mismatch' }
            if ((& git -C $mirrorRoot rev-parse --is-bare-repository) -ne 'true') { throw 'mirror is not bare' }
            $mirrorSha = (& git -C $mirrorRoot rev-parse --verify 'refs/heads/main^{commit}').Trim()
            if ($LASTEXITCODE -ne 0 -or $mirrorSha -ne $manifest.main_sha) { throw 'mirror main identity mismatch' }
            $objects = [System.IO.Path]::GetFullPath((Join-Path $mirrorRoot 'objects'))
            $workspaceHead = Join-Path $env:GITHUB_WORKSPACE '.git\HEAD'
            if (-not (Test-Path -LiteralPath $workspaceHead -PathType Leaf)) {
              & git -C $env:GITHUB_WORKSPACE init --quiet | Out-Null
              & git -C $env:GITHUB_WORKSPACE remote get-url origin 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) {
                & git -C $env:GITHUB_WORKSPACE remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY"
              } else {
                & git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/$env:GITHUB_REPOSITORY"
              }
              & git -C $env:GITHUB_WORKSPACE fetch --quiet --force --no-tags --no-write-fetch-head $mirrorRoot 'refs/heads/main:refs/remotes/aistock-mirror/main' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'local mirror seed fetch failed' }
              & git -C $env:GITHUB_WORKSPACE checkout --quiet --force --detach refs/remotes/aistock-mirror/main | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'local mirror seed checkout failed' }
            }
            "git_object_mirror status=ready main_sha=$mirrorSha"
          } catch {
            Write-Warning "git_object_mirror status=unavailable fallback=bounded_remote reason=$($_.Exception.Message)"
            $objects = ''
          }
          "objects=$objects" >> $env:GITHUB_OUTPUT
          "GIT_ALTERNATE_OBJECT_DIRECTORIES=$objects" >> $env:GITHUB_ENV
          exit 0

      - uses: actions/checkout@v7
        timeout-minutes: 5
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ steps.git_mirror.outputs.objects }}
        with:
          fetch-depth: 2

      - name: Reclaim interrupted Git pack fragments
        if: ${{ always() && !(startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-')) }}
        continue-on-error: true
        shell: powershell
        run: |
          $workspaceRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar
          )
          $packRoot = [System.IO.Path]::GetFullPath((Join-Path $workspaceRoot '.git\objects\pack'))
          $workspacePrefix = $workspaceRoot + [System.IO.Path]::DirectorySeparatorChar
          if (-not $packRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Git pack root escaped runner workspace: $packRoot"
          }
          $fragments = @(
            Get-ChildItem -LiteralPath $packRoot -File -Filter 'tmp_pack_*' -ErrorAction SilentlyContinue
          )
          $removedBytes = ($fragments | Measure-Object -Property Length -Sum).Sum
          foreach ($fragment in $fragments) {
            Remove-Item -LiteralPath $fragment.FullName -Force -ErrorAction Stop
          }
          "interrupted_git_pack_cleanup count=$($fragments.Count) bytes=$([long]$removedBytes)"

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_REF: ${{ github.ref }}
        run: |
          python scripts/ci_changed_files.py --prepare-pr-merge-base-only \
            --base-ref "${BASE_REF}" --base-sha "${BASE_SHA}" --checkout-ref "${CHECKOUT_REF}"

      - name: Verify prebuilt AIstock-CI environment
        if: ${{ !(startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-')) }}
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: Build changed-file list
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/ci_change_classifier
          python scripts/ci_changed_files.py \
            --output tmp/validation/ci_change_classifier/changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}"
          cat tmp/validation/ci_change_classifier/changed_files.txt

      - name: Classify CI lane
        id: classify
        env:
          CLOSE_SYNC_BRANCH: ${{ startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-') }}
        run: |
          if [[ "${CLOSE_SYNC_BRANCH}" == "true" ]]; then
            python scripts/bug_registry_metadata_check.py \
              --changed-files-file tmp/validation/ci_change_classifier/changed_files.txt \
              --close-sync-only \
              --output-json tmp/validation/ci_change_classifier/summary.json
            {
              echo 'backend_required=false'
              echo 'backend_sessions=[]'
              echo 'dev_db_required=false'
              echo 'dev_db_plan_keys=[]'
              echo 'runner_kind=github_hosted_metadata'
              echo 'plan_routing={}'
              echo 'environment_fingerprint_ref=not_required'
              echo 'install_forbidden=true'
              echo 'dependency_validation_required=false'
              echo 'dependency_files=[]'
              echo 'frontend_required=false'
              echo 'frontend_test_targets=[]'
              echo 'go_required=false'
              echo 'close_sync_metadata_only=true'
              echo 'workflow_validation_required=false'
              echo 'workflow_test_targets=[]'
              echo 'docs_lite_required=false'
              echo 'static_gate_required=true'
              echo 'catalog_validation_required=false'
              echo 'prompt_evaluation_required=false'
              echo 'classification=close_sync_metadata_only'
            } >> "${GITHUB_OUTPUT}"
          else
            python scripts/ci_change_classifier.py \
              --changed-files-file tmp/validation/ci_change_classifier/changed_files.txt \
              --output-json tmp/validation/ci_change_classifier/summary.json
          fi

      - name: Docs-lite version record
        if: steps.classify.outputs.static_gate_required == 'false'
        run: |
          mkdir -p tmp/validation/guardrails
          {
            echo "# Static gate docs-lite record"
            echo ""
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo "- nox: skipped"
            echo "- module_registry_l0: skipped"
            echo ""
            echo "This documentation-only update keeps the static gate green without running code checks."
          } > tmp/validation/guardrails/docs-lite-version-record.md
          cat tmp/validation/guardrails/docs-lite-version-record.md

      - name: nox -s l0 -- changed files
        id: l0_validation
        if: steps.classify.outputs.static_gate_required != 'false' && steps.classify.outputs.close_sync_metadata_only != 'true'
        run: |
          mapfile -t classified_files < tmp/validation/ci_change_classifier/changed_files.txt
          changed_files=()
          for path in "${classified_files[@]}"; do
            if [ -e "${path}" ]; then
              changed_files+=("${path}")
            fi
          done
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files require the l0 scan."
            exit 0
          fi
          python -m nox -s l0 -- "${changed_files[@]}"

      - name: nox -s validation_module_registry_l0
        id: module_registry_validation
        if: steps.classify.outputs.static_gate_required != 'false' && steps.classify.outputs.close_sync_metadata_only != 'true' && steps.classify.outputs.catalog_validation_required == 'true'
        run: python -m nox -s validation_module_registry_l0

      - name: nox -s validation_catalog_integrity
        id: catalog_integrity_validation
        if: steps.classify.outputs.static_gate_required != 'false' && steps.classify.outputs.close_sync_metadata_only != 'true' && steps.classify.outputs.catalog_validation_required == 'true'
        run: python -m nox -s validation_catalog_integrity

      - name: Validate changed dependency surface
        id: dependency_validation
        if: always() && steps.classify.outcome == 'success' && steps.classify.outputs.dependency_validation_required == 'true'
        continue-on-error: true
        env:
          DEPENDENCY_FILES: ${{ steps.classify.outputs.dependency_files }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/dependency_update
          mapfile -t dependency_files < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["DEPENDENCY_FILES"])))' | tr -d '\r')
          for file in "${dependency_files[@]}"; do
            case "$file" in
              requirements*.txt|.github/requirements/*.txt)
                key=$(python -c "import hashlib; print(hashlib.sha256('$file'.encode()).hexdigest())")
                changed="tmp/validation/dependency_update/${key}.changed.txt"
                python scripts/validate_changed_requirements.py \
                  --base-commit "origin/${BASE_REF}" \
                  --head-commit "${HEAD_SHA}" \
                  --file "$file" \
                  --requirements-output "$changed" \
                  --constraints-output "tmp/validation/dependency_update/${key}.constraints.txt" \
                  --summary-output "tmp/validation/dependency_update/${key}.summary.json"
                if [[ -s "$changed" ]]; then
                  python -m pip check
                fi
                ;;
              pyproject.toml)
                python -m pip check
                ;;
              .github/renovate.json)
                python -m json.tool "$file" > /dev/null
                ;;
              frontend/package.json|frontend/package-lock.json)
                echo "Frontend dependency contract is covered by the existing lockfile-bound frontend lane: $file"
                ;;
            esac
          done

      - name: Run PR quality enforcement
        id: pr_quality_validation
        if: always() && steps.classify.outcome == 'success' && steps.classify.outputs.docs_lite_required != 'true' && steps.classify.outputs.close_sync_metadata_only != 'true'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          AISTOCK_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          AISTOCK_PR_BODY: ${{ github.event.pull_request.body || '' }}
          AISTOCK_PR_QUALITY_ENFORCE_P0P1: ${{ vars.AISTOCK_PR_QUALITY_ENFORCE_P0P1 || 'true' }}
        run: |
          mkdir -p tmp/validation/pr_quality
          BASE_COMMIT="origin/${BASE_REF}"
          ENFORCE_ARGS=()
          if [ "${AISTOCK_PR_QUALITY_ENFORCE_P0P1}" = "true" ]; then
            ENFORCE_ARGS+=(--enforce-p0-p1-evidence)
          fi
          python scripts/issue_flow.py pr-check \
            --base "${BASE_COMMIT}" \
            --head HEAD \
            --output-json tmp/validation/pr_quality/summary.json \
            --output-md tmp/validation/pr_quality/summary.md \
            "${ENFORCE_ARGS[@]}"
          cat tmp/validation/pr_quality/summary.md
          python scripts/code_intelligence_adapter.py summary \
            --item-id "PR-${{ github.event.pull_request.number || github.run_id }}" \
            --query "AIstock PR ${{ github.event.pull_request.number || github.run_id }} impact and affected tests" \
            --changed-files-file tmp/validation/ci_change_classifier/changed_files.txt \
            --skip-external \
            --output tmp/validation/pr_quality/code-intelligence-summary.json \
            --output-md tmp/validation/pr_quality/code-intelligence-summary.md
          cat tmp/validation/pr_quality/code-intelligence-summary.md
          git diff --name-only --diff-filter=ACMRT "${BASE_COMMIT}...HEAD" -- '*.py' > tmp/validation/pr_quality/changed_python.txt
          if [ -s tmp/validation/pr_quality/changed_python.txt ]; then
            xargs -a tmp/validation/pr_quality/changed_python.txt ruff check --force-exclude
          fi

      - name: Run Semgrep guardrails
        id: semgrep_validation
        if: always() && steps.classify.outcome == 'success' && steps.classify.outputs.docs_lite_required != 'true' && steps.classify.outputs.close_sync_metadata_only != 'true'
        continue-on-error: true
        run: |
          command -v semgrep >/dev/null || { echo 'semgrep is not preinstalled on aistock-ci runner' >&2; exit 1; }
          mkdir -p tmp/validation/semgrep
          semgrep_files=()
          while IFS= read -r path; do
            if [ -f "${path}" ]; then
              semgrep_files+=("${path}")
            fi
          done < tmp/validation/ci_change_classifier/changed_files.txt
          if (( ${#semgrep_files[@]} > 0 )); then
            semgrep "${semgrep_files[@]}" \
              --config .semgrep.yml \
              --json \
              --output tmp/validation/semgrep/semgrep.json
          else
            printf '{"results":[],"errors":[],"paths":{"scanned":[]}}\n' > tmp/validation/semgrep/semgrep.json
          fi

      - name: Evaluate lightweight prerequisites before heavy lanes
        id: prerequisite_gate
        if: always()
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ steps.classify.outcome }}
          STATIC_REQUIRED: ${{ steps.classify.outputs.static_gate_required }}
          CLOSE_SYNC_ONLY: ${{ steps.classify.outputs.close_sync_metadata_only }}
          L0_RESULT: ${{ steps.l0_validation.outcome }}
          CATALOG_REQUIRED: ${{ steps.classify.outputs.catalog_validation_required }}
          MODULE_REGISTRY_RESULT: ${{ steps.module_registry_validation.outcome }}
          CATALOG_INTEGRITY_RESULT: ${{ steps.catalog_integrity_validation.outcome }}
          DEPENDENCY_REQUIRED: ${{ steps.classify.outputs.dependency_validation_required }}
          DEPENDENCY_RESULT: ${{ steps.dependency_validation.outcome }}
          DOCS_LITE_REQUIRED: ${{ steps.classify.outputs.docs_lite_required }}
          PR_QUALITY_RESULT: ${{ steps.pr_quality_validation.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep_validation.outcome }}
        run: |
          blockers=()
          [[ "${CLASSIFY_RESULT}" == "success" ]] || blockers+=("classify=${CLASSIFY_RESULT}")
          if [[ "${STATIC_REQUIRED}" != "false" && "${CLOSE_SYNC_ONLY}" != "true" ]]; then
            [[ "${L0_RESULT}" == "success" ]] || blockers+=("l0=${L0_RESULT}")
          fi
          if [[ "${CATALOG_REQUIRED}" == "true" && "${CLOSE_SYNC_ONLY}" != "true" ]]; then
            [[ "${MODULE_REGISTRY_RESULT}" == "success" ]] || blockers+=("module_registry=${MODULE_REGISTRY_RESULT}")
            [[ "${CATALOG_INTEGRITY_RESULT}" == "success" ]] || blockers+=("catalog_integrity=${CATALOG_INTEGRITY_RESULT}")
          fi
          if [[ "${DEPENDENCY_REQUIRED}" == "true" ]]; then
            [[ "${DEPENDENCY_RESULT}" == "success" ]] || blockers+=("dependency=${DEPENDENCY_RESULT}")
          fi
          if [[ "${DOCS_LITE_REQUIRED}" != "true" && "${CLOSE_SYNC_ONLY}" != "true" ]]; then
            [[ "${PR_QUALITY_RESULT}" == "success" ]] || blockers+=("pr_quality=${PR_QUALITY_RESULT}")
            [[ "${SEMGREP_RESULT}" == "success" ]] || blockers+=("semgrep=${SEMGREP_RESULT}")
          fi
          if (( ${#blockers[@]} > 0 )); then
            echo "heavy_lanes_allowed=false" >> "${GITHUB_OUTPUT}"
            printf 'Heavy CI lanes skipped because a lightweight prerequisite failed: %s\n' "${blockers[@]}"
          else
            echo "heavy_lanes_allowed=true" >> "${GITHUB_OUTPUT}"
            echo "All lightweight prerequisites passed; selected heavy lanes may run."
          fi

      - name: Run selected backend sessions
        id: backend_validation
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.backend_required != 'false'
        continue-on-error: true
        env:
          BACKEND_SESSIONS: ${{ steps.classify.outputs.backend_sessions }}
          AISTOCK_CI_CLASSIFIER_SUMMARY: tmp/validation/ci_change_classifier/summary.json
          AISTOCK_CI_REPO_ROOT: ${{ github.workspace }}
          AISTOCK_CI_TEST_COLLECTION_RECEIPT: tmp/validation/ci_change_classifier/collected_tests.txt
          PYTEST_ADDOPTS: -p scripts.ci_plan_coverage
        run: |
          rm -f "${AISTOCK_CI_TEST_COLLECTION_RECEIPT}"
          mapfile -t backend_sessions < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["BACKEND_SESSIONS"])))' | tr -d '\r')
          backend_failures=()
          for session in "${backend_sessions[@]}"; do
            if ! python -m nox -s "${session}"; then
              backend_failures+=("${session}")
            fi
          done
          if ! python scripts/ci_plan_coverage.py \
            --classifier-summary "${AISTOCK_CI_CLASSIFIER_SUMMARY}" \
            --receipt "${AISTOCK_CI_TEST_COLLECTION_RECEIPT}" \
            --output-json tmp/validation/ci_change_classifier/test-plan-coverage.json; then
            backend_failures+=("changed_test_plan_coverage")
          fi
          if (( ${#backend_failures[@]} > 0 )); then
            printf 'Selected backend session failed: %s\n' "${backend_failures[@]}" >&2
            exit 1
          fi

      - name: Attach lockfile-matched prebuilt frontend dependencies
        id: frontend_dependencies
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.frontend_required == 'true'
        continue-on-error: true
        shell: powershell
        run: |
          python scripts/ci/prepare_self_hosted_workspace.py `
            --source "${env:AISTOCK_SELF_HOSTED_SOURCE}" `
            --dest "${env:GITHUB_WORKSPACE}" `
            --expected-commit "${env:GITHUB_SHA}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --frontend-node-modules-source "${env:AISTOCK_SELF_HOSTED_SOURCE}/frontend/node_modules" `
            --attach-frontend-only `
            --summary-json "${env:RUNNER_TEMP}/aistock_self_hosted_workspace/${env:GITHUB_JOB}.json"

      - name: Run selected frontend quality
        id: frontend_validation
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.frontend_required == 'true' && steps.frontend_dependencies.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          FRONTEND_TEST_TARGETS: ${{ steps.classify.outputs.frontend_test_targets }}
        run: |
          command -v node >/dev/null || { echo 'node is not preinstalled on aistock runner' >&2; exit 1; }
          test -d node_modules || { echo 'frontend/node_modules is not prebuilt; dependency installation is prohibited in CI' >&2; exit 1; }
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          node node_modules/next/dist/bin/next lint
          if [[ "${FRONTEND_TEST_TARGETS}" != "[]" ]]; then
            mapfile -t module_test_targets < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["FRONTEND_TEST_TARGETS"])))' | tr -d '\r')
            node node_modules/@playwright/test/cli.js test "${module_test_targets[@]}"
          fi

      - name: Run selected TDX Go tests
        id: go_validation
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.go_required == 'true'
        continue-on-error: true
        working-directory: tdx-api-main
        env:
          GOPROXY: off
        run: go test ./...

      - name: Run selected prompt evaluation
        id: prompt_validation
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.prompt_evaluation_required == 'true'
        continue-on-error: true
        run: |
          mkdir -p tmp/validation/llm_prompt_evaluation
          changed_args=()
          while IFS= read -r path; do
            if [ -n "${path}" ]; then
              changed_args+=(--changed-file "${path}")
            fi
          done < tmp/validation/ci_change_classifier/changed_files.txt
          python scripts/llm_provider_adapter.py --json prompt-evaluation \
            --provider deepseek_api \
            "${changed_args[@]}" \
            --output tmp/validation/llm_prompt_evaluation/prompt-evaluation.json

      - name: Run focused workflow validation tests
        id: workflow_validation
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.workflow_validation_required == 'true' && steps.classify.outputs.workflow_test_targets != '[]'
        continue-on-error: true
        env:
          WORKFLOW_TEST_TARGETS: ${{ steps.classify.outputs.workflow_test_targets }}
          AISTOCK_RUNNER_PROCESS_OWNERSHIP: runner_owned_isolated_only
          AISTOCK_USER_BACKEND_PROCESS_CONTROL: forbidden
        run: |
          test "${AISTOCK_USER_BACKEND_PROCESS_CONTROL}" = "forbidden"
          mapfile -t workflow_test_targets < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["WORKFLOW_TEST_TARGETS"])))' | tr -d '\r')
          python -m pytest "${workflow_test_targets[@]}" -q -p no:cacheprovider

      - name: Enforce CI workflow policy
        id: workflow_policy
        if: always() && steps.prerequisite_gate.outputs.heavy_lanes_allowed == 'true' && steps.classify.outputs.workflow_validation_required == 'true' && steps.classify.outputs.workflow_test_targets != '[]'
        continue-on-error: true
        run: |
          mkdir -p tmp/validation/ci_workflow_policy
          python scripts/ci_workflow_policy_scan.py \
            --output-json tmp/validation/ci_workflow_policy/receipt.json

      - name: Require every selected CI lane to pass
        if: always()
        env:
          CLASSIFY_RESULT: ${{ steps.classify.outcome }}
          STATIC_REQUIRED: ${{ steps.classify.outputs.static_gate_required }}
          CLOSE_SYNC_ONLY: ${{ steps.classify.outputs.close_sync_metadata_only }}
          L0_RESULT: ${{ steps.l0_validation.outcome }}
          CATALOG_REQUIRED: ${{ steps.classify.outputs.catalog_validation_required }}
          MODULE_REGISTRY_RESULT: ${{ steps.module_registry_validation.outcome }}
          CATALOG_INTEGRITY_RESULT: ${{ steps.catalog_integrity_validation.outcome }}
          BACKEND_RESULT: ${{ steps.backend_validation.outcome }}
          DEPENDENCY_REQUIRED: ${{ steps.classify.outputs.dependency_validation_required }}
          DEPENDENCY_RESULT: ${{ steps.dependency_validation.outcome }}
          FRONTEND_DEPENDENCIES_RESULT: ${{ steps.frontend_dependencies.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend_validation.outcome }}
          GO_RESULT: ${{ steps.go_validation.outcome }}
          PROMPT_RESULT: ${{ steps.prompt_validation.outcome }}
          PR_QUALITY_RESULT: ${{ steps.pr_quality_validation.outcome }}
          SEMGREP_RESULT: ${{ steps.semgrep_validation.outcome }}
          WORKFLOW_REQUIRED: ${{ steps.classify.outputs.workflow_validation_required }}
          WORKFLOW_TEST_TARGETS: ${{ steps.classify.outputs.workflow_test_targets }}
          WORKFLOW_TEST_RESULT: ${{ steps.workflow_validation.outcome }}
          WORKFLOW_POLICY_RESULT: ${{ steps.workflow_policy.outcome }}
          DEV_DB_REQUIRED: ${{ steps.classify.outputs.dev_db_required }}
          DEV_DB_PLANS: ${{ steps.classify.outputs.dev_db_plan_keys }}
        run: |
          failures=()
          if [[ "${CLASSIFY_RESULT}" != "success" ]]; then
            failures+=("classify_static=${CLASSIFY_RESULT}")
          fi
          if [[ "${STATIC_REQUIRED}" != "false" && "${CLOSE_SYNC_ONLY}" != "true" && "${L0_RESULT}" != "success" ]]; then
            failures+=("l0=${L0_RESULT}")
          fi
          if [[ "${CATALOG_REQUIRED}" == "true" && "${CLOSE_SYNC_ONLY}" != "true" ]]; then
            [[ "${MODULE_REGISTRY_RESULT}" == "success" ]] || failures+=("module_registry=${MODULE_REGISTRY_RESULT}")
            [[ "${CATALOG_INTEGRITY_RESULT}" == "success" ]] || failures+=("catalog_integrity=${CATALOG_INTEGRITY_RESULT}")
          fi
          if [[ "${DEPENDENCY_REQUIRED}" == "true" && "${DEPENDENCY_RESULT}" != "success" ]]; then
            failures+=("dependency_validation=${DEPENDENCY_RESULT}")
          fi
          for entry in \
            "backend:${BACKEND_RESULT}" \
            "frontend_dependencies:${FRONTEND_DEPENDENCIES_RESULT}" \
            "frontend:${FRONTEND_RESULT}" \
            "go:${GO_RESULT}" \
            "prompt:${PROMPT_RESULT}" \
            "pr_quality:${PR_QUALITY_RESULT}" \
            "semgrep:${SEMGREP_RESULT}"; do
            lane="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failures+=("${lane}=${result}")
            fi
          done
          if [[ "${WORKFLOW_REQUIRED}" = "true" && "${WORKFLOW_TEST_TARGETS}" != "[]" ]]; then
            if [[ "${WORKFLOW_TEST_RESULT}" != "success" ]]; then
              failures+=("workflow_validation=${WORKFLOW_TEST_RESULT}")
            fi
            if [[ "${WORKFLOW_POLICY_RESULT}" != "success" ]]; then
              failures+=("workflow_policy=${WORKFLOW_POLICY_RESULT}")
            fi
          fi
          if [[ "${DEV_DB_REQUIRED}" = "true" ]]; then
            {
              echo "### External DEV database validation"
              echo
              echo "- Required plans: \`${DEV_DB_PLANS}\`"
              echo "- PR CI reports this delegated requirement but does not run database DDL/DML or treat external work as a CI lane failure."
              echo "- External DEV evidence remains a separate feature/issue/production-gate state and must not be inferred from this CI result."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if (( ${#failures[@]} > 0 )); then
            {
              echo "### CI verdict failed"
              echo
              printf -- '- `%s`\n' "${failures[@]}"
              echo
              echo "The failed job logs are the authoritative PR evidence; no separate publisher job or action download is required."
            } >> "${GITHUB_STEP_SUMMARY}"
            printf 'CI verdict failed: %s\n' "${failures[*]}" >&2
            exit 1
          fi
          echo "CI verdict passed: all required and selected lanes succeeded."
