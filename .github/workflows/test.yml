name: AIstock CI

on:
  pull_request:
    branches: [main]

# AIstock CI runs on pre-provisioned Windows runners. Project dependencies are
# never installed by CI; runner images are versioned and verified instead.
defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  AISTOCK_GUARDRAIL_BASELINE_JSON: tests/aistock_validation/guardrails_baseline_20260511.json

permissions:
  contents: read

concurrency:
  group: aistock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify CI changed files
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 10
    outputs:
      backend_required: ${{ steps.classify.outputs.backend_required }}
      backend_sessions: ${{ steps.classify.outputs.backend_sessions }}
      dev_db_required: ${{ steps.classify.outputs.dev_db_required }}
      dev_db_plan_keys: ${{ steps.classify.outputs.dev_db_plan_keys }}
      runner_kind: ${{ steps.classify.outputs.runner_kind }}
      plan_routing: ${{ steps.classify.outputs.plan_routing }}
      environment_fingerprint_ref: ${{ steps.classify.outputs.environment_fingerprint_ref }}
      install_forbidden: ${{ steps.classify.outputs.install_forbidden }}
      frontend_required: ${{ steps.classify.outputs.frontend_required }}
      frontend_test_targets: ${{ steps.classify.outputs.frontend_test_targets }}
      go_required: ${{ steps.classify.outputs.go_required }}
      close_sync_metadata_only: ${{ steps.classify.outputs.close_sync_metadata_only }}
      workflow_validation_required: ${{ steps.classify.outputs.workflow_validation_required }}
      workflow_test_targets: ${{ steps.classify.outputs.workflow_test_targets }}
      docs_lite_required: ${{ steps.classify.outputs.docs_lite_required }}
      static_gate_required: ${{ steps.classify.outputs.static_gate_required }}
      catalog_validation_required: ${{ steps.classify.outputs.catalog_validation_required }}
      prompt_evaluation_required: ${{ steps.classify.outputs.prompt_evaluation_required }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git update-ref "refs/remotes/origin/${BASE_REF}" "${BASE_SHA}"
          else
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                echo "base fetch failed after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Verify prebuilt AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: Build changed-file list
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/ci_change_classifier
          python scripts/ci_changed_files.py \
            --output tmp/validation/ci_change_classifier/changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}"
          cat tmp/validation/ci_change_classifier/changed_files.txt

      - name: Classify CI lane
        id: classify
        run: |
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/ci_change_classifier/changed_files.txt \
            --output-json tmp/validation/ci_change_classifier/summary.json

  static-gate:
    name: Static gate (l0 + module registry)
    needs: classify-changes
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git update-ref "refs/remotes/origin/${BASE_REF}" "${BASE_SHA}"
          else
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                echo "base fetch failed after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Verify prebuilt AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: Docs-lite version record
        if: needs.classify-changes.outputs.static_gate_required == 'false'
        run: |
          mkdir -p tmp/validation/guardrails
          {
            echo "# Static gate docs-lite record"
            echo ""
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo "- nox: skipped"
            echo "- module_registry_l0: skipped"
            echo ""
            echo "This documentation-only update keeps the static gate green without running code checks."
          } > tmp/validation/guardrails/docs-lite-version-record.md
          cat tmp/validation/guardrails/docs-lite-version-record.md

      - name: Build registry changed-file list
        if: needs.classify-changes.outputs.close_sync_metadata_only == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/bug_registry
          python scripts/ci_changed_files.py \
            --output tmp/validation/bug_registry/changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}"

      - name: BUG registry metadata check
        if: needs.classify-changes.outputs.close_sync_metadata_only == 'true'
        run: |
          python scripts/bug_registry_metadata_check.py \
            --changed-files-file tmp/validation/bug_registry/changed_files.txt \
            --close-sync-only \
            --output-json tmp/validation/guardrails/bug-registry-metadata.json

      - name: Build static-gate changed-file list
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/guardrails
          python scripts/ci_changed_files.py \
            --output tmp/validation/guardrails/l0_changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT

      - name: nox -s l0 -- changed files
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true'
        run: |
          mapfile -t changed_files < tmp/validation/guardrails/l0_changed_files.txt
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files require the l0 scan."
            exit 0
          fi
          python -m nox -s l0 -- "${changed_files[@]}"

      - name: nox -s validation_module_registry_l0
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true' && needs.classify-changes.outputs.catalog_validation_required == 'true'
        run: python -m nox -s validation_module_registry_l0

      - name: nox -s validation_catalog_integrity
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true' && needs.classify-changes.outputs.catalog_validation_required == 'true'
        run: python -m nox -s validation_catalog_integrity

  docs-lite:
    name: Docs-lite version record
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_lite_required == 'true'
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git update-ref "refs/remotes/origin/${BASE_REF}" "${BASE_SHA}"
          else
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                echo "base fetch failed after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Verify prebuilt AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: Record documentation-only change
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          CLASSIFICATION: ${{ needs.classify-changes.outputs.classification }}
        run: |
          mkdir -p tmp/validation/docs_lite
          python scripts/ci_changed_files.py \
            --output tmp/validation/docs_lite/changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}"
          {
            echo "# Docs-lite version record"
            echo ""
            echo "- classification: ${CLASSIFICATION}"
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo ""
            echo "## Changed files"
            sed 's/^/- `/' tmp/validation/docs_lite/changed_files.txt | sed 's/$/`/'
          } > tmp/validation/docs_lite/version-record.md
          cat tmp/validation/docs_lite/version-record.md

  backend-tests:
    name: Backend tests (${{ matrix.session }})
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.backend_required != 'false'
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJson(needs.classify-changes.outputs.backend_sessions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: nox -s ${{ matrix.session }}
        run: python -m nox -s ${{ matrix.session }}

  frontend-quality:
    name: Frontend quality (type + lint)
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.frontend_required == 'true'
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Verify prebuilt frontend toolchain
        shell: powershell
        run: |
          python ../scripts/ci_environment_verify.py
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { throw 'node is not preinstalled on aistock runner' }
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) { throw 'npm is not preinstalled on aistock runner' }
          if (-not (Test-Path -LiteralPath 'node_modules')) { throw 'frontend/node_modules is not prebuilt; dependency installation is prohibited in CI' }

      - name: Type-check changed frontend surface
        run: ./node_modules/.bin/tsc --noEmit --incremental false

      - name: Lint frontend surface
        run: npm run lint

      - name: Run owning frontend module tests
        if: needs.classify-changes.outputs.frontend_test_targets != '[]'
        env:
          FRONTEND_TEST_TARGETS: ${{ needs.classify-changes.outputs.frontend_test_targets }}
        run: |
          python -c 'import json, os; print("\n".join(json.loads(os.environ["FRONTEND_TEST_TARGETS"])))' > module_test_targets.txt
          mapfile -t module_test_targets < module_test_targets.txt
          npm run test:e2e -- "${module_test_targets[@]}"

  tdx-go-tests:
    name: TDX Go tests
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.go_required == 'true'
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tdx-api-main
    steps:
      - uses: actions/checkout@v4

      - name: Verify prebuilt AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python ../scripts/ci_environment_verify.py

      - name: Run Go tests
        env:
          GOPROXY: off
        run: go test ./...

  workflow-validation-tests:
    name: Workflow validation fast lane (no user-backend process control)
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.workflow_validation_required == 'true' && needs.classify-changes.outputs.workflow_test_targets != '[]'
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify prebuilt AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: Run focused workflow validation tests
        env:
          WORKFLOW_TEST_TARGETS: ${{ needs.classify-changes.outputs.workflow_test_targets }}
          AISTOCK_RUNNER_PROCESS_OWNERSHIP: runner_owned_isolated_only
          AISTOCK_USER_BACKEND_PROCESS_CONTROL: forbidden
        run: |
          test "${AISTOCK_USER_BACKEND_PROCESS_CONTROL}" = "forbidden"
          python -c 'import json, os; print("\n".join(json.loads(os.environ["WORKFLOW_TEST_TARGETS"])))' | tr -d '\r' > workflow_test_targets.txt
          mapfile -t workflow_test_targets < workflow_test_targets.txt
          python -m pytest "${workflow_test_targets[@]}" -q -p no:cacheprovider

      - name: Enforce CI workflow policy
        run: |
          mkdir -p tmp/validation/ci_workflow_policy
          python scripts/ci_workflow_policy_scan.py \
            --output-json tmp/validation/ci_workflow_policy/receipt.json

  prompt-evaluation:
    name: Validation LLM prompt evaluation
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.prompt_evaluation_required == 'true'
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git update-ref "refs/remotes/origin/${BASE_REF}" "${BASE_SHA}"
          else
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
                break
              fi
              if [[ "${attempt}" == "3" ]]; then
                echo "base fetch failed after 3 attempts" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Verify prebuilt AIstock-CI environment
        shell: powershell
        env:
          AISTOCK_CI_ENV_NAME: AIstock-CI
        run: python scripts/ci_environment_verify.py

      - name: Build changed-file list
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/llm_prompt_evaluation
          python scripts/ci_changed_files.py \
            --output tmp/validation/llm_prompt_evaluation/changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}"

      - name: Run prompt evaluation policy gate
        run: |
          changed_args=()
          while IFS= read -r path; do
            if [ -n "${path}" ]; then
              changed_args+=(--changed-file "${path}")
            fi
          done < tmp/validation/llm_prompt_evaluation/changed_files.txt
          python scripts/llm_provider_adapter.py --json prompt-evaluation \
            --provider github_models \
            "${changed_args[@]}" \
            --output tmp/validation/llm_prompt_evaluation/prompt-evaluation.json

  ci-verdict:
    name: CI verdict
    needs:
      - classify-changes
      - static-gate
      - docs-lite
      - backend-tests
      - frontend-quality
      - tdx-go-tests
      - workflow-validation-tests
      - prompt-evaluation
    if: always()
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 3
    steps:
      - name: Require every selected CI lane to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          STATIC_RESULT: ${{ needs.static-gate.result }}
          DOCS_RESULT: ${{ needs.docs-lite.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          GO_RESULT: ${{ needs.tdx-go-tests.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-validation-tests.result }}
          PROMPT_RESULT: ${{ needs.prompt-evaluation.result }}
          DEV_DB_REQUIRED: ${{ needs.classify-changes.outputs.dev_db_required }}
          DEV_DB_PLANS: ${{ needs.classify-changes.outputs.dev_db_plan_keys }}
        run: |
          failures=()
          for entry in "classify:${CLASSIFY_RESULT}" "static:${STATIC_RESULT}"; do
            lane="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" != "success" ]]; then
              failures+=("${lane}=${result}")
            fi
          done
          for entry in \
            "docs:${DOCS_RESULT}" \
            "backend:${BACKEND_RESULT}" \
            "frontend:${FRONTEND_RESULT}" \
            "go:${GO_RESULT}" \
            "workflow:${WORKFLOW_RESULT}" \
            "prompt:${PROMPT_RESULT}"; do
            lane="${entry%%:*}"
            result="${entry#*:}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failures+=("${lane}=${result}")
            fi
          done
          if [[ "${DEV_DB_REQUIRED}" = "true" ]]; then
            failures+=("dev_db=external_DEV_validation_required:${DEV_DB_PLANS}")
          fi
          if (( ${#failures[@]} > 0 )); then
            {
              echo "### CI verdict failed"
              echo
              printf -- '- `%s`\n' "${failures[@]}"
              echo
              echo "The failed job logs are the authoritative PR evidence; no separate publisher job or action download is required."
            } >> "${GITHUB_STEP_SUMMARY}"
            printf 'CI verdict failed: %s\n' "${failures[*]}" >&2
            exit 1
          fi
          echo "CI verdict passed: all required and selected lanes succeeded."
