name: AIstock CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AIstock is a Windows-first project; runners must be Windows.
# CI uses a venv installed from requirements.txt (no conda) so the workflow
# stays portable to GitHub-hosted Windows runners. Local dev still uses the
# AIstock conda env per docs/process/.
defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  AISTOCK_GUARDRAIL_BASELINE_JSON: tests/aistock_validation/guardrails_baseline_20260511.json

permissions:
  contents: read
  pull-requests: write

jobs:
  classify-changes:
    name: Classify CI changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_required: ${{ steps.classify.outputs.backend_required }}
      close_sync_metadata_only: ${{ steps.classify.outputs.close_sync_metadata_only }}
      workflow_validation_required: ${{ steps.classify.outputs.workflow_validation_required }}
      docs_lite_required: ${{ steps.classify.outputs.docs_lite_required }}
      static_gate_required: ${{ steps.classify.outputs.static_gate_required }}
      prompt_evaluation_required: ${{ steps.classify.outputs.prompt_evaluation_required }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changed-file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/ci_change_classifier
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify "${BASE_SHA}" >/dev/null 2>&1; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > tmp/validation/ci_change_classifier/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" > tmp/validation/ci_change_classifier/changed_files.txt
          fi
          cat tmp/validation/ci_change_classifier/changed_files.txt

      - name: Classify CI lane
        id: classify
        run: |
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/ci_change_classifier/changed_files.txt \
            --output-json tmp/validation/ci_change_classifier/summary.json

      - name: Upload CI change-classifier artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-change-classifier
          path: tmp/validation/ci_change_classifier/
          if-no-files-found: ignore

  static-gate:
    name: Static gate (l0 + module registry)
    needs: classify-changes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs-lite version record
        if: needs.classify-changes.outputs.static_gate_required == 'false'
        run: |
          mkdir -p tmp/validation/guardrails
          {
            echo "# Static gate docs-lite record"
            echo ""
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo "- nox: skipped"
            echo "- module_registry_l0: skipped"
            echo ""
            echo "This documentation-only update keeps the static gate green without running code checks."
          } > tmp/validation/guardrails/docs-lite-version-record.md
          cat tmp/validation/guardrails/docs-lite-version-record.md

      - name: Set up Python 3.12
        if: needs.classify-changes.outputs.static_gate_required != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build registry changed-file list
        if: needs.classify-changes.outputs.close_sync_metadata_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/bug_registry
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify "${BASE_SHA}" >/dev/null 2>&1; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > tmp/validation/bug_registry/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" > tmp/validation/bug_registry/changed_files.txt
          fi

      - name: BUG registry metadata check
        if: needs.classify-changes.outputs.close_sync_metadata_only == 'true'
        run: |
          python scripts/bug_registry_metadata_check.py \
            --changed-files-file tmp/validation/bug_registry/changed_files.txt \
            --close-sync-only \
            --output-json tmp/validation/guardrails/bug-registry-metadata.json

      - name: Install nox + light deps
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox httpx pyyaml pytest

      - name: nox -s l0
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true'
        run: python -m nox -s l0

      - name: nox -s validation_module_registry_l0
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true'
        run: python -m nox -s validation_module_registry_l0

      - name: nox -s validation_catalog_integrity
        if: needs.classify-changes.outputs.static_gate_required != 'false' && needs.classify-changes.outputs.close_sync_metadata_only != 'true'
        run: python -m nox -s validation_catalog_integrity

      - name: Upload guardrail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-evidence
          path: tmp/validation/guardrails/
          if-no-files-found: ignore

  docs-lite:
    name: Docs-lite version record
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_lite_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record documentation-only change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
          CLASSIFICATION: ${{ needs.classify-changes.outputs.classification }}
        run: |
          mkdir -p tmp/validation/docs_lite
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify "${BASE_SHA}" >/dev/null 2>&1; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > tmp/validation/docs_lite/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" > tmp/validation/docs_lite/changed_files.txt
          fi
          {
            echo "# Docs-lite version record"
            echo ""
            echo "- classification: ${CLASSIFICATION}"
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo ""
            echo "## Changed files"
            sed 's/^/- `/' tmp/validation/docs_lite/changed_files.txt | sed 's/$/`/'
          } > tmp/validation/docs_lite/version-record.md
          cat tmp/validation/docs_lite/version-record.md

      - name: Upload docs-lite record
        uses: actions/upload-artifact@v4
        with:
          name: docs-lite-version-record
          path: tmp/validation/docs_lite/
          if-no-files-found: error

  backend-tests:
    name: Backend tests (${{ matrix.session }})
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.backend_required != 'false'
    # ubuntu-latest is required because GitHub-hosted Windows runners do NOT
    # support `services:` containers (pg_isready / docker daemon are absent).
    # All current backend nox sessions are pure Python + a postgres URL, so
    # they run cleanly on Linux. Local developers still use Windows + conda
    # AIstock; this CI surface is Linux-only by design.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        session:
          - paper_v2_backend
          - qe_archive_backend
          - model_registry_backend
          - market_regime_label
          - rl_execution_smoke
          - validation_center_backend
          - qe_data_contract_backend
    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        ports: ['5433:5432']
        env:
          POSTGRES_USER: aistock
          POSTGRES_PASSWORD: aistock_dev_password
          POSTGRES_DB: aistock_dev
        options: >-
          --health-cmd "pg_isready -U aistock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend deps via venv (no conda on hosted runners)
        # IMPORTANT: do NOT pip install -r requirements.txt on Linux.
        # requirements.txt is a Windows conda export (UTF-16, contains
        # `file:///C:/...` pins like `anaconda-anon-usage @ file:///C:/...`)
        # that cannot resolve on ubuntu-latest. Stage 4+5 r1 round 2 fix:
        # enumerate the actual Linux-safe dependency set required to run
        # the backend nox sessions in this matrix, then `pip check` to
        # fail fast if anything is missing or conflicting.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            nox \
            fastapi 'uvicorn[standard]' pydantic 'pydantic-settings' python-dotenv \
            httpx 'httpx-sse' requests aiofiles openai==2.44.0 litellm==1.90.2 reportlab schedule \
            yfinance akshare ta pywencai h5py \
            sqlalchemy alembic psycopg2-binary 'asyncpg' \
            pyyaml 'orjson' \
            pytest 'pytest-cov' 'pytest-asyncio' 'pytest-mock' \
            mcp 'mcp[cli]' \
            pandas numpy scipy 'scikit-learn' pyarrow \
            'python-dateutil' pytz \
            'tenacity' 'cachetools' \
            'aiosqlite'
          python -m pip check

      - name: nox -s ${{ matrix.session }}
        env:
          TDX_DB_HOST: 127.0.0.1
          TDX_DB_PORT: 5433
          TDX_DB_NAME: aistock_dev
          TDX_DB_USER: aistock
          TDX_DB_PASSWORD: aistock_dev_password
        run: python -m nox -s ${{ matrix.session }}

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.session }}
          path: |
            tmp/validation/
            tmp/coverage/
          if-no-files-found: ignore

  workflow-validation-tests:
    name: Workflow validation fast lane
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.workflow_validation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install workflow validation deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest ruff nox requests

      - name: Run focused workflow validation tests
        run: |
          python -m pytest \
            backend/tests/scripts/test_ci_change_classifier.py \
            backend/tests/scripts/test_issue_flow.py \
            backend/tests/scripts/test_aistock_issue_workflow.py \
            backend/tests/scripts/test_ci_failure_issue_summary.py \
            backend/tests/scripts/test_code_intelligence_adapter.py \
            backend/tests/scripts/test_llm_provider_adapter.py \
            backend/tests/scripts/test_nightly_adaptive_scheduler.py \
            -q -p no:cacheprovider

  prompt-evaluation:
    name: Validation LLM prompt evaluation
    needs: [classify-changes, static-gate]
    if: needs.classify-changes.outputs.prompt_evaluation_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install prompt evaluation deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest requests

      - name: Build changed-file list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/llm_prompt_evaluation
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify "${BASE_SHA}" >/dev/null 2>&1; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > tmp/validation/llm_prompt_evaluation/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" > tmp/validation/llm_prompt_evaluation/changed_files.txt
          fi

      - name: Run prompt evaluation policy gate
        run: |
          changed_args=()
          while IFS= read -r path; do
            if [ -n "${path}" ]; then
              changed_args+=(--changed-file "${path}")
            fi
          done < tmp/validation/llm_prompt_evaluation/changed_files.txt
          python scripts/llm_provider_adapter.py --json prompt-evaluation \
            --provider github_models \
            "${changed_args[@]}" \
            --output tmp/validation/llm_prompt_evaluation/prompt-evaluation.json

      - name: Upload prompt evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-prompt-evaluation
          path: tmp/validation/llm_prompt_evaluation/
          if-no-files-found: error

  failure-bug-register:
    name: Auto-register CI failures as BUGs
    needs: [backend-tests, workflow-validation-tests, prompt-evaluation]
    # Keep this job green/no-op when backend tests pass or are intentionally
    # skipped, so PR check summaries do not report a skipped registrar as
    # another failure. The failure path below still comments when backend
    # tests actually fail.
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: No backend failure to register
        if: ${{ needs.backend-tests.result != 'failure' && needs.workflow-validation-tests.result != 'failure' && needs.prompt-evaluation.result != 'failure' }}
        run: |
          echo "backend-tests result: ${{ needs.backend-tests.result }}"
          echo "workflow-validation-tests result: ${{ needs.workflow-validation-tests.result }}"
          echo "prompt-evaluation result: ${{ needs.prompt-evaluation.result }}"
          echo "No CI failure BUG registration required."

      - uses: actions/checkout@v4
        if: ${{ needs.backend-tests.result == 'failure' || needs.workflow-validation-tests.result == 'failure' || needs.prompt-evaluation.result == 'failure' }}

      - name: Build CI failure issue context
        if: ${{ needs.backend-tests.result == 'failure' || needs.workflow-validation-tests.result == 'failure' || needs.prompt-evaluation.result == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p tmp/validation/ci_failure_issue
          python scripts/ci_failure_issue_summary.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${RUN_URL}" \
            --severity "P1" \
            --source-name "AIstock CI" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --log-attempts 3 \
            --log-wait-seconds 10 \
            --output tmp/validation/ci_failure_issue/summary.json \
            --markdown-output tmp/validation/ci_failure_issue/body.md \
            --context-output tmp/validation/ci_failure_issue/context-pack.json \
            --context-markdown-output tmp/validation/ci_failure_issue/context-pack.md \
            --github-issue-payload-output tmp/validation/ci_failure_issue/github-issue-payload.json

      - name: Upload CI failure issue context
        if: ${{ needs.backend-tests.result == 'failure' || needs.workflow-validation-tests.result == 'failure' || needs.prompt-evaluation.result == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-failure-issue-context
          path: tmp/validation/ci_failure_issue/
          if-no-files-found: error
          retention-days: 14

      - name: Create or update CI failure issue
        if: ${{ (needs.backend-tests.result == 'failure' || needs.workflow-validation-tests.result == 'failure' || needs.prompt-evaluation.result == 'failure') && hashFiles('tmp/validation/ci_failure_issue/github-issue-payload.json') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('tmp/validation/ci_failure_issue/github-issue-payload.json', 'utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const search = await github.rest.search.issuesAndPullRequests({
              q: payload.dedupe.search_query,
              per_page: 1,
            });
            let issueNumber = null;
            if (search.data.items.length) {
              issueNumber = search.data.items[0].number;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: payload.recurrence_comment,
              });
              core.info(`Existing issue #${issueNumber} already tracks fingerprint ${payload.dedupe.fingerprint}.`);
            } else {
              try {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: payload.title,
                  body: payload.body,
                  labels: payload.labels,
                });
                issueNumber = created.data.number;
                core.info(`Created issue #${issueNumber}.`);
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }
                core.warning(`Could not apply labels (${payload.labels.join(', ')}); retrying without labels.`);
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: payload.title,
                  body: payload.body,
                });
                issueNumber = created.data.number;
                core.info(`Created issue #${issueNumber} without labels.`);
              }
            }
            const routingBody = [
              '### CI failure issue routed',
              '',
              `Backend tests failed on this PR. Diagnostic issue: #${issueNumber}`,
              '',
              'Use generated context artifact pr-ci-failure-issue-context and run: '
                + `python scripts/aistock_issue_workflow.py triage-ci-issue --issue ${issueNumber} `
                + 'before promoting to BUG JSON.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: routingBody,
            });
