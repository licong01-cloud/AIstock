name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 20 * * 0'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  docs-lite:
    name: CodeQL fast-lane no-op
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_lite: ${{ steps.fast_lane.outputs.docs_lite }}
      registry_sync: ${{ steps.fast_lane.outputs.registry_sync }}
      languages: ${{ steps.fast_lane.outputs.languages }}
      has_languages: ${{ steps.fast_lane.outputs.has_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install change-classifier dependency
        run: python -m pip install --disable-pip-version-check --no-input pyyaml

      - name: Detect CodeQL fast lane
        id: fast_lane
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tmp/validation/codeql
          python scripts/ci_changed_files.py \
            --output tmp/validation/codeql/changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/codeql/changed_files.txt \
            --output-json tmp/validation/codeql/change-classification.json
          DOCS_LITE=$(python -c "import json; print('1' if json.load(open('tmp/validation/codeql/change-classification.json', encoding='utf-8'))['docs_lite_required'] else '0')")
          REGISTRY_SYNC=$(python -c "import json; print('1' if json.load(open('tmp/validation/codeql/change-classification.json', encoding='utf-8'))['close_sync_metadata_only'] else '0')")
          PYTHON_CHANGED=0
          JAVASCRIPT_CHANGED=0
          while IFS= read -r path; do
            case "${path}" in
              *.py) PYTHON_CHANGED=1 ;;
              *.js|*.jsx|*.ts|*.tsx) JAVASCRIPT_CHANGED=1 ;;
            esac
          done < tmp/validation/codeql/changed_files.txt
          if [ "${PYTHON_CHANGED}" = "1" ] && [ "${JAVASCRIPT_CHANGED}" = "1" ]; then
            LANGUAGES='["python","javascript-typescript"]'
          elif [ "${PYTHON_CHANGED}" = "1" ]; then
            LANGUAGES='["python"]'
          elif [ "${JAVASCRIPT_CHANGED}" = "1" ]; then
            LANGUAGES='["javascript-typescript"]'
          else
            LANGUAGES='[]'
          fi
          HAS_LANGUAGES=$([ "${LANGUAGES}" = "[]" ] && echo 0 || echo 1)
          echo "docs_lite=${DOCS_LITE}" >> "${GITHUB_OUTPUT}"
          echo "registry_sync=${REGISTRY_SYNC}" >> "${GITHUB_OUTPUT}"
          echo "languages=${LANGUAGES}" >> "${GITHUB_OUTPUT}"
          echo "has_languages=${HAS_LANGUAGES}" >> "${GITHUB_OUTPUT}"
          if [ "${HAS_LANGUAGES}" = "0" ]; then
            python -c "import json; data=json.load(open('tmp/validation/codeql/change-classification.json', encoding='utf-8')); print(json.dumps({'docs_lite': data['docs_lite_required'], 'registry_sync': data['close_sync_metadata_only'], 'validation': data['classification'], 'codeql': 'skipped', 'reason': 'no_changed_codeql_language'}, ensure_ascii=False))" > tmp/validation/codeql/codeql.json
            cat tmp/validation/codeql/codeql.json
          fi

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: docs-lite
    if: needs.docs-lite.outputs.has_languages == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.docs-lite.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

