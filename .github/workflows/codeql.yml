name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 20 * * 0'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  docs-lite:
    name: CodeQL docs-lite no-op
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_lite: ${{ steps.docs_lite.outputs.docs_lite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-lite lane
        id: docs_lite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tmp/validation/codeql
          HEAD_COMMIT="${HEAD_SHA:-HEAD}"
          git rev-parse --verify "${HEAD_COMMIT}^{commit}" >/dev/null 2>&1 || HEAD_COMMIT="HEAD"
          if [ -n "${BASE_SHA}" ] && git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}...${HEAD_COMMIT}" > tmp/validation/codeql/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACMRT -r "${HEAD_COMMIT}" > tmp/validation/codeql/changed_files.txt
          fi
          DOCS_LITE=1
          while IFS= read -r path; do
            case "${path}" in
              docs/architecture/*|docs/analysis/*|docs/operations/*|docs/operations_*.md|README.md)
                ;;
              docs/standards/*|docs/codex_project_memory.md|AGENTS.md|AGENTS.override.md|.codex/*|.claude/*)
                DOCS_LITE=0
                break
                ;;
              "")
                ;;
              *)
                DOCS_LITE=0
                break
                ;;
            esac
          done < tmp/validation/codeql/changed_files.txt
          echo "docs_lite=${DOCS_LITE}" >> "${GITHUB_OUTPUT}"
          if [ "${DOCS_LITE}" = "1" ]; then
            printf '{"docs_lite":true,"validation":"version_change_record_only","codeql":"skipped"}\n' > tmp/validation/codeql/codeql.json
            cat tmp/validation/codeql/codeql.json
          fi

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: docs-lite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Docs-lite CodeQL no-op
        if: needs.docs-lite.outputs.docs_lite == '1'
        run: |
          mkdir -p tmp/validation/codeql
          printf '{"docs_lite":true,"validation":"version_change_record_only","codeql":"skipped","language":"${{ matrix.language }}"}\n' > tmp/validation/codeql/codeql-${{ matrix.language }}.json
          cat tmp/validation/codeql/codeql-${{ matrix.language }}.json

      - name: Initialize CodeQL
        if: needs.docs-lite.outputs.docs_lite != '1'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: needs.docs-lite.outputs.docs_lite != '1'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

