name: AIstock Nightly L3 + DR

on:
  schedule:
    # 19:07 UTC = 03:07 China Standard Time (UTC+8) -- after market close + log rotation
    - cron: '7 19 * * *'
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

env:
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'
  AISTOCK_GUARDRAIL_BASELINE_JSON: tests/aistock_validation/guardrails_baseline_20260511.json
  AISTOCK_SELF_HOSTED_SOURCE: F:/Dev/AIstock

permissions:
  contents: read
  actions: read

jobs:
  runner-preflight:
    name: Runner preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check self-hosted runner availability
        env:
          # Listing self-hosted runners requires repository Administration read permission.
          # If the default GITHUB_TOKEN is insufficient, configure this repository secret.
          AISTOCK_RUNNER_HEALTH_TOKEN: ${{ secrets.AISTOCK_RUNNER_HEALTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp/validation/runner_health
          python scripts/aistock_runner_health.py doctor \
            --repo "${{ github.repository }}" \
            --workflow "nightly.yml" \
            --required-label self-hosted \
            --required-label windows \
            --stale-queued-minutes 30 \
            --output-json tmp/validation/runner_health/runner-health.json \
            --output-md tmp/validation/runner_health/runner-health.md

      - name: Print runner health evidence
        if: always()
        run: |
          cat tmp/validation/runner_health/runner-health.md || true

      - name: Upload runner health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-health-${{ github.run_id }}
          path: tmp/validation/runner_health/
          if-no-files-found: ignore

  dr-snapshot:
    name: DR snapshot prod DB
    needs: runner-preflight
    # self-hosted is mandatory because the DR job needs to read the local
    # production DB at 127.0.0.1:5432; GitHub-hosted runners cannot reach it.
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      DR_TARGET_DIR: 'E:/DEV backup/aistock_pg_snapshots'
      DR_PG_CONTAINER: 'timescaledb'
    steps:
      - name: Prepare local workspace (no GitHub checkout)
        timeout-minutes: 2
        run: |
          python "${env:AISTOCK_SELF_HOSTED_SOURCE}/scripts/ci/prepare_self_hosted_workspace.py" `
            --source "${env:AISTOCK_SELF_HOSTED_SOURCE}" `
            --dest "${env:GITHUB_WORKSPACE}" `
            --expected-commit "${env:GITHUB_SHA}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --summary-json "${env:RUNNER_TEMP}/aistock_self_hosted_workspace/${env:GITHUB_JOB}.json"

      - name: Sanity - docker + target dir reachable
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            Write-Host "::error::docker not on PATH on this self-hosted runner"
            exit 1
          }
          $containers = docker ps --format "{{.Names}}"
          if ($containers -notcontains $env:DR_PG_CONTAINER) {
            Write-Host "::error::DR postgres container $env:DR_PG_CONTAINER is not running on this self-hosted runner"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:DR_TARGET_DIR -PathType Container)) {
            Write-Host "::error::DR target dir $env:DR_TARGET_DIR missing on this runner"
            exit 1
          }

      - name: Run dr_snapshot_prod_db.py
        run: |
          conda run -n AIstock python scripts/dr_snapshot_prod_db.py --target-dir "$env:DR_TARGET_DIR" --container "$env:DR_PG_CONTAINER"

      - name: Run dr_cleanup_old_snapshots.py (apply)
        run: |
          conda run -n AIstock python scripts/dr_cleanup_old_snapshots.py --target-dir "$env:DR_TARGET_DIR" --apply

      - name: Capture DR snapshot metadata (no dump bytes)
        if: always()
        run: |
          $date = Get-Date -Format yyyyMMdd
          New-Item -ItemType Directory -Force -Path "tmp/dr" | Out-Null
          $out = "tmp/dr/snapshot_metadata_${{ github.run_id }}.txt"
          "DR snapshot run ${{ github.run_id }} $date" | Set-Content -Path $out -Encoding UTF8
          "target_dir=$env:DR_TARGET_DIR" | Add-Content -Path $out -Encoding UTF8
          if (Test-Path -LiteralPath $env:DR_TARGET_DIR -PathType Container) {
            Get-ChildItem -LiteralPath $env:DR_TARGET_DIR -Force |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize |
              Out-String |
              Add-Content -Path $out -Encoding UTF8
          } else {
            "target_dir_missing" | Add-Content -Path $out -Encoding UTF8
          }

      - name: Print DR metadata (NOT the dump bytes)
        if: always()
        run: |
          if (Test-Path -LiteralPath "tmp/dr") {
            Get-ChildItem -LiteralPath "tmp/dr" -Recurse -File | ForEach-Object {
              Write-Host $_.FullName
              Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
            }
          }

  dr-validate:
    name: DR validation (dump validity + schema diff + retention)
    needs: dr-snapshot
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      DR_BACKUP_DIR: 'E:/DEV backup/aistock_pg_snapshots'
      DR_PG_CONTAINER: 'timescaledb'
    steps:
      - name: Prepare local workspace (no GitHub checkout)
        timeout-minutes: 2
        run: |
          python "${env:AISTOCK_SELF_HOSTED_SOURCE}/scripts/ci/prepare_self_hosted_workspace.py" `
            --source "${env:AISTOCK_SELF_HOSTED_SOURCE}" `
            --dest "${env:GITHUB_WORKSPACE}" `
            --expected-commit "${env:GITHUB_SHA}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --summary-json "${env:RUNNER_TEMP}/aistock_self_hosted_workspace/${env:GITHUB_JOB}.json"

      - name: nox -s dr_validate
        run: |
          conda run -n AIstock python -m nox -s dr_validate

      - name: Print DR validate evidence
        if: always()
        run: |
          if (Test-Path -LiteralPath "tmp/dr") {
            Get-ChildItem -LiteralPath "tmp/dr" -Recurse -File | ForEach-Object {
              Write-Host $_.FullName
              Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
            }
          }

  nightly-l3:
    name: Nightly L3 (paper_v2 + qe_archive + qe_read)
    # Sequential chain per Codex Lane A r3 review (drawer a25cd473):
    # dr-snapshot -> dr-validate -> nightly-l3 -> paper-v2-live ->
    # full-summary. Previously dr-snapshot and dr-validate ran in
    # parallel with nightly-l3, which let a failing snapshot still
    # produce green L3/live reports.
    needs: dr-validate
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - name: Prepare local workspace (no GitHub checkout)
        timeout-minutes: 2
        run: |
          python "${env:AISTOCK_SELF_HOSTED_SOURCE}/scripts/ci/prepare_self_hosted_workspace.py" `
            --source "${env:AISTOCK_SELF_HOSTED_SOURCE}" `
            --dest "${env:GITHUB_WORKSPACE}" `
            --expected-commit "${env:GITHUB_SHA}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --summary-json "${env:RUNNER_TEMP}/aistock_self_hosted_workspace/${env:GITHUB_JOB}.json"

      # Activates the local AIstock conda env. The runner must have conda on PATH
      # and the AIstock env pre-built (see docs/process/mcp_server_setup_claude_code_20260510.md
      # for env setup pointers). GitHub-hosted Linux runners can't do this.
      - name: Sanity - conda AIstock env present
        run: |
          if (-not (Get-Command conda -ErrorAction SilentlyContinue)) {
            Write-Host "::error::conda not on PATH on this self-hosted runner"
            exit 1
          }
          $envLines = conda env list
          if (-not ($envLines -match '^AIstock\s')) {
            Write-Host "::error::conda env AIstock missing"
            exit 1
          }

      - name: nox -s paper_v2_l3
        run: |
          conda run -n AIstock python -m nox -s paper_v2_l3
        env:
          PAPER_V2_SKIP_REALTIME: '1'

      - name: nox -s qe_archive_l3
        run: |
          conda run -n AIstock python -m nox -s qe_archive_l3
        env:
          QE_ARCHIVE_L3_SKIP_UI: '1'

      - name: nox -s qe_read_l3
        run: |
          conda run -n AIstock python -m nox -s qe_read_l3
        env:
          QE_READ_L3_SKIP_UI: '1'

      - name: Print validation history manifest
        if: always()
        run: |
          if (Test-Path -LiteralPath "tests/aistock_validation/history") {
            Get-ChildItem -LiteralPath "tests/aistock_validation/history" -Recurse -File |
              Select-Object -First 100 -ExpandProperty FullName
          }

  paper-v2-live:
    name: Paper v2 live catch-up (skip realtime by default)
    needs: nightly-l3
    runs-on: [self-hosted, windows]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      PAPER_V2_SKIP_REALTIME: '1'
    steps:
      - name: Prepare local workspace (no GitHub checkout)
        timeout-minutes: 2
        run: |
          python "${env:AISTOCK_SELF_HOSTED_SOURCE}/scripts/ci/prepare_self_hosted_workspace.py" `
            --source "${env:AISTOCK_SELF_HOSTED_SOURCE}" `
            --dest "${env:GITHUB_WORKSPACE}" `
            --expected-commit "${env:GITHUB_SHA}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --summary-json "${env:RUNNER_TEMP}/aistock_self_hosted_workspace/${env:GITHUB_JOB}.json"

      - name: nox -s paper_v2_live
        run: |
          conda run -n AIstock python -m nox -s paper_v2_live

      - name: Print paper-v2 live evidence manifest
        if: always()
        run: |
          if (Test-Path -LiteralPath "tmp/paper_v2") {
            Get-ChildItem -LiteralPath "tmp/paper_v2" -Recurse -File |
              Select-Object -First 100 -ExpandProperty FullName
          }

  code-intelligence-weekly:
    name: Code intelligence weekly graph summary
    needs: runner-preflight
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Prepare local workspace (no GitHub checkout)
        timeout-minutes: 2
        run: |
          python "${env:AISTOCK_SELF_HOSTED_SOURCE}/scripts/ci/prepare_self_hosted_workspace.py" `
            --source "${env:AISTOCK_SELF_HOSTED_SOURCE}" `
            --dest "${env:GITHUB_WORKSPACE}" `
            --expected-commit "${env:GITHUB_SHA}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --summary-json "${env:RUNNER_TEMP}/aistock_self_hosted_workspace/${env:GITHUB_JOB}.json"

      - name: Build CodeGraph freshness artifact
        run: |
          $outDir = "tmp/validation/code-intelligence/${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          conda run -n AIstock python scripts/code_intelligence_adapter.py freshness `
            --output-dir $outDir `
            --output "$outDir/codegraph-freshness.stdout.json"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CodeGraph freshness command exited with $LASTEXITCODE; continuing."
            $global:LASTEXITCODE = 0
            # PowerShell equivalent of bash non-blocking suffix: || true
          }
          if (Test-Path -LiteralPath "$outDir/codegraph-freshness.md") {
            Get-Content -LiteralPath "$outDir/codegraph-freshness.md"
          }

      - name: Build Understand Anything readiness summaries
        run: |
          $outDir = "tmp/validation/code-intelligence/${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          conda run -n AIstock python scripts/code_intelligence_adapter.py ua-configure `
            --language zh `
            --output "$outDir/ua-configure.stdout.json"
          conda run -n AIstock python scripts/code_intelligence_adapter.py ua-summary-all `
            --output-dir $outDir `
            --output "$outDir/ua-summary-manifest.stdout.json"

      - name: Print code intelligence graph summary manifest
        if: always()
        run: |
          if (Test-Path -LiteralPath "tmp/validation/code-intelligence") {
            Get-ChildItem -LiteralPath "tmp/validation/code-intelligence" -Recurse -File |
              Select-Object -First 100 -ExpandProperty FullName
          }

      - name: Build code intelligence upload manifest
        if: always()
        run: |
          $outDir = "tmp/validation/code-intelligence/${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          conda run -n AIstock python scripts/code_intelligence_adapter.py run-manifest `
            --output-dir $outDir `
            --artifact-name "code-intelligence-${{ github.run_id }}" `
            --run-id "${{ github.run_id }}" `
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --branch "${{ github.ref_name }}" `
            --commit "${{ github.sha }}" `
            --output "$outDir/code-intelligence-run-manifest.stdout.json"
          if (Test-Path -LiteralPath "$outDir/code-intelligence-run-manifest.md") {
            Get-Content -LiteralPath "$outDir/code-intelligence-run-manifest.md"
          }

      - name: Upload code intelligence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-intelligence-${{ github.run_id }}
          path: tmp/validation/code-intelligence/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14

  full-summary:
    name: Nightly summary + auto-bug on failure
    needs: [runner-preflight, dr-snapshot, dr-validate, nightly-l3, paper-v2-live, code-intelligence-weekly]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Compose nightly summary
        # Per Codex r4 P1.1 review (drawer d09a0a0): the summary MUST
        # include the dr-validate result line. full-summary.needs already
        # depends on dr-validate, but the markdown report previously
        # omitted it -- a dr-validate failure would not surface in the
        # checked-in nightly summary md.
        env:
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          DR_RESULT: ${{ needs.dr-snapshot.result }}
          DR_VALIDATE_RESULT: ${{ needs.dr-validate.result }}
          L3_RESULT: ${{ needs.nightly-l3.result }}
          LIVE_RESULT: ${{ needs.paper-v2-live.result }}
          CODE_INTELLIGENCE_RESULT: ${{ needs.code-intelligence-weekly.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date +%Y%m%d)
          SUMMARY_DIR="tmp/validation/nightly_summary/${DATE}"
          mkdir -p "${SUMMARY_DIR}"
          cat <<EOF > "${SUMMARY_DIR}/nightly_${RUN_ID}.md"
          # Nightly run ${RUN_ID} ${DATE}

          - runner-preflight: ${RUNNER_PREFLIGHT_RESULT}
          - dr-snapshot: ${DR_RESULT}
          - dr-validate: ${DR_VALIDATE_RESULT}
          - nightly-l3: ${L3_RESULT}
          - paper-v2-live: ${LIVE_RESULT}
          - code-intelligence-weekly: ${CODE_INTELLIGENCE_RESULT}

          Run: ${RUN_URL}
          EOF
          cat "${SUMMARY_DIR}/nightly_${RUN_ID}.md"

      - name: Build Nightly failure issue context
        if: failure() || needs.runner-preflight.result == 'failure' || needs.nightly-l3.result == 'failure' || needs.paper-v2-live.result == 'failure' || needs.dr-snapshot.result == 'failure' || needs.dr-validate.result == 'failure' || needs.code-intelligence-weekly.result == 'failure'
        env:
          RUNNER_PREFLIGHT_RESULT: ${{ needs.runner-preflight.result }}
          DR_RESULT: ${{ needs.dr-snapshot.result }}
          DR_VALIDATE_RESULT: ${{ needs.dr-validate.result }}
          L3_RESULT: ${{ needs.nightly-l3.result }}
          LIVE_RESULT: ${{ needs.paper-v2-live.result }}
          CODE_INTELLIGENCE_RESULT: ${{ needs.code-intelligence-weekly.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p tmp/validation/nightly_failure_issue
          cat > tmp/validation/nightly_failure_issue/status.json <<EOF
          {
            "statuses": {
              "runnerPreflight": "${RUNNER_PREFLIGHT_RESULT}",
              "drSnapshot": "${DR_RESULT}",
              "drValidate": "${DR_VALIDATE_RESULT}",
              "nightlyL3": "${L3_RESULT}",
              "paperV2Live": "${LIVE_RESULT}",
              "codeIntelligence": "${CODE_INTELLIGENCE_RESULT}"
            },
            "run_id": "${{ github.run_id }}",
            "run_url": "${RUN_URL}"
          }
          EOF
          python scripts/ci_failure_issue_summary.py \
            --repo "${{ github.repository }}" \
            --nightly-status-json tmp/validation/nightly_failure_issue/status.json \
            --run-id "${{ github.run_id }}" \
            --run-url "${RUN_URL}" \
            --severity "P1" \
            --source-name "AIstock Nightly" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --output tmp/validation/nightly_failure_issue/summary.json \
            --markdown-output tmp/validation/nightly_failure_issue/body.md \
            --context-output tmp/validation/nightly_failure_issue/context-pack.json \
            --context-markdown-output tmp/validation/nightly_failure_issue/context-pack.md \
            --github-issue-payload-output tmp/validation/nightly_failure_issue/github-issue-payload.json \
            --candidate-history-dir tmp/validation/nightly_failure_issue/candidate_history \
            --stdout-format compact

      - name: Upload Nightly failure issue context
        if: failure() || needs.runner-preflight.result == 'failure' || needs.nightly-l3.result == 'failure' || needs.paper-v2-live.result == 'failure' || needs.dr-snapshot.result == 'failure' || needs.dr-validate.result == 'failure' || needs.code-intelligence-weekly.result == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure-issue-context
          path: tmp/validation/nightly_failure_issue/
          if-no-files-found: error
          retention-days: 14

      - name: Auto-register failure as actionable GitHub Issue
        if: failure() || needs.runner-preflight.result == 'failure' || needs.nightly-l3.result == 'failure' || needs.paper-v2-live.result == 'failure' || needs.dr-snapshot.result == 'failure' || needs.dr-validate.result == 'failure' || needs.code-intelligence-weekly.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issuePayloadPath = 'tmp/validation/nightly_failure_issue/github-issue-payload.json';
            if (!fs.existsSync(issuePayloadPath)) {
              const summary = JSON.parse(fs.readFileSync('tmp/validation/nightly_failure_issue/summary.json', 'utf8'));
              const policy = summary.issue_creation_policy || {};
              core.info(`No actionable Nightly issue created. policy.allowed=${policy.allowed} reason=${policy.reason || 'unknown'}`);
              return;
            }
            const payload = JSON.parse(fs.readFileSync(issuePayloadPath, 'utf8'));
            const {owner, repo} = context.repo;
            const allLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const existingLabels = new Set(allLabels.map((label) => label.name));
            const labels = (payload.labels || [])
              .filter((label) => existingLabels.has(label));
            const marker = payload.dedupe.nightly_marker || payload.dedupe.marker;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const existing = openIssues.find((issue) => !issue.pull_request && ((issue.body || "").includes(marker) || issue.title === payload.title));
            let issueNumber;
            if (existing) {
              issueNumber = existing.number;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: payload.recurrence_comment,
              });
              const updateParams = {
                owner,
                repo,
                issue_number: issueNumber,
                title: payload.title,
                body: payload.body.replaceAll('--issue <issue-number>', `--issue ${issueNumber}`),
              };
              if (labels.length > 0) {
                updateParams.labels = labels;
              }
              await github.rest.issues.update(updateParams);
            } else {
              const createParams = {
                owner,
                repo,
                title: payload.title,
                body: "Preparing actionable Nightly diagnostics...",
              };
              if (labels.length > 0) {
                createParams.labels = labels;
              }
              const created = await github.rest.issues.create(createParams);
              issueNumber = created.data.number;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                body: payload.body.replaceAll('--issue <issue-number>', `--issue ${issueNumber}`),
              });
            }
            core.info(`Nightly failure issue: #${issueNumber}`);

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary-${{ github.run_id }}
          path: tmp/validation/nightly_summary/
          if-no-files-found: ignore


