name: Issue On Test Fail

on:
  workflow_run:
    workflows:
      - AIstock CI
      - AIstock Nightly L3 + DR
    types:
      - completed
  workflow_dispatch:
    inputs:
      severity:
        description: P0/P1 only. Lower severities should be filed manually.
        required: true
        default: P1
        type: choice
        options:
          - P1
          - P0
      run_url:
        description: Failed Actions or Validation Center run URL.
        required: true
        type: string
      summary:
        description: Short failure summary.
        required: true
        type: string
      dry_run:
        description: Log the issue that would be created or updated without writing to GitHub Issues.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-on-test-fail-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  file-p0-p1-issue:
    name: File P0/P1 failure issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Issue writes are restricted to failed default-branch monitored workflows or explicit manual dispatch.
    # Pull-request branch failures stay on the PR checks surface unless a human dispatches this workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    steps:
      - uses: actions/checkout@v4

      - name: Build failure issue summary
        id: failure_summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_URL: ${{ github.event.inputs.run_url || '' }}
          INPUT_SEVERITY: ${{ github.event.inputs.severity || 'P1' }}
          INPUT_SUMMARY: ${{ github.event.inputs.summary || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          mkdir -p tmp/validation/ci_failure_issue
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/ci_failure_issue_summary.py \
              --repo "${{ github.repository }}" \
              --run-id "${{ github.run_id }}" \
              --run-url "${INPUT_RUN_URL}" \
              --severity "${INPUT_SEVERITY}" \
              --manual-summary "${INPUT_SUMMARY}" \
              --source-name "manual dispatch" \
              --branch "${GITHUB_REF_NAME}" \
              --commit "${GITHUB_SHA}" \
              --output tmp/validation/ci_failure_issue/summary.json \
              --markdown-output tmp/validation/ci_failure_issue/body.md \
              --context-output tmp/validation/ci_failure_issue/context-pack.json \
              --context-markdown-output tmp/validation/ci_failure_issue/context-pack.md \
              --github-issue-payload-output tmp/validation/ci_failure_issue/github-issue-payload.json
          else
            python scripts/ci_failure_issue_summary.py \
              --repo "${{ github.repository }}" \
              --run-id "${{ github.event.workflow_run.id }}" \
              --run-url "${{ github.event.workflow_run.html_url }}" \
              --severity "P1" \
              --output tmp/validation/ci_failure_issue/summary.json \
              --markdown-output tmp/validation/ci_failure_issue/body.md \
              --context-output tmp/validation/ci_failure_issue/context-pack.json \
              --context-markdown-output tmp/validation/ci_failure_issue/context-pack.md \
              --github-issue-payload-output tmp/validation/ci_failure_issue/github-issue-payload.json
          fi

      - name: Upload failure issue context
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-issue-context
          path: tmp/validation/ci_failure_issue/
          if-no-files-found: error
          retention-days: 14

      - name: Create or update failure issue
        uses: actions/github-script@v7
        env:
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isManual = context.eventName === 'workflow_dispatch';
            const dryRun = isManual && String(process.env.INPUT_DRY_RUN || '').toLowerCase() === 'true';
            const issuePayloadPath = 'tmp/validation/ci_failure_issue/github-issue-payload.json';
            if (!fs.existsSync(issuePayloadPath)) {
              const summary = JSON.parse(fs.readFileSync('tmp/validation/ci_failure_issue/summary.json', 'utf8'));
              const policy = summary.issue_creation_policy || {};
              core.info(`No actionable issue created. policy.allowed=${policy.allowed} reason=${policy.reason || 'unknown'}`);
              return;
            }
            const payload = JSON.parse(fs.readFileSync(issuePayloadPath, 'utf8'));
            const summary = JSON.parse(fs.readFileSync('tmp/validation/ci_failure_issue/summary.json', 'utf8'));
            const severity = summary.severity || 'P1';
            if (!['P0', 'P1'].includes(severity)) {
              core.setFailed('Only P0/P1 auto-file behavior is allowed.');
              return;
            }
            const runId = String(summary.run_id || context.runId);
            const runUrl = summary.run_url || `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const fingerprint = payload.dedupe?.fingerprint || summary.fingerprint || `run-${runId}`;
            const marker = payload.dedupe?.marker || `<!-- aistock-ci-failure-fingerprint:${fingerprint} -->`;
            const title = payload.title || summary.issue_title || `[${severity}] ${summary.workflow || 'AIstock CI'} failed on ${summary.branch || 'unknown'}`;
            const query = payload.dedupe?.search_query || `repo:${owner}/${repo} is:issue in:body ${marker}`;
            const existing = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });
            const failedJobs = summary.failed_jobs || [];
            const renderBody = (issueNumber) => payload.body.replaceAll('--issue <issue-number>', `--issue ${issueNumber}`);
            const labels = [
              ...(payload.labels || []),
            ];

            if (dryRun) {
              core.info(`[dry-run] Would create or update issue: ${title}`);
              core.info(payload.body);
              return;
            }

            if (existing.data.items.length) {
              const issue = existing.data.items[0];
              const recurrenceBody = [
                `### Recurrence observed for fingerprint ${fingerprint}`,
                '',
                `- Latest run: ${runUrl}`,
                `- Branch: ${summary.branch || 'unknown'}`,
                `- Commit: ${summary.commit || 'unknown'}`,
                `- Diagnostic status: ${summary.diagnostic_status || 'partial'}`,
                `- Failed jobs: ${failedJobs.map((job) => job.job_name).filter(Boolean).join(', ') || 'unknown'}`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: recurrenceBody,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                title,
                body: renderBody(issue.number),
              });
              core.info(`Existing issue #${issue.number} already tracks fingerprint ${fingerprint}.`);
              return;
            }

            try {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: 'Preparing actionable CI diagnostics...',
                labels,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: created.data.number,
                body: renderBody(created.data.number),
              });
              core.info(`Created issue #${created.data.number}.`);
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
              core.warning(`Could not apply labels (${labels.join(', ')}); retrying without labels.`);
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: 'Preparing actionable CI diagnostics...',
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: created.data.number,
                body: renderBody(created.data.number),
              });
              core.info(`Created issue #${created.data.number} without labels.`);
            }
