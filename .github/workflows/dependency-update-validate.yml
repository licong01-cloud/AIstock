name: Dependency Update Validate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/renovate.json
      - pyproject.toml
      - requirements*.txt
      - .github/requirements/*.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/dependency-update-validate.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-update-validate:
    name: Validate dependency update surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox pyyaml pytest

      - name: Select validation for dependency surface
        run: |
          mkdir -p tmp/validation/dependency_update
          python scripts/issue_flow.py validation-select \
            --changed-file requirements.txt \
            --output tmp/validation/dependency_update/selection.json
          cat tmp/validation/dependency_update/selection.json

      - name: Static gate
        run: python -m nox -s l0
