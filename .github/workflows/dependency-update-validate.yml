name: Dependency Update Validate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/renovate.json
      - pyproject.toml
      - requirements*.txt
      - .github/requirements/*.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/dependency-update-validate.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-update-validate:
    name: Validate dependency update surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install nox pyyaml pytest

      - name: Detect and select the changed dependency surface
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tmp/validation/dependency_update
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRT "$base_sha" "$HEAD_SHA")
          dependency_files=()
          has_frontend=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              requirements*.txt|.github/requirements/*.txt|pyproject.toml|frontend/package.json|frontend/package-lock.json|.github/renovate.json|.github/workflows/dependency-update-validate.yml)
                dependency_files+=("$file")
                ;;
            esac
            case "$file" in
              frontend/package.json|frontend/package-lock.json)
                has_frontend=true
                ;;
            esac
          done

          if [[ ${#dependency_files[@]} -eq 0 ]]; then
            echo "No changed dependency file matched the workflow trigger." >&2
            exit 1
          fi

          printf '%s\n' "${dependency_files[@]}" > tmp/validation/dependency_update/changed-files.txt
          selection_args=()
          for file in "${dependency_files[@]}"; do
            selection_args+=(--changed-file "$file")
          done
          python scripts/issue_flow.py validation-select \
            "${selection_args[@]}" \
            --output tmp/validation/dependency_update/selection.json
          python -c "import json; p=json.load(open('tmp/validation/dependency_update/selection.json', encoding='utf-8')); print({'required_plans': p.get('required_plans', []), 'production_gates': p.get('production_gates', {})})"
          echo "frontend=$has_frontend" >> "$GITHUB_OUTPUT"

      - name: Validate changed Python dependency files
        run: |
          while IFS= read -r file; do
            case "$file" in
              requirements*.txt|.github/requirements/*.txt)
                python -m pip install --dry-run -r "$file"
                ;;
              pyproject.toml)
                python -m pip install --dry-run .
                ;;
              .github/renovate.json)
                python -m json.tool "$file" > /dev/null
                ;;
            esac
          done < tmp/validation/dependency_update/changed-files.txt

      - name: Set up Node.js 20
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate changed frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Static gate
        run: python -m nox -s l0
