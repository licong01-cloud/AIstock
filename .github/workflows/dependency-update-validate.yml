name: Dependency Update Validate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/renovate.json
      - pyproject.toml
      - requirements*.txt
      - .github/requirements/*.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/dependency-update-validate.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-update-validate:
    name: Validate dependency update surface
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Verify prebuilt AIstock-CI tooling
        shell: powershell
        run: python scripts/ci_environment_verify.py

      - name: Detect and select the changed dependency surface
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tmp/validation/dependency_update
          python scripts/ci_changed_files.py \
            --output tmp/validation/dependency_update/all-changed-files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT \
            > tmp/validation/dependency_update/changed-files-receipt.json
          base_commit=$(python -c "import json; print(json.load(open('tmp/validation/dependency_update/changed-files-receipt.json', encoding='utf-8'))['base_commit'])")
          mapfile -t changed_files < tmp/validation/dependency_update/all-changed-files.txt
          dependency_files=()
          has_frontend=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              requirements*.txt|.github/requirements/*.txt|pyproject.toml|frontend/package.json|frontend/package-lock.json|.github/renovate.json|.github/workflows/dependency-update-validate.yml)
                dependency_files+=("$file")
                ;;
            esac
            case "$file" in
              frontend/package.json|frontend/package-lock.json)
                has_frontend=true
                ;;
            esac
          done

          if [[ ${#dependency_files[@]} -eq 0 ]]; then
            echo "No changed dependency file matched the workflow trigger." >&2
            exit 1
          fi

          printf '%s\n' "${dependency_files[@]}" > tmp/validation/dependency_update/changed-files.txt
          selection_args=()
          for file in "${dependency_files[@]}"; do
            selection_args+=(--changed-file "$file")
          done
          python scripts/issue_flow.py validation-select \
            "${selection_args[@]}" \
            --output tmp/validation/dependency_update/selection.json
          python -c "import json; p=json.load(open('tmp/validation/dependency_update/selection.json', encoding='utf-8')); print({'required_plans': p.get('required_plans', []), 'production_gates': p.get('production_gates', {})})"
          echo "frontend=$has_frontend" >> "$GITHUB_OUTPUT"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          echo "head_commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate changed Python dependency files
        run: |
          while IFS= read -r file; do
            case "$file" in
              requirements*.txt|.github/requirements/*.txt)
                key=$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)
                changed="tmp/validation/dependency_update/${key}.changed.txt"
                constraints="tmp/validation/dependency_update/${key}.constraints.txt"
                summary="tmp/validation/dependency_update/${key}.summary.json"
                python scripts/validate_changed_requirements.py \
                  --base-commit "${{ steps.changes.outputs.base_commit }}" \
                  --head-commit "${{ steps.changes.outputs.head_commit }}" \
                  --file "$file" \
                  --requirements-output "$changed" \
                  --constraints-output "$constraints" \
                  --summary-output "$summary"
                if [[ -s "$changed" ]]; then
                  python -m pip check
                fi
                ;;
              pyproject.toml)
                python -m pip check
                ;;
              .github/renovate.json)
                python -m json.tool "$file" > /dev/null
                ;;
            esac
          done < tmp/validation/dependency_update/changed-files.txt

      - name: Validate changed frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          if [ ! -d node_modules ]; then
            echo 'frontend/node_modules is not prebuilt; dependency installation is prohibited in CI' >&2
            exit 1
          fi
          ./node_modules/.bin/tsc --noEmit
          npm run lint

      - name: Static gate
        run: |
          mapfile -t changed_files < tmp/validation/dependency_update/changed-files.txt
          python -m nox -s l0 -- "${changed_files[@]}"
