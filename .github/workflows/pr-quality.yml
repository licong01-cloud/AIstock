name: AIstock PR Quality

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for local dry-run style checks.
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr-quality:
    name: Context, scope, and open-source tooling dry-run
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-')) }}
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify prebuilt AIstock-CI tooling
        shell: powershell
        run: python scripts/ci_environment_verify.py

      - name: Detect PR quality lane
        id: quality_lane
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CHECKOUT_REF: ${{ github.ref || '' }}
        run: |
          mkdir -p tmp/validation/pr_quality
          python scripts/ci_changed_files.py \
            --prepare-pr-merge-base-only \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --checkout-ref "${CHECKOUT_REF}"
          BASE_COMMIT="origin/${BASE_REF}"
          git diff --name-only "${BASE_COMMIT}...HEAD" > tmp/validation/pr_quality/changed_files.txt
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/pr_quality/changed_files.txt \
            --output-json tmp/validation/pr_quality/change-classification.json
          DOCS_LITE=$(python -c "import json; print('1' if json.load(open('tmp/validation/pr_quality/change-classification.json', encoding='utf-8'))['docs_lite_required'] else '0')")
          REGISTRY_SYNC=$(python -c "import json; print('1' if json.load(open('tmp/validation/pr_quality/change-classification.json', encoding='utf-8'))['close_sync_metadata_only'] else '0')")
          CLASSIFICATION=$(python -c "import json; print(json.load(open('tmp/validation/pr_quality/change-classification.json', encoding='utf-8'))['classification'])")
          echo "docs_lite=${DOCS_LITE}" >> "${GITHUB_OUTPUT}"
          echo "registry_sync=${REGISTRY_SYNC}" >> "${GITHUB_OUTPUT}"
          echo "classification=${CLASSIFICATION}" >> "${GITHUB_OUTPUT}"

      - name: Build AIstock PR quality summary
        if: steps.quality_lane.outputs.docs_lite != '1' && steps.quality_lane.outputs.registry_sync != '1'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
          AISTOCK_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          AISTOCK_PR_BODY: ${{ github.event.pull_request.body || '' }}
          AISTOCK_PR_QUALITY_ENFORCE_P0P1: ${{ vars.AISTOCK_PR_QUALITY_ENFORCE_P0P1 || 'true' }}
        run: |
          mkdir -p tmp/validation/pr_quality
          # Reuse the base ref prepared by Detect PR quality lane; fetch only for manual runs.
          if ! git rev-parse --verify "refs/remotes/origin/${BASE_REF}" >/dev/null 2>&1; then
            git fetch origin "${BASE_REF}" --no-tags --depth=1
          fi
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          ENFORCE_ARGS=()
          if [ "${AISTOCK_PR_QUALITY_ENFORCE_P0P1}" = "true" ]; then
            ENFORCE_ARGS+=(--enforce-p0-p1-evidence)
          fi
          python scripts/issue_flow.py pr-check \
            --base "${BASE_COMMIT}" \
            --head HEAD \
            --output-json tmp/validation/pr_quality/summary.json \
            --output-md tmp/validation/pr_quality/summary.md \
            "${ENFORCE_ARGS[@]}"
          cat tmp/validation/pr_quality/summary.md

      - name: Build docs-lite version record
        if: steps.quality_lane.outputs.docs_lite == '1'
        run: |
          mkdir -p tmp/validation/pr_quality
          {
            echo "# Docs-lite version record"
            echo ""
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo "- code_intelligence: skipped"
            echo "- semgrep: skipped"
            echo "- codeql: skipped"
            echo ""
            echo "## Changed files"
            sed 's/^/- `/' tmp/validation/pr_quality/changed_files.txt | sed 's/$/`/'
          } > tmp/validation/pr_quality/summary.md
          cp tmp/validation/pr_quality/summary.md tmp/validation/pr_quality/docs-lite-version-record.md
          printf '{"docs_lite":true,"validation":"version_change_record_only"}\n' > tmp/validation/pr_quality/summary.json
          cat tmp/validation/pr_quality/summary.md

      - name: Build registry-sync quality record
        if: steps.quality_lane.outputs.registry_sync == '1'
        run: |
          mkdir -p tmp/validation/pr_quality
          python scripts/bug_registry_metadata_check.py \
            --changed-files-file tmp/validation/pr_quality/changed_files.txt \
            --close-sync-only \
            --output-json tmp/validation/pr_quality/bug-registry-metadata.json
          {
            echo "# Registry-sync PR quality record"
            echo ""
            echo "- classification: `${{ steps.quality_lane.outputs.classification }}`"
            echo "- validation: BUG JSON schema/linkage/gates only"
            echo "- code_validation: skipped"
            echo "- code_intelligence: skipped"
            echo "- semgrep: skipped"
            echo ""
            echo "## Changed files"
            sed 's/^/- `/' tmp/validation/pr_quality/changed_files.txt | sed 's/$/`/'
          } > tmp/validation/pr_quality/summary.md
          printf '{"registry_sync":true,"validation":"bug_registry_metadata_only"}\n' > tmp/validation/pr_quality/summary.json
          cat tmp/validation/pr_quality/summary.md

      - name: Build code intelligence PR artifact
        if: steps.quality_lane.outputs.docs_lite != '1' && steps.quality_lane.outputs.registry_sync != '1'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          git diff --name-only "${BASE_COMMIT}...HEAD" > tmp/validation/pr_quality/changed_files.txt
          python scripts/code_intelligence_adapter.py summary \
            --item-id "PR-${{ github.event.pull_request.number || github.run_id }}" \
            --query "AIstock PR ${{ github.event.pull_request.number || github.run_id }} impact and affected tests" \
            --changed-files-file tmp/validation/pr_quality/changed_files.txt \
            --skip-external \
            --output tmp/validation/pr_quality/code-intelligence-summary.json \
            --output-md tmp/validation/pr_quality/code-intelligence-summary.md
          cat tmp/validation/pr_quality/code-intelligence-summary.md

      - name: Ruff changed Python files
        if: steps.quality_lane.outputs.docs_lite != '1' && steps.quality_lane.outputs.registry_sync != '1'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          git diff --name-only --diff-filter=ACMRT "${BASE_COMMIT}...HEAD" -- '*.py' > tmp/validation/pr_quality/changed_python.txt
          if [ -s tmp/validation/pr_quality/changed_python.txt ]; then
            xargs -a tmp/validation/pr_quality/changed_python.txt ruff check --force-exclude
          else
            echo "No changed Python files."
          fi

      - name: Emit compact PR quality receipt
        if: always()
        shell: bash
        run: |
          CLASSIFICATION=unknown
          if [ -f tmp/validation/pr_quality/change-classification.json ]; then
            CLASSIFICATION=$(python -c "import json; print(json.load(open('tmp/validation/pr_quality/change-classification.json', encoding='utf-8')).get('classification', 'unknown'))")
          fi
          SUMMARY_STATUS=missing
          [ -f tmp/validation/pr_quality/summary.json ] && SUMMARY_STATUS=present
          CODE_INTELLIGENCE_STATUS=not_required
          [ -f tmp/validation/pr_quality/code-intelligence-summary.json ] && CODE_INTELLIGENCE_STATUS=present
          echo "gate=pr_quality_receipt classification=${CLASSIFICATION} summary=${SUMMARY_STATUS} code_intelligence=${CODE_INTELLIGENCE_STATUS} artifact_upload=disabled"

