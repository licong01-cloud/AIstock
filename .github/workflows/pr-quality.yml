name: AIstock PR Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for local dry-run style checks.
        required: false
        default: main
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr-quality:
    name: Context, scope, and open-source tooling dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-lite lane
        id: docs_lite
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          mkdir -p tmp/validation/pr_quality
          git fetch origin "${BASE_REF}" --no-tags || true
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          git diff --name-only "${BASE_COMMIT}...HEAD" > tmp/validation/pr_quality/changed_files.txt
          DOCS_LITE=1
          while IFS= read -r path; do
            case "${path}" in
              docs/architecture/*|docs/analysis/*|docs/operations/*|docs/operations_*.md|README.md)
                ;;
              docs/standards/*|docs/codex_project_memory.md|AGENTS.md|AGENTS.override.md|.codex/*|.claude/*)
                DOCS_LITE=0
                break
                ;;
              "")
                ;;
              *)
                DOCS_LITE=0
                break
                ;;
            esac
          done < tmp/validation/pr_quality/changed_files.txt
          echo "docs_lite=${DOCS_LITE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python 3.12
        if: steps.docs_lite.outputs.docs_lite != '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/pr-quality.txt

      - name: Install quality tooling
        if: steps.docs_lite.outputs.docs_lite != '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r .github/requirements/pr-quality.txt

      - name: Build AIstock PR quality summary
        if: steps.docs_lite.outputs.docs_lite != '1'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
          AISTOCK_PR_TITLE: ${{ github.event.pull_request.title || '' }}
          AISTOCK_PR_BODY: ${{ github.event.pull_request.body || '' }}
          AISTOCK_PR_QUALITY_ENFORCE_P0P1: ${{ vars.AISTOCK_PR_QUALITY_ENFORCE_P0P1 || 'true' }}
        run: |
          mkdir -p tmp/validation/pr_quality
          # Keep base history available for three-dot diffs on branches that merge main.
          git fetch origin "${BASE_REF}" --no-tags || true
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          ENFORCE_ARGS=()
          if [ "${AISTOCK_PR_QUALITY_ENFORCE_P0P1}" = "true" ]; then
            ENFORCE_ARGS+=(--enforce-p0-p1-evidence)
          fi
          python scripts/issue_flow.py pr-check \
            --base "${BASE_COMMIT}" \
            --head HEAD \
            --output-json tmp/validation/pr_quality/summary.json \
            --output-md tmp/validation/pr_quality/summary.md \
            "${ENFORCE_ARGS[@]}"
          cat tmp/validation/pr_quality/summary.md

      - name: Build docs-lite version record
        if: steps.docs_lite.outputs.docs_lite == '1'
        run: |
          mkdir -p tmp/validation/pr_quality
          {
            echo "# Docs-lite version record"
            echo ""
            echo "- validation: version/change-record only"
            echo "- code_validation: skipped"
            echo "- code_intelligence: skipped"
            echo "- semgrep: skipped"
            echo "- codeql: skipped"
            echo ""
            echo "## Changed files"
            sed 's/^/- `/' tmp/validation/pr_quality/changed_files.txt | sed 's/$/`/'
          } > tmp/validation/pr_quality/summary.md
          cp tmp/validation/pr_quality/summary.md tmp/validation/pr_quality/docs-lite-version-record.md
          printf '{"docs_lite":true,"validation":"version_change_record_only"}\n' > tmp/validation/pr_quality/summary.json
          cat tmp/validation/pr_quality/summary.md

      - name: Build code intelligence PR artifact
        if: steps.docs_lite.outputs.docs_lite != '1'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          git diff --name-only "${BASE_COMMIT}...HEAD" > tmp/validation/pr_quality/changed_files.txt
          python scripts/code_intelligence_adapter.py summary \
            --item-id "PR-${{ github.event.pull_request.number || github.run_id }}" \
            --query "AIstock PR ${{ github.event.pull_request.number || github.run_id }} impact and affected tests" \
            --changed-files-file tmp/validation/pr_quality/changed_files.txt \
            --skip-external \
            --output tmp/validation/pr_quality/code-intelligence-summary.json \
            --output-md tmp/validation/pr_quality/code-intelligence-summary.md
          cat tmp/validation/pr_quality/code-intelligence-summary.md

      - name: Ruff changed Python files
        if: steps.docs_lite.outputs.docs_lite != '1'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          git diff --name-only --diff-filter=ACMRT "${BASE_COMMIT}...HEAD" -- '*.py' > tmp/validation/pr_quality/changed_python.txt
          if [ -s tmp/validation/pr_quality/changed_python.txt ]; then
            xargs -a tmp/validation/pr_quality/changed_python.txt ruff check --force-exclude
          else
            echo "No changed Python files."
          fi

      - name: Semgrep AIstock guardrails (report-only phase)
        if: steps.docs_lite.outputs.docs_lite != '1'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          BASE_COMMIT="origin/${BASE_REF}"
          git rev-parse --verify "${BASE_COMMIT}" >/dev/null 2>&1 || BASE_COMMIT="FETCH_HEAD"
          git diff --name-only --diff-filter=ACMRT "${BASE_COMMIT}...HEAD" > tmp/validation/pr_quality/semgrep_changed_files.txt
          if [ -s tmp/validation/pr_quality/semgrep_changed_files.txt ]; then
            xargs -a tmp/validation/pr_quality/semgrep_changed_files.txt semgrep --config .semgrep.yml --json --output tmp/validation/pr_quality/semgrep.json
          else
            printf '{"results":[],"errors":[],"paths":{"scanned":[]}}\n' > tmp/validation/pr_quality/semgrep.json
          fi

      - name: Comment PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- aistock-pr-quality-summary -->';
            const summaryPath = 'tmp/validation/pr_quality/summary.md';
            const codeIntelPath = 'tmp/validation/pr_quality/code-intelligence-summary.md';
            const docsLitePath = 'tmp/validation/pr_quality/docs-lite-version-record.md';
            const summary = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : 'PR quality summary was not generated.';
            const codeIntel = fs.existsSync(codeIntelPath) ? fs.readFileSync(codeIntelPath, 'utf8') : 'Code intelligence summary was not generated.';
            const docsLite = fs.existsSync(docsLitePath) ? fs.readFileSync(docsLitePath, 'utf8') : '';
            const maxChars = 55000;
            const compactFooter = 'Semgrep and code intelligence are report-only in this rollout; existing AIstock CI remains the blocking gate.';
            let body = `${marker}\n${summary}`;
            if (docsLite) {
              body = `${marker}\n${docsLite}\n\n${summary}`;
            } else {
              body = `${marker}\n${summary}\n\n${codeIntel}`;
            }
            body = `${body}\n\n${compactFooter}`;
            if (body.length > maxChars) {
              body = `${marker}\n${summary}\n\nCode intelligence summary was omitted from the PR comment because the compact budget was exceeded. See the uploaded pr-quality artifact for details.\n\n${compactFooter}`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload PR quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-${{ github.run_id }}
          path: tmp/validation/pr_quality/
          if-no-files-found: ignore

