name: Semgrep

on:
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GIT_HTTP_LOW_SPEED_LIMIT: '524288'
  GIT_HTTP_LOW_SPEED_TIME: '30'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

jobs:
  semgrep:
    name: AIstock Semgrep guardrails
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'chore/BUG-') && contains(github.head_ref, '-close-sync-')) }}
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 20
    steps:
      - name: Prepare verified local Git object mirror
        id: git_mirror
        shell: powershell
        run: |
          $env:GIT_ALTERNATE_OBJECT_DIRECTORIES = ''
          $mirrorRoot = 'F:\Dev\github-actions-runner\prebuilt\git\AIstock.git'
          $manifestPath = $mirrorRoot + '.aistock-mirror.json'
          $objects = ''
          try {
            $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            if ($manifest.schema_version -ne 'aistock_git_object_mirror_v1') { throw 'unsupported mirror manifest' }
            if ($manifest.repository -ne $env:GITHUB_REPOSITORY) { throw 'mirror repository mismatch' }
            if ((& git -C $mirrorRoot rev-parse --is-bare-repository) -ne 'true') { throw 'mirror is not bare' }
            $mirrorSha = (& git -C $mirrorRoot rev-parse --verify 'refs/heads/main^{commit}').Trim()
            if ($LASTEXITCODE -ne 0 -or $mirrorSha -ne $manifest.main_sha) { throw 'mirror main identity mismatch' }
            $objects = [System.IO.Path]::GetFullPath((Join-Path $mirrorRoot 'objects'))
            $workspaceHead = Join-Path $env:GITHUB_WORKSPACE '.git\HEAD'
            if (-not (Test-Path -LiteralPath $workspaceHead -PathType Leaf)) {
              & git -C $env:GITHUB_WORKSPACE init --quiet | Out-Null
              & git -C $env:GITHUB_WORKSPACE remote get-url origin 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { & git -C $env:GITHUB_WORKSPACE remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY" } else { & git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/$env:GITHUB_REPOSITORY" }
              & git -C $env:GITHUB_WORKSPACE fetch --quiet --force --no-tags --no-write-fetch-head $mirrorRoot 'refs/heads/main:refs/remotes/aistock-mirror/main' | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'local mirror seed fetch failed' }
              & git -C $env:GITHUB_WORKSPACE checkout --quiet --force --detach refs/remotes/aistock-mirror/main | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'local mirror seed checkout failed' }
            }
            "git_object_mirror status=ready main_sha=$mirrorSha"
          } catch {
            Write-Warning "git_object_mirror status=unavailable fallback=bounded_remote reason=$($_.Exception.Message)"
            $objects = ''
          }
          "objects=$objects" >> $env:GITHUB_OUTPUT
          "GIT_ALTERNATE_OBJECT_DIRECTORIES=$objects" >> $env:GITHUB_ENV
          exit 0

      - uses: actions/checkout@v7
        timeout-minutes: 5
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ steps.git_mirror.outputs.objects }}
        with:
          fetch-depth: 2

      - name: Reclaim interrupted Git pack fragments
        if: ${{ always() }}
        continue-on-error: true
        shell: powershell
        run: |
          $workspaceRoot = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar
          )
          $packRoot = [System.IO.Path]::GetFullPath((Join-Path $workspaceRoot '.git\objects\pack'))
          $workspacePrefix = $workspaceRoot + [System.IO.Path]::DirectorySeparatorChar
          if (-not $packRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Git pack root escaped runner workspace: $packRoot"
          }
          $fragments = @(
            Get-ChildItem -LiteralPath $packRoot -File -Filter 'tmp_pack_*' -ErrorAction SilentlyContinue
          )
          $removedBytes = ($fragments | Measure-Object -Property Length -Sum).Sum
          foreach ($fragment in $fragments) {
            Remove-Item -LiteralPath $fragment.FullName -Force -ErrorAction Stop
          }
          "interrupted_git_pack_cleanup count=$($fragments.Count) bytes=$([long]$removedBytes)"

      - name: Fetch current PR base ref only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_REF: ${{ github.ref }}
        run: |
          python scripts/ci_changed_files.py --prepare-pr-merge-base-only \
            --base-ref "${BASE_REF}" --base-sha "${BASE_SHA}" --checkout-ref "${CHECKOUT_REF}"

      - name: Verify prebuilt AIstock-CI and Semgrep tooling
        shell: powershell
        run: |
          python scripts/ci_environment_verify.py
          if (-not (Get-Command semgrep -ErrorAction SilentlyContinue)) { throw 'semgrep is not preinstalled on aistock-ci runner' }

      - name: Detect Semgrep fast lane
        id: fast_lane
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/semgrep
          python scripts/ci_changed_files.py \
            --output tmp/validation/semgrep/semgrep_changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/semgrep/semgrep_changed_files.txt \
            --output-json tmp/validation/semgrep/change-classification.json
          DOCS_LITE=$(python -c "import json; print('1' if json.load(open('tmp/validation/semgrep/change-classification.json', encoding='utf-8'))['docs_lite_required'] else '0')")
          REGISTRY_SYNC=$(python -c "import json; print('1' if json.load(open('tmp/validation/semgrep/change-classification.json', encoding='utf-8'))['close_sync_metadata_only'] else '0')")
          echo "docs_lite=${DOCS_LITE}" >> "${GITHUB_OUTPUT}"
          echo "registry_sync=${REGISTRY_SYNC}" >> "${GITHUB_OUTPUT}"

      - name: Run Semgrep
        if: steps.fast_lane.outputs.docs_lite != '1' && steps.fast_lane.outputs.registry_sync != '1'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tmp/validation/semgrep
          python scripts/ci_changed_files.py \
            --output tmp/validation/semgrep/semgrep_changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT
          if [ -s tmp/validation/semgrep/semgrep_changed_files.txt ]; then
            xargs -a tmp/validation/semgrep/semgrep_changed_files.txt semgrep --config .semgrep.yml --json --output tmp/validation/semgrep/semgrep.json
          else
            printf '{"results":[],"errors":[],"paths":{"scanned":[]}}\n' > tmp/validation/semgrep/semgrep.json
          fi

      - name: Emit fast-lane semgrep no-op record
        if: steps.fast_lane.outputs.docs_lite == '1' || steps.fast_lane.outputs.registry_sync == '1'
        run: |
          python -c "import json; data=json.load(open('tmp/validation/semgrep/change-classification.json', encoding='utf-8')); print(json.dumps({'docs_lite': data['docs_lite_required'], 'registry_sync': data['close_sync_metadata_only'], 'validation': data['classification'], 'semgrep': 'skipped'}, ensure_ascii=False))" > tmp/validation/semgrep/semgrep.json
          cat tmp/validation/semgrep/semgrep.json

