name: Semgrep

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  semgrep:
    name: AIstock Semgrep guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        run: |
          mkdir -p tmp/validation/semgrep
          semgrep --config .semgrep.yml --json --output tmp/validation/semgrep/semgrep.json .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ github.run_id }}
          path: tmp/validation/semgrep/
          if-no-files-found: ignore
