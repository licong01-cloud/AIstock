name: Semgrep

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'tests/aistock_validation/bugs/**'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  semgrep:
    name: AIstock Semgrep guardrails
    runs-on: [self-hosted, Windows, aistock-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify prebuilt AIstock-CI and Semgrep tooling
        shell: powershell
        run: |
          python scripts/ci_environment_verify.py
          if (-not (Get-Command semgrep -ErrorAction SilentlyContinue)) { throw 'semgrep is not preinstalled on aistock-ci runner' }

      - name: Detect Semgrep fast lane
        id: fast_lane
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tmp/validation/semgrep
          python scripts/ci_changed_files.py \
            --output tmp/validation/semgrep/semgrep_changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT
          python scripts/ci_change_classifier.py \
            --changed-files-file tmp/validation/semgrep/semgrep_changed_files.txt \
            --output-json tmp/validation/semgrep/change-classification.json
          DOCS_LITE=$(python -c "import json; print('1' if json.load(open('tmp/validation/semgrep/change-classification.json', encoding='utf-8'))['docs_lite_required'] else '0')")
          REGISTRY_SYNC=$(python -c "import json; print('1' if json.load(open('tmp/validation/semgrep/change-classification.json', encoding='utf-8'))['close_sync_metadata_only'] else '0')")
          echo "docs_lite=${DOCS_LITE}" >> "${GITHUB_OUTPUT}"
          echo "registry_sync=${REGISTRY_SYNC}" >> "${GITHUB_OUTPUT}"

      - name: Run Semgrep
        if: steps.fast_lane.outputs.docs_lite != '1' && steps.fast_lane.outputs.registry_sync != '1'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p tmp/validation/semgrep
          python scripts/ci_changed_files.py \
            --output tmp/validation/semgrep/semgrep_changed_files.txt \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --diff-filter ACMRT
          if [ -s tmp/validation/semgrep/semgrep_changed_files.txt ]; then
            xargs -a tmp/validation/semgrep/semgrep_changed_files.txt semgrep --config .semgrep.yml --json --output tmp/validation/semgrep/semgrep.json
          else
            printf '{"results":[],"errors":[],"paths":{"scanned":[]}}\n' > tmp/validation/semgrep/semgrep.json
          fi

      - name: Emit fast-lane semgrep no-op record
        if: steps.fast_lane.outputs.docs_lite == '1' || steps.fast_lane.outputs.registry_sync == '1'
        run: |
          python -c "import json; data=json.load(open('tmp/validation/semgrep/change-classification.json', encoding='utf-8')); print(json.dumps({'docs_lite': data['docs_lite_required'], 'registry_sync': data['close_sync_metadata_only'], 'validation': data['classification'], 'semgrep': 'skipped'}, ensure_ascii=False))" > tmp/validation/semgrep/semgrep.json
          cat tmp/validation/semgrep/semgrep.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-${{ github.run_id }}
          path: tmp/validation/semgrep/
          if-no-files-found: ignore

