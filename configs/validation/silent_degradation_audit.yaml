schema_version: aistock_silent_degradation_audit_config_v1
purpose: Nightly warning-only audit that lets DeepSeek review compact CodeGraph / Understand Anything / code marker evidence for silent degradation risks.
defaults:
  max_reference_chars_per_doc: 2400
  max_code_files_per_module: 24
  max_code_excerpt_chars_per_file: 1200
  max_findings: 40
policy:
  warning_only: true
  candidate_only: true
  source_modifications_allowed: false
  official_bug_creation_allowed: false
  github_issue_creation_allowed: false
  manual_analysis_required_before_bug_registration: true
modules:
  - module: miniqmt_execution_runtime
    risk: P1
    reference_docs:
      - docs/architecture/miniqmt_unified_vnpy_execution_runtime_design_20260608.md
      - docs/adr/0002-miniqmt-execution-runtime-event-loop-target-architecture.md
      - docs/architecture/miniqmt_durable_execution_runtime_design_20260623.md
    code_paths:
      - backend/services/miniqmt_execution_runtime
      - backend/services/trading_core
      - backend/services/qmt_strategy_ledger
      - backend/tests/miniqmt_execution_runtime
      - backend/tests/trading_core
    requirement_keywords:
      - durable event loop
      - vn.py
      - order-id mapping
      - broker authoritative
      - reconciliation
      - fail closed
    semantic_expected_markers:
      - MiniQMTExecutionRuntime
      - MiniQMTExecutionEventLoop
      - ExecutionAlgoInstance
      - order_id
      - reconciliation
      - fail_closed
    silent_degradation_markers:
      - except Exception
      - contextlib.suppress
      - pass
      - fallback
      - noop
      - best_effort
      - stateless
      - per-tick
      - fake success
      - return []
      - return {}
  - module: paper_v2_runtime
    risk: P1
    reference_docs:
      - docs/architecture/paper_trading_v2_top_level_design.md
      - docs/architecture/paper_trading_v2_runtime_profile_execution_policy_design.md
      - docs/architecture/paper_trading_v2_remaining_execution_plan.md
      - docs/architecture/paper_v2_miniqmt_unified_autorun_design_20260602.md
    code_paths:
      - backend/services/paper_trading_v2
      - backend/tests/paper_trading_v2
      - backend/routers/paper_trading_v2.py
      - frontend/src/app/paper-v2
      - frontend/src/lib/paper-v2
    requirement_keywords:
      - runtime profile
      - execution policy
      - broker authoritative
      - scheduler
      - live session
      - persistence
    semantic_expected_markers:
      - runtime_profile
      - execution_policy
      - broker
      - scheduler
      - live_session
      - terminal
    silent_degradation_markers:
      - except Exception
      - pass
      - fallback
      - mock
      - fake
      - deterministic
      - warning_only
      - best_effort
      - noop
      - stateless
      - return []
      - return {}
  - module: validation_llm_pipeline
    risk: P1
    reference_docs:
      - docs/architecture/aistock_deepseek_github_models_intelligent_validation_design_20260608.md
      - docs/architecture/aistock_nightly_active_bug_discovery_design_20260618.md
      - docs/architecture/aistock_codegraph_nightly_freshness_design_20260602.md
    code_paths:
      - scripts/llm_provider_adapter.py
      - scripts/nightly_adaptive_scheduler.py
      - scripts/nightly_discovery_input_pack.py
      - scripts/nightly_discovery_plans.py
      - scripts/nightly_bug_candidate_queue.py
      - scripts/code_intelligence_adapter.py
      - backend/services/validation
      - backend/tests/scripts/test_llm_provider_adapter.py
      - backend/tests/scripts/test_nightly_adaptive_scheduler.py
