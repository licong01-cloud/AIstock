services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    labels:
      - "com.aistock.component=monitoring"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aistock2026
      - TZ=Asia/Shanghai
    depends_on:
      - prometheus
    labels:
      - "com.aistock.component=monitoring"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./postgres-exporter/custom_queries.yml:/etc/postgres-exporter/custom_queries.yml:ro
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${TDX_DB_PASSWORD}@host.docker.internal:5432/aistock?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres-exporter/custom_queries.yml
    env_file:
      - ../.env
    labels:
      - "com.aistock.component=monitoring"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./textfile_collector:/textfile_collector:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile_collector"
    labels:
      - "com.aistock.component=monitoring"

  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: process-exporter
    restart: unless-stopped
    ports:
      - "9256:9256"
    pid: host
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter/config.yml:/config/config.yml:ro
    command:
      - "--procfs=/host/proc"
      - "--config.path=/config/config.yml"
    labels:
      - "com.aistock.component=monitoring"

volumes:
  prometheus_data:
  grafana_data:
