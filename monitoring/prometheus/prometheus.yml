global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 本机 Node Exporter (Docker 容器内)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          node_id: "wsl2-5080"
          instance_name: "本机 WSL (RTX 5080)"
      - targets: ["192.168.50.215:9100"]
        labels:
          node_id: "rdagent-node1"
          instance_name: "Linux 独立机 (RTX 2060)"

  # Process Exporter — WSL 原生 (能看到 WSL 中的 python 进程)
  - job_name: "process_exporter_native"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:9258"]
        labels:
          node_id: "wsl2-5080"
          instance_name: "本机 WSL (RTX 5080)"

  # Process Exporter — Docker 容器 (只能看到 Docker 内进程)
  - job_name: "process_exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["process-exporter:9256"]
        labels:
          node_id: "wsl2-5080"
          instance_name: "本机 WSL Docker"
      - targets: ["192.168.50.215:9256"]
        labels:
          node_id: "rdagent-node1"
          instance_name: "Linux 独立机 (RTX 2060)"

  # PostgreSQL Exporter
  - job_name: "postgres_exporter"
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          db_instance: "aistock"
